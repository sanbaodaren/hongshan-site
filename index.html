<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏山科学院 · 铁一分部 — 首页</title>
  <meta name="description" content="宏山科学院-铁一分部学习组织：每日一题 · 好题分享 · 成员资料 · 资源共享 · 拓展知识 · 学习方法">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <!-- 导航区（JS 注入） -->
  <div id="headerSlot"></div>

  <main id="pageMain">

    <!-- ============ 主横幅区 ============ -->
    <section class="banner">
      <div data-contour></div>
      <div class="container">
        <p class="banner-overline">DA TIAN SHI FU SHU · TIE YI FEN BU</p>
        <h1 class="banner-title">宏山科学院 · 铁一分部</h1>
        <p class="banner-sub">绿水青山　科学发展</p>
      </div>
      <div class="tianshi" aria-hidden="true">
        <div class="tianshi-cap"></div>
        <div class="tianshi-pillar"></div>
        <div class="tianshi-base"></div>
      </div>
      <div data-water></div>
    </section>

    <!-- ============ 板块索引区 ============ -->
    <section class="board-section">
      <div class="container">

        <div class="section-head">
          <h2 class="section-title"><span class="idx">//</span>板块索引 <span class="idx" style="color:#4a6a7a">SECTIONS</span></h2>
          <p class="section-sub">INDEX · 06</p>
        </div>

        <!-- 工业控制面板 · 实时数据（数值待录入） -->
        <div class="stats" aria-label="组织实时数据">
          <div class="stat">
            <span class="stat-label">今日答题人数</span>
            <span class="stat-value">—</span>
            <span class="stat-note">REALTIME</span>
          </div>
          <div class="stat">
            <span class="stat-label">累计题目</span>
            <span class="stat-value"><b>14</b></span>
            <span class="stat-note">ACCUMULATED</span>
          </div>
          <div class="stat">
            <span class="stat-label">资源总数</span>
            <span class="stat-value">—</span>
            <span class="stat-note">FILES</span>
          </div>
          <div class="stat">
            <span class="stat-label">成员人数</span>
            <span class="stat-value">—</span>
            <span class="stat-note">MEMBERS</span>
          </div>
        </div>

        <!-- 六宫格 -->
        <div class="board-grid">

          <a class="board-card" href="daily.html">
            <span class="card-no">01</span>
            <span class="card-notch" aria-hidden="true"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16"/>
              <path d="M3 9.5h18M8 3v4M16 3v4"/>
              <path d="M8.5 14.5l2.2 2.2 4.8-5.2"/>
            </svg>
            <h3 class="card-title">每日一题</h3>
            <p class="card-desc">每日一练，积跬步以至千里</p>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="board-card" href="share.html">
            <span class="card-no">02</span>
            <span class="card-notch" aria-hidden="true"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
              <path d="M12 3l2.6 6 6 .4-4.6 3.9 1.6 5.9L12 15.6 6.4 19.2 8 13.3 3.4 9.4l6-.4z"/>
              <circle cx="12" cy="12" r="1.2"/>
            </svg>
            <h3 class="card-title">好题分享</h3>
            <p class="card-desc">他山之石，可以攻玉</p>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="board-card" href="members.html">
            <span class="card-no">03</span>
            <span class="card-notch" aria-hidden="true"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
              <rect x="5" y="3.5" width="6" height="6"/>
              <path d="M2.5 20v-2.5a6.5 6.5 0 0 1 11-4.4"/>
              <rect x="14.5" y="6.5" width="5.5" height="5.5"/>
              <path d="M14.5 20v-1a5 5 0 0 1 5-5 5 5 0 0 1 2 .4"/>
            </svg>
            <h3 class="card-title">成员资料</h3>
            <p class="card-desc">同窗共学，相知相长</p>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="board-card" href="resources.html">
            <span class="card-no">04</span>
            <span class="card-notch" aria-hidden="true"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
              <path d="M12 3v9M8.5 8.5L12 12l3.5-3.5"/>
              <path d="M3.5 14.5V20h17v-5.5"/>
            </svg>
            <h3 class="card-title">资源共享</h3>
            <p class="card-desc">博采众长，学无止境</p>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="board-card" href="knowledge.html">
            <span class="card-no">05</span>
            <span class="card-notch" aria-hidden="true"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
              <path d="M12 6.5C10.5 4.9 8.3 4 4 4v14c4.3 0 6.5.9 8 2.5 1.5-1.6 3.7-2.5 8-2.5V4c-4.3 0-6.5.9-8 2.5z"/>
              <path d="M12 6.5v14"/>
            </svg>
            <h3 class="card-title">拓展知识</h3>
            <p class="card-desc">格物致知，开卷有益</p>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="board-card" href="methods.html">
            <span class="card-no">06</span>
            <span class="card-notch" aria-hidden="true"></span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2"/>
              <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
            </svg>
            <h3 class="card-title">学习方法</h3>
            <p class="card-desc">工欲善事，必先利器</p>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

        </div>
      </div>
    </section>

  </main>

  <!-- 底部信息区（JS 注入） -->
  <div id="footerSlot"></div>

  <script src="js/main.js"></script>
</body>
</html>
