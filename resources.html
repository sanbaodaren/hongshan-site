<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源共享 · 宏山科学院-铁一分部</title>
  <meta name="description" content="博采众长，学无止境。宏山科学院-铁一分部资源共享板块。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="resources">

  <div id="headerSlot"></div>

  <main id="pageMain">

    <!-- 页首横幅 -->
    <section class="page-hero">
      <div data-contour></div>
      <div class="container">
        <p class="page-tag">SECTION 04 / RESOURCES</p>
        <h1 class="page-title">资源共享</h1>
        <p class="page-sub">博采众长，学无止境</p>
      </div>
      <div class="tianshi tianshi-sm" aria-hidden="true">
        <div class="tianshi-cap"></div>
        <div class="tianshi-pillar"></div>
        <div class="tianshi-base"></div>
      </div>
    </section>

    <section class="page-body">
      <div class="container">

        <div class="toolbar">
          <div class="tabs" role="tablist">
            <button class="tab active" data-cat="all">全部</button>
            <button class="tab" data-cat="course">课件</button>
            <button class="tab" data-cat="exam">试卷</button>
            <button class="tab" data-cat="note">笔记</button>
            <button class="tab" data-cat="paper">文献</button>
          </div>
          <button class="btn btn-primary">+ 上传资源</button>
        </div>

        <div class="file-list">
          <div class="file-head">
            <span>文件名</span>
            <span>上传者</span>
            <span>上传时间</span>
            <span style="text-align:right;">下载次数</span>
          </div>

          <div class="file-empty">暂无资源 · 等待真实数据录入</div>

        </div>
      </div>
    </section>

  </main>

  <div id="footerSlot"></div>

  <script src="js/main.js"></script>
</body>
</html>
