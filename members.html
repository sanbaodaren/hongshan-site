<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成员资料 · 宏山科学院-铁一分部</title>
  <meta name="description" content="同窗共学，相知相长。宏山科学院-铁一分部成员资料板块。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="members">

  <div id="headerSlot"></div>

  <main id="pageMain">

    <!-- 页首横幅 -->
    <section class="page-hero">
      <div data-contour></div>
      <div class="container">
        <p class="page-tag">SECTION 03 / MEMBERS</p>
        <h1 class="page-title">成员资料</h1>
        <p class="page-sub">同窗共学，相知相长</p>
      </div>
      <div class="tianshi tianshi-sm" aria-hidden="true">
        <div class="tianshi-cap"></div>
        <div class="tianshi-pillar"></div>
        <div class="tianshi-base"></div>
      </div>
    </section>

    <section class="page-body">
      <div class="container">

        <div class="section-head">
          <h2 class="section-title"><span class="idx">//</span>组织成员 <span class="idx" style="color:#4a6a7a">ROSTER</span></h2>
          <p class="section-sub">TOTAL · —</p>
        </div>

        <!-- 成员网格（待录入） -->
        <div class="member-grid">
          <div class="empty-state" style="grid-column:1/-1">
            <p class="empty-ico" aria-hidden="true">◇</p>
            <p class="empty-text">暂无成员资料 · 等待真实数据录入</p>
          </div>
        </div>

        <p style="text-align:center;margin-top:32px;font-size:12px;color:var(--muted-l);letter-spacing:.1em;">
          点击任意成员卡片查看详细资料
        </p>
      </div>
    </section>

  </main>

  <!-- 成员详情弹窗（结构保留） -->
  <div class="modal" id="memberModal" role="dialog" aria-modal="true" aria-label="成员详情">
    <div class="modal-panel">
      <button class="modal-close" aria-label="关闭">✕</button>
      <div class="modal-head">
        <div class="m-avatar"></div>
        <div>
          <h3 class="m-name" style="font-size:22px;"></h3>
          <p class="m-role" style="margin-top:4px;"></p>
          <div class="m-tags" style="justify-content:flex-start;"></div>
        </div>
      </div>
      <div class="modal-body">
        <h4>个人简介</h4>
        <p class="m-bio"></p>
        <h4>所属分组</h4>
        <p class="m-groups">铁一分部 · 学习组织</p>
      </div>
    </div>
  </div>

  <div id="footerSlot"></div>

  <script src="js/main.js"></script>
</body>
</html>
