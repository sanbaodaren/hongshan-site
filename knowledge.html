<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拓展知识 · 宏山科学院-铁一分部</title>
  <meta name="description" content="格物致知，开卷有益。宏山科学院-铁一分部拓展知识板块。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="knowledge">

  <div id="headerSlot"></div>

  <main id="pageMain">

    <!-- 页首横幅 -->
    <section class="page-hero">
      <div data-contour></div>
      <div class="container">
        <p class="page-tag">SECTION 05 / KNOWLEDGE</p>
        <h1 class="page-title">拓展知识</h1>
        <p class="page-sub">格物致知，开卷有益</p>
      </div>
      <div class="tianshi tianshi-sm" aria-hidden="true">
        <div class="tianshi-cap"></div>
        <div class="tianshi-pillar"></div>
        <div class="tianshi-base"></div>
      </div>
    </section>

    <section class="page-body">
      <div class="container split-k">

        <!-- ============ 左栏 70%：文章列表 ============ -->
        <div>
          <div class="section-head">
            <h2 class="section-title"><span class="idx">//</span>文章精选 <span class="idx" style="color:#4a6a7a">ARTICLES</span></h2>
            <p class="section-sub">UPDATED · WEEKLY</p>
          </div>

          <div class="empty-state">
            <p class="empty-ico" aria-hidden="true">◇</p>
            <p class="empty-text">暂无文章 · 等待真实数据录入</p>
          </div>

        </div>

        <!-- ============ 右栏 30% ============ -->
        <aside>

          <div class="widget">
            <h3 class="widget-title">知识分类</h3>
            <div class="widget-body">
              <div class="tag-cloud">
                <span class="tag">学习方法</span>
                <span class="tag">数学</span>
                <span class="tag">物理</span>
                <span class="tag">化学</span>
                <span class="tag">科学通识</span>
                <span class="tag">思维模型</span>
                <span class="tag">英语</span>
                <span class="tag">信息</span>
                <span class="tag">历史</span>
                <span class="tag">生物</span>
              </div>
            </div>
          </div>

          <div class="widget">
            <h3 class="widget-title">热门阅读</h3>
            <div class="widget-body">
              <div class="empty-state" style="padding:32px 16px;">
                <p class="empty-ico" aria-hidden="true">◇</p>
                <p class="empty-text">暂无数据</p>
              </div>
            </div>
          </div>

        </aside>
      </div>
    </section>

  </main>

  <div id="footerSlot"></div>

  <script src="js/main.js"></script>
</body>
</html>
