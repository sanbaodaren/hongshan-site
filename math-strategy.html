<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学集成战略 · 高中生刷题肉鸽</title>
<style>
:root{
  --bg:#0d1020; --bg2:#151a33; --panel:#1b2144; --panel2:#232a55;
  --line:#333c73; --fg:#e8ecff; --dim:#9aa4d4; --acc:#5ee0c0; --acc2:#7aa2ff;
  --warn:#ffbb55; --bad:#ff7a85; --good:#6ee7a8; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:radial-gradient(1200px 700px at 20% -10%,#1d2450 0%,var(--bg) 60%);color:var(--fg);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;line-height:1.65;min-height:100%}
#app{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.screen{display:none;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font-size:34px;margin:0 0 4px;letter-spacing:2px}
h2{font-size:16px;margin:0 0 12px;color:var(--acc);letter-spacing:1px}
.subtitle{margin:0;color:var(--dim)}
.title-head{margin-bottom:22px}
.hint{color:var(--dim);font-size:13px;margin:10px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
details.panel summary{cursor:pointer;color:var(--acc);font-size:15px}

.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option-grid .opt{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
.option-grid .opt:hover{border-color:var(--acc2);transform:translateY(-1px)}
.option-grid .opt.sel{border-color:var(--acc);background:#1d2c4d;box-shadow:0 0 0 2px rgba(94,224,192,.25) inset}
.option-grid .opt b{font-size:17px}
.option-grid .opt p{margin:6px 0 0;color:var(--dim);font-size:13px}
.option-grid .opt .tag{display:inline-block;font-size:11px;color:var(--bg);background:var(--acc);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

.diff-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.diff-grid .d{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:.15s}
.diff-grid .d:hover{border-color:var(--acc2)}
.diff-grid .d.sel{border-color:var(--acc);background:#1d2c4d}
.diff-grid .d b{display:block;font-size:15px}
.diff-grid .d span{font-size:11px;color:var(--dim)}

.seed-row{display:flex;gap:10px}
.seed-row input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:11px 12px;font-size:14px;font-family:inherit}
.seed-row input:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 20px;font-size:15px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--acc2)}
.btn.primary{background:linear-gradient(180deg,#3ad2b0,#22a98b);color:#08131a;border:none;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.meta-body{font-size:13px;color:var(--dim);max-height:280px;overflow:auto;margin:10px 0}
.meta-body table{width:100%;border-collapse:collapse}
.meta-body td,.meta-body th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}

.bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px;box-shadow:var(--shadow)}
.bar-right{color:var(--dim);font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar b{color:var(--acc)}

/* ---------- 分支地图：节点图（方块 + 连线，可左右滑动） ---------- */
.layer-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.layer-tabs .lt{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);cursor:pointer;font-family:inherit}
.layer-tabs .lt:hover{border-color:var(--acc2);color:var(--fg)}
.layer-tabs .lt.done{color:var(--fg);border-color:var(--acc2)}
.layer-tabs .lt.cur{color:#0b1020;background:var(--acc);border-color:var(--acc);font-weight:700}
.map-scroll{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,#141a34,#0e1224);cursor:grab;scrollbar-width:thin}
.map-scroll.drag{cursor:grabbing}
.map-scroll::-webkit-scrollbar{height:10px}
.map-scroll::-webkit-scrollbar-thumb{background:#33406b;border-radius:999px}
.map-scroll::-webkit-scrollbar-track{background:#151a33;border-radius:999px}
.map-canvas{position:relative}
.map-lines{position:absolute;left:0;top:0;pointer-events:none}
.map-lines line{stroke:#2b3357;stroke-width:2}
.map-lines line.dim{stroke:#242b47}
.map-lines line.ghost{stroke:#1c2236;stroke-dasharray:4 6}
.map-lines line.avail{stroke:var(--acc2);stroke-width:2.5;stroke-dasharray:7 6}
.map-lines line.path{stroke:var(--acc);stroke-width:3.5}
.mnode{position:absolute;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 11px;
  font-size:12px;color:var(--dim)}
.mnode b{color:var(--fg);font-size:15px}
.mnode .mbadges{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 3px}
.mnode .mtopic{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnode .mpick{position:absolute;right:8px;top:7px;font-size:11px;color:var(--acc)}
.mnode.urgent{border-color:#7a5326;background:linear-gradient(180deg,#2a1f18,#1a1728)}
.mnode.future{opacity:.5}
.mnode.walked{border-color:var(--acc2)}
.mnode.cur{cursor:pointer;border-color:var(--acc);opacity:1;box-shadow:0 0 0 2px rgba(94,224,192,.3),0 8px 22px rgba(0,0,0,.45)}
.mnode.cur:hover{transform:translateY(-3px)}
.mnode .result{position:absolute;right:8px;top:5px;font-weight:700;font-size:13px}
.mnode .result.ok{color:var(--good)}
.mnode .result.bad{color:var(--bad)}
.mnode .result.half{color:var(--warn)}
.mnode .result.pend{color:var(--dim);font-size:12px}
.mnode .here{position:absolute;left:8px;top:-10px;font-size:11px;background:var(--acc);color:#0b1020;
  border-radius:999px;padding:0 8px;font-weight:700}
.mnode.entry{display:flex;align-items:center;justify-content:center;border-style:dashed;background:transparent;
  color:var(--dim);font-size:13px;letter-spacing:1px}
.map-bar{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.map-bar .btn{padding:5px 12px}

.badge{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.normal{color:var(--acc);border-color:#2a6b5c}
.badge.urgent{color:var(--warn);border-color:#7a5326}
.badge.type{color:var(--acc2);border-color:#3a4b8d}

.path-log{margin-top:14px;font-size:13px;color:var(--dim)}
.path-log b{color:var(--fg)}
.path-log .pl{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:3px 4px 0 0;background:var(--bg2)}

.q-body{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.q-stem{font-size:16px;white-space:pre-wrap}
.q-topic{margin-top:10px;font-size:12px;color:var(--dim)}
.q-figure{margin-top:10px;font-size:12px;color:var(--dim);word-break:break-all}
.q-figure img{display:block;max-width:100%;max-height:460px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.opts{margin-top:16px;display:grid;gap:9px}
.opts label{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.12s}
.opts label:hover{border-color:var(--acc2)}
.opts label.sel{border-color:var(--acc);background:#1d2c4d}
.opts input{margin-top:5px}
.opts .k{font-weight:700;color:var(--acc2);min-width:18px}
.subs{margin-top:16px;display:grid;gap:16px}
.sub{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.sub .sub-head{color:var(--acc2);font-size:13px;margin-bottom:6px}
.sub .sub-prompt{white-space:pre-wrap}
.fill-row{margin-top:10px}
.fill-row input{width:100%;max-width:420px;background:#101535;border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:9px 11px;font-size:15px;font-family:ui-monospace,Consolas,monospace}
.fill-row input:focus{outline:none;border-color:var(--acc)}
.order-list{margin-top:10px;display:grid;gap:8px}
.order-list .oi{display:flex;gap:10px;align-items:center;background:#101535;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.order-list .oi select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit}
.order-list .oi .ot{flex:1}

.feedback{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:16px}
.feedback.bad{border-left-color:var(--bad)}
.feedback.warn{border-left-color:var(--warn)}
.feedback h3{margin:0 0 8px;font-size:16px}
.feedback .kv{font-size:14px;color:var(--dim);margin:4px 0}
.feedback .kv b{color:var(--fg)}
.feedback .sol{margin-top:10px;white-space:pre-wrap;font-size:14px;color:#cfd7ff;background:#101535;border-radius:9px;padding:12px}
/* 填空题符号键盘 */
.keypad{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.keypad .sym{min-width:34px;padding:5px 7px;font-size:15px;font-family:ui-monospace,Consolas,monospace;background:#101535;color:var(--fg);border:1px solid var(--line);border-radius:7px;cursor:pointer}
.keypad .sym:hover,.keypad .sym:active{border-color:var(--acc);color:var(--acc2)}
.keypad-tip{font-size:12px;color:var(--dim);margin-left:6px}
/* 大题：纸笔作答提示 */
.paper-hint{margin-top:12px;font-size:14px;color:var(--acc2);background:#101535;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;line-height:1.7}
/* 大题：给分标准自评 */
.feedback.rubric-mode{border-left-color:var(--acc2)}
.rubric-box h3{margin:0 0 8px;font-size:16px;color:var(--acc2)}
.rubric-tip{font-size:13px;color:var(--dim);margin:0 0 12px;line-height:1.6}
.rubric .ans{color:var(--dim)}
.rubric .ans b{color:var(--good)}
.rub{display:flex;align-items:flex-start;gap:9px;margin:7px 0;padding:8px 10px;background:#101535;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.rub:hover{border-color:var(--acc)}
.rub input{margin-top:3px}
.rub .rp{flex:none;color:var(--acc2);font-family:ui-monospace,Consolas,monospace;min-width:44px}
.rub .rt{color:var(--fg)}
.sub-self{margin-top:8px;font-size:13px;color:var(--dim)}
.sub-self .got{color:var(--acc2);font-size:15px}
.rubric-total{margin-top:14px;font-size:15px;color:var(--fg)}
.rubric-total b{color:var(--acc2);font-size:20px}
.hidden{display:none}
.foot{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}

.station-body{display:grid;gap:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.note h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.note p{margin:6px 0;white-space:pre-wrap}
.note ul{margin:6px 0;padding-left:20px}
.note .ex{background:#101535;border-radius:9px;padding:12px;margin-top:8px;font-size:14px;white-space:pre-wrap;border:1px solid var(--line)}
.master-toggle{font-size:13px;color:var(--dim)}
.master-toggle.on{color:var(--good)}

.settle h2{font-size:22px;color:var(--acc);letter-spacing:1px}
.settle .big{font-size:52px;font-weight:800;letter-spacing:2px;margin:6px 0;
  background:linear-gradient(90deg,#5ee0c0,#7aa2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.settle .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.settle .ending{border-color:var(--acc);background:linear-gradient(180deg,#1b2c46,#1a1f3d)}
.settle table{width:100%;border-collapse:collapse;font-size:14px}
.settle td,.settle th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.settle th{color:var(--dim);font-weight:500}
.settle .wrong{border-left:4px solid var(--bad)}
.settle .grade{display:inline-block;font-size:15px;border-radius:8px;padding:3px 12px;background:var(--panel2);border:1px solid var(--line)}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 4px;color:var(--dim);font-size:14px}
.kpis b{color:var(--fg);font-size:18px}
@media (max-width:720px){
  .option-grid{grid-template-columns:1fr}
  .diff-grid{grid-template-columns:repeat(4,1fr)}
  .settle .big{font-size:42px}
}

</style>
</head>
<body>
<div id="app">

  <!-- 标题 / 模式与难度选择 -->
  <section id="screen-title" class="screen active">
    <header class="title-head">
      <h1>数学集成战略</h1>
      <p class="subtitle">新高考 19 题 · 刷题肉鸽</p>
      <p class="hint">题库取自 <strong>2024 / 2025 年新高考（新课标）数学真题</strong>与 <strong>2025–2026 年各地名校月考、联考卷</strong>（巴蜀、雅礼、衡水金卷、Z20 名校联盟、浙江强基联盟、湖北名校联盟、青岛二中…），照录原卷，不自己出题。</p>
    </header>

    <div class="panel">
      <h2>1. 选择模式</h2>
      <div id="mode-list" class="option-grid"></div>
    </div>

    <div class="panel">
      <h2>2. 选择难度（整局固定）</h2>
      <div id="diff-list" class="diff-grid"></div>
      <p id="diff-desc" class="hint"></p>
    </div>

    <div class="panel">
      <h2>3. 随机种子（可留空）</h2>
      <div class="seed-row">
        <input id="seed-input" type="text" placeholder="留空 = 每局随机；填相同种子 + 相同选择 = 相同题目" autocomplete="off">
        <button id="btn-start" class="btn primary">开始刷题</button>
      </div>
      <p class="hint">抽题规则：种子 + 节点 ID 决定题目，同一局不重复原题，最近 20 题不重复套路。</p>
    </div>

    <details class="panel" id="meta-panel">
      <summary>我的档案（本地保存）</summary>
      <div id="meta-body" class="meta-body"></div>
      <button id="btn-clear-save" class="btn ghost small">清空本地存档</button>
    </details>
  </section>

  <!-- 知识补充站（仅练习模式） -->
  <section id="screen-station" class="screen">
    <header class="bar">
      <span id="station-title"></span>
      <span class="bar-right"><button id="btn-station-skip" class="btn ghost small">跳过</button></span>
    </header>
    <div id="station-body" class="station-body"></div>
    <footer class="foot">
      <button id="btn-station-go" class="btn primary">进入本层</button>
      <span class="hint">知识补充站只是学习用：不记录、不统计、不影响分数与结局。</span>
    </footer>
  </section>

  <!-- 地图 / 选择上下路（节点图：块 + 连线，可左右滑动） -->
  <section id="screen-map" class="screen">
    <header class="bar">
      <span id="map-title"></span>
      <span id="map-stats" class="bar-right"></span>
    </header>
    <div id="layer-tabs" class="layer-tabs"></div>
    <div id="map-scroll" class="map-scroll">
      <div id="map-canvas" class="map-canvas">
        <svg id="map-lines" class="map-lines"></svg>
        <div id="map-nodes" class="map-nodes"></div>
      </div>
    </div>
    <div id="map-bar" class="map-bar"></div>
    <div id="path-log" class="path-log"></div>
  </section>

  <!-- 答题 -->
  <section id="screen-question" class="screen">
    <header class="bar">
      <span id="q-title"></span>
      <span id="q-stats" class="bar-right"></span>
    </header>
    <div id="q-body" class="q-body"></div>
    <div id="q-feedback" class="feedback hidden"></div>
    <footer class="foot" id="q-foot"></footer>
  </section>

  <!-- 结算 -->
  <section id="screen-settle" class="screen">
    <div id="settle-body"></div>
  </section>

</div>

<script>
/* js/data.js */
/* 数学集成战略 · 静态配置（模式 / 难度 / 层 / 知识补充站 / 结局）
   本文件不依赖 DOM，可被 node 校验脚本直接 eval。 */
(function (root) {
  var MR = root.MR = root.MR || {};

  MR.VERSION = '1.0.0';

  /* ---------- 平衡参数（集中可调） ---------- */
  MR.BALANCE = {
    rigorStart: 5,          // 练习模式严谨度初始值
    rigorPenaltyNormal: 1,  // 普通作战答错扣严谨度
    rigorPenaltyUrgent: 2,  // 紧急作战答错扣严谨度
    masteryNormal: 1,       // 普通作战答对得掌握度
    masteryUrgent: 2,       // 紧急作战答对得掌握度
    recentTemplateWindow: 20 // 最近 N 题不重复套路
  };

  /* ---------- 模式 ---------- */
  MR.MODES = [
    {
      id: 'exam', name: '实战模式', tag: '新高考 150 分制',
      desc: '还原真实高考：无知识补充站、无严谨度/掌握度、不会提前失败。19 题全做完，答错只是不得分，多选按新高考规则给部分分。结算给出 150 分总分、错题报告与知识点分析。',
      station: false, rigor: false, mastery: false, scoring: 'score150',
      showPoints: true
    },
    {
      id: 'practice', name: '练习模式', tag: '评价 + 肉鸽结局',
      desc: '刷题肉鸽：每层开始前有知识补充站；有严谨度（初始 5，答错扣，归零提前失败）与掌握度；结算不显示 150 分，而是给出评价、结局、错题报告与知识点分析。',
      station: true, rigor: true, mastery: true, scoring: 'evaluation',
      showPoints: false
    }
  ];

  /* ---------- 难度 a0 ~ a10 ---------- */
  MR.DIFFICULTIES = [
    { ax: 0,  label: 'a0',  short: '卷前基础', desc: 'a0 = 新高考之前的卷子难度（基础）。真题里这一档很少，会就近回退到最简单的真题并如实标注。' },
    { ax: 1,  label: 'a1',  short: '基础',     desc: 'a1 = 基础偏易。真题集中在高考难度，低档会就近回退并如实标注。' },
    { ax: 2,  label: 'a2',  short: '基础+',    desc: 'a2 = 基础偏易。低档在真题里稀疏，抽题按“就近难度回退”。' },
    { ax: 3,  label: 'a3',  short: '偏易',     desc: 'a3 = 偏易。低档在真题里稀疏，抽题按“就近难度回退”。' },
    { ax: 4,  label: 'a4',  short: '中偏易',   desc: 'a4 = 中偏易（真题前几道选择题大致在这一档）。' },
    { ax: 5,  label: 'a5',  short: '中等',     desc: 'a5 = 中等（真题选择填空的中段）。' },
    { ax: 6,  label: 'a6',  short: '中偏难',   desc: 'a6 = 中偏难（真题选择填空后段）。' },
    { ax: 7,  label: 'a7',  short: '高考',     desc: 'a7 = 高考水平（真题主体）。' },
    { ax: 8,  label: 'a8',  short: '高考+',    desc: 'a8 = 高考水平偏难（真题压轴选择填空、常规大题）。' },
    { ax: 9,  label: 'a9',  short: '压轴',     desc: 'a9 = 压轴水平（第 18、19 题一类）。' },
    { ax: 10, label: 'a10', short: '超纲一点', desc: 'a10 = 比高考难一点点。紧急作战在 a10 仍是 a10，但更偏综合。' }
  ];

  /* ---------- 5 层 / 19 题骨架 ----------
     slot 序号 1..19 与题号一一对应。 */
  MR.LAYERS = [

    q({ no: 11, qtype: 'multi', topic: '解析几何与轨迹', difficulty: 9, template: 'locus-definition', points: 6,

    q({ no: 12, qtype: 'fill', topic: '圆锥曲线的离心率', difficulty: 8, template: 'hyperbola-eccentricity', points: 5,
      stem: '设双曲线 C: x²/a² - y²/b² = 1（a>0, b>0）的左、右焦点分别为 F₁、F₂，过 F₂ 作平行于 y 轴的直线交 C 于 A、B 两点，若 |F₁A| = 13，|AB| = 10，则 C 的离心率为 ____。',
      answer: ['3/2'], accept: ['3/2', '1.5'],
      solution: '过 F₂(c, 0) 作平行 y 轴的直线，与双曲线交于 A(c, b²/a)、B(c, -b²/a)，故 |AB| = 2b²/a = 10 ⇒ b² = 5a。\n|F₁A|² = (2c)² + (b²/a)² = 4c² + 25 = 169 ⇒ c = 6。\n由 c² = a² + b² = a² + 5a 得 a² + 5a - 36 = 0 ⇒ a = 4（舍去负根）。\n所以 e = c/a = 6/4 = 3/2。' }),

    q({ no: 13, qtype: 'fill', topic: '导数与切线', difficulty: 8, template: 'common-tangent', points: 5,
      stem: '若曲线 y = eˣ + x 在点 (0, 1) 处的切线也是曲线 y = ln(x+1) + a 的切线，则 a = ____。',

      solution: 'y = eˣ + x 的导数 y′ = eˣ + 1，在 x = 0 处斜率为 2，切线为 y = 2x + 1。\n设它与 y = ln(x+1) + a 相切于 x = x₀：y′ = 1/(x₀+1) = 2 ⇒ x₀ = -1/2，切点纵坐标 = ln(1/2) + a = -ln2 + a。\n该切线为 y = 2x + 1 - ln2 + a，与 y = 2x + 1 重合 ⇒ a = ln2。' }),

    q({ no: 14, qtype: 'fill', topic: '概率与计数', difficulty: 7, template: 'permutation-score-probability', points: 5,

    q({ no: 16, qtype: 'big', topic: '解析几何与椭圆', difficulty: 8, template: 'ellipse-line-area', points: 15,

    q({ no: 18, qtype: 'big', topic: '导数综合', difficulty: 9, template: 'log-function-symmetry', points: 17,
      stem: '已知函数 f(x) = ln(x/(2-x)) + ax + b(x-1)³。',

        { kind: 'order', prompt: '（2）证明：曲线 y = f(x) 是中心对称图形。（把证明步骤按正确顺序排列）', points: 5,
          items: [
            { key: 's1', text: 'f(x) 的定义域为 (0, 2)；令 t = x - 1，则 t ∈ (-1, 1)，关于 t = 0 对称' },
            { key: 's2', text: '计算 f(1+t) + f(1-t) = [ln((1+t)/(1-t)) + a(1+t) + b t³] + [ln((1-t)/(1+t)) + a(1-t) - b t³]' },
            { key: 's3', text: '两个对数互为相反数相消，三次项相消，得 f(1+t) + f(1-t) = 2a' },

          answer: ['s1', 's2', 's3', 's4'],
          solution: '中心对称的标准做法：验证 f(x) + f(2-x) 为常数。找到对称中心 (1, a) 后，把 x 换成 1+t、2-x 换成 1-t，对数项与三次项分别相消，只剩 2a。', rubric: [{ pts: 1, text: '写出定义域 (0, 2)，令 t = x - 1 并说明 t 关于 0 对称' }, { pts: 2, text: '写出 f(1+t) + f(1-t) 的表达式' }, { pts: 1, text: '说明对数项与三次项相消，得 f(1+t) + f(1-t) = 2a' }, { pts: 1, text: '由 f(x) + f(2-x) = 2a 得曲线关于点 (1, a) 中心对称' }] },
        { kind: 'fill', prompt: '（3）若 f(x) > -2 当且仅当 1 < x < 2，求 b 的取值范围。', points: 7,
          accept: ['b≥-2/3', 'b>=-2/3', '[-2/3,+∞)', 'b∈[-2/3,+∞)', '-2/3≤b', 'b不小于-2/3', 'b>=-0.667', 'b≥-2/3，即[-2/3,+∞)'],
          solution: '令 t = x - 1 ∈ (-1, 1)，则"1 < x < 2"即 t ∈ (0, 1)。\nf(1+t) = ln((1+t)/(1-t)) + a(1+t) + b t³，f(1-t) 已知与之和为 2a。\n利用 ln((1+t)/(1-t)) = 2(t + t³/3 + t⁵/5 + …)，整理 f(1+t) + 2 = (b + 2/3)t³ + O(t⁵)。\n要使 f(x) > -2 当且仅当 t > 0（即 1 < x < 2），需要 t³ 的系数非负：b + 2/3 ≥ 0，即 b ≥ -2/3。\n所以 b ∈ [-2/3, +∞)。', rubric: [{ pts: 2, text: '令 t = x - 1，把 "1 < x < 2" 化为 t ∈ (0, 1)' }, { pts: 2, text: '展开 ln((1+t)/(1-t)) 的级数，得 t³ 项系数 b + 2/3' }, { pts: 2, text: '由 t 与 t³ 同号确定 b + 2/3 ≥ 0' }, { pts: 1, text: '得 b ∈ [-2/3, +∞)' }] }],

    q({ no: 8, qtype: 'single', topic: '导数与不等式', difficulty: 8, template: 'log-linear-nonnegative', points: 5,

      solution: '定义域要求 x + b > 0。令 u = x + b > 0，则 x + a = u + (a - b)，即 f = [u + (a - b)]·ln u。\n· 当 u ∈ (0, 1) 时 ln u < 0，要 f ≥ 0 必须 u + (a - b) ≤ 0 对一切这样的 u 成立，取 u → 1⁻ 得 1 + a - b ≤ 0，即 a ≤ b - 1。\n· 当 u > 1 时 ln u > 0，要 f ≥ 0 必须 u + (a - b) ≥ 0 对一切这样的 u 成立，取下确界 u → 1⁺ 得 1 + a - b ≥ 0，即 a ≥ b - 1。\n两者合起来只能是 a = b - 1。\n检验：a = b - 1 时 f = (u - 1)ln u，u ∈ (0,1) 时两者同为负、乘积为正，u > 1 时同为正，u = 1 时为 0，确实 f ≥ 0 恒成立。\n于是 a² + b² = (b - 1)² + b² = 2b² - 2b + 1 = 2(b - 1/2)² + 1/2 ≥ 1/2，在 b = 1/2、a = -1/2 时取到最小值 1/2。选 C。' }),

    q({ no: 11, qtype: 'multi', topic: '导数与函数性质', difficulty: 9, template: 'cubic-zeros-symmetry', points: 6,

      solution: 'f′(x) = 6x² - 6ax = 6x(x - a)，f(0) = 1。\nA：a > 1 时驻点为 x = 0（极大）与 x = a（极小），f(0) = 1 > 0，f(a) = 1 - a³ < 0；又 x → -∞ 时 f → -∞、x → +∞ 时 f → +∞，三个单调区间内各有一个零点，共 3 个，A 对。\nB：a < 0 时 f′ 在 (a, 0) 上为负、在 (0, +∞) 上为正，所以 x = 0 是极小值点（x = a 才是极大值点），B 错。\nC：若 x = b 是对称轴，则 f(b + t) = f(b - t) 恒成立；展开三次项得 2(b + t)³ - 2(b - t)³ = 4t³ + 12b²t，其中 4t³ 无法消去，所以不存在这样的 b，C 错。\nD：三次曲线的对称中心是它的拐点。f″(x) = 12x - 6a = 0 得 x = a/2，取 a = 2 则拐点横坐标为 1。此时 f(x) = 2x³ - 6x² + 1，代入验算 f(1 + t) + f(1 - t) = -6 = 2f(1)，故 (1, f(1)) = (1, -3) 是对称中心，D 对。\n答案 AD。' }),

          solution: '辅助角公式：sin A + √3 cos A = 2 sin(A + π/3) = 2，即 sin(A + π/3) = 1。\n因为 A 是三角形内角，0 < A < π，故 A + π/3 ∈ (π/3, 4π/3)；在这个区间内 sin 取到 1 只在 A + π/3 = π/2 处，所以 A = π/6。', rubric: [{ pts: 3, text: '由辅助角公式得 sinA + √3·cosA = 2sin(A + π/3)' }, { pts: 2, text: '得 sin(A + π/3) = 1，并说明 A + π/3 ∈ (π/3, 4π/3)' }, { pts: 1, text: '由 A + π/3 = π/2 得 A = π/6' }] },
        { kind: 'fill', prompt: '（2）若 a = 2，且 √2·b·sin C = c·sin 2B，求 △ABC 的周长。', points: 7, accept: ['2+3√2+√6', '2+√6+3√2', '3√2+√6+2'],
          solution: '√2 b sin C = c sin 2B = 2c sin B cos B。由正弦定理 b = 2R sin B、c = 2R sin C（R 为外接圆半径）代入：√2·2R sin B sin C = 2·2R sin C sin B cos B，约去 2R sin B sin C（均不为 0）得 cos B = √2/2，故 B = π/4。\n于是 C = π - A - B = π - π/6 - π/4 = 7π/12。\n由正弦定理 2R = a/sin A = 2/(1/2) = 4，所以 b = 4 sin(π/4) = 2√2，c = 4 sin(7π/12) = 4 sin(π/4 + π/3) = 4(√2/2·1/2 + √2/2·√3/2) = √2 + √6。\n周长 = a + b + c = 2 + 2√2 + √2 + √6 = 2 + 3√2 + √6。\n验算：B + C = π/4 + 7π/12 = 10π/12 = 5π/6，A + B + C = π/6 + 5π/6 = π ✓。', rubric: [{ pts: 2, text: '用 sin2B = 2sinB·cosB 与正弦定理化简条件，得 B = π/4' }, { pts: 1, text: '由 A、B 求出 C = 7π/12' }, { pts: 2, text: '由正弦定理得 2R = 4，求出 b = 2√2、c = √2 + √6' }, { pts: 2, text: '得周长 a + b + c = 2 + 3√2 + √6' }] }],
      solution: '（1）A = π/6；（2）周长 = 2 + 3√2 + √6。' }),

    q({ no: 16, qtype: 'big', topic: '导数与极值', difficulty: 8, template: 'exp-cubic-extremum', points: 15,
      stem: '已知函数 f(x) = eˣ - ax - a³。',
      subs: [
        { kind: 'fill', prompt: '（1）当 a = 1 时，求曲线 y = f(x) 在点 (1, f(1)) 处的切线方程。', points: 7,
          accept: ['(e-1)x-y-1=0', 'y=(e-1)x-1', '(e-1)x-y=1'],
          solution: 'a = 1 时 f(x) = eˣ - x - 1，f′(x) = eˣ - 1。\nf(1) = e - 2，切线斜率 k = f′(1) = e - 1。\n切线：y - (e - 2) = (e - 1)(x - 1)，整理得 y = (e - 1)x - 1，即 (e - 1)x - y - 1 = 0。\n验算：把 x = 1 代入 (e - 1)x - y - 1 = 0 得 y = e - 2 = f(1) ✓，斜率 e - 1 ✓。', rubric: [{ pts: 2, text: 'a = 1 时求导得 f′(x) = eˣ - 1' }, { pts: 2, text: '算出 f(1) = e - 2 与切线斜率 k = e - 1' }, { pts: 3, text: '由点斜式写出切线方程 (e-1)x - y - 1 = 0' }] },
        { kind: 'fill', prompt: '（2）若 f(x) 有极小值，且极小值小于 0，求 a 的取值范围。', points: 8,
          accept: ['a>1', '(1,+∞)', 'a∈(1,+∞)', '1<a'],
          solution: 'f′(x) = eˣ - a。\n当 a ≤ 0 时 eˣ - a > 0 恒成立，f 在 R 上单调递增，没有极小值。\n当 a > 0 时 f′ = 0 有唯一解 x = ln a，且 x < ln a 时 f′ < 0、x > ln a 时 f′ > 0，故 x = ln a 是极小值点，极小值 f(ln a) = a - a·ln a - a³。\n要求 a - a·ln a - a³ < 0，两边除以 a > 0：1 - ln a - a² < 0，即 a² + ln a - 1 > 0。\n令 g(a) = a² + ln a - 1（a > 0），则 g′(a) = 2a + 1/a > 0，g 在 (0, +∞) 上严格递增，且 g(1) = 0，所以 g(a) > 0 ⇔ a > 1。\n因此 a ∈ (1, +∞)。验算：取 a = e，极小值 e - e·1 - e³ = -e³ < 0 ✓；取 a = 1，极小值 1 - 0 - 1 = 0，不满足“小于 0” ✓（边界取不到）。', rubric: [{ pts: 2, text: '求导 f′(x) = eˣ - a，说明 a ≤ 0 时 f 单调递增、无极小值' }, { pts: 2, text: 'a > 0 时得极小值点 x = ln a 与极小值 a - a·ln a - a³' }, { pts: 2, text: '由极小值小于 0 得 a² + ln a - 1 > 0' }, { pts: 2, text: '说明 g(a) = a² + ln a - 1 递增、g(1) = 0，得 a > 1' }] }],
      solution: '（1）切线为 (e - 1)x - y - 1 = 0；（2）a ∈ (1, +∞)。' }),

    q({ no: 17, qtype: 'big', topic: '立体几何', difficulty: 8, template: 'folding-quadrilateral-dihedral', points: 15,
      stem: '如图，平面四边形 ABCD 中，AB = 8，CD = 3，AD = 5√3，∠ADC = 90°，∠BAD = 30°，点 E、F 满足 AE = (2/5)AD，AF = (1/2)AB，将 △AEF 沿 EF 对折至 △PEF，使得 PC = 4√3。',
      figure: 'http://www.91apu.cn/d/file/shuxue/gkt/2024/2024xgk2/2024-09-03/c92cb1abd4c331ccced228499eb3598a.jpg （原卷平面四边形 ABCD 折叠成 PEF 的图）',
      subs: [
        { kind: 'order', prompt: '（1）证明：EF ⊥ PD。（把证明步骤按正确顺序排列）', points: 7,
          items: [
            { key: 's1', text: '△AEF 中 AE = (2/5)AD = 2√3，AF = (1/2)AB = 4，∠EAF = ∠BAD = 30°，由余弦定理 EF² = (2√3)² + 4² - 2·2√3·4·cos30° = 12 + 16 - 24 = 4，得 EF = 2' },
            { key: 's2', text: '因为 EF² + AE² = 4 + 12 = 16 = AF²，所以 AE ⊥ EF；又 D、E、A 三点共线，所以 DE ⊥ EF' },
            { key: 's3', text: '折叠保持长度与垂直关系，故 PE = AE = 2√3 且 PE ⊥ EF' },
            { key: 's4', text: 'PE ∩ DE = E，且 PE、DE 都在平面 PDE 内，由线面垂直的判定得 EF ⊥ 平面 PDE' },
            { key: 's5', text: '因为 PD ⊂ 平面 PDE，所以 EF ⊥ PD' }],
          answer: ['s1', 's2', 's3', 's4', 's5'],
          solution: '链条是“线线垂直 → 线面垂直 → 线线垂直”：先用余弦定理算出 EF = 2，配合 AE = 2√3 由勾股定理逆定理得 AE ⊥ EF（D、E、A 共线，故 DE ⊥ EF）；对折保留 PE ⊥ EF；于是 EF 垂直于平面 PDE 内两条相交直线 PE、DE，得 EF ⊥ 平面 PDE；PD 在该平面内，故 EF ⊥ PD。', rubric: [{ pts: 2, text: '由余弦定理算出 EF = 2' }, { pts: 2, text: '由 EF² + AE² = AF² 得 AE ⊥ EF，从而 DE ⊥ EF' }, { pts: 2, text: '由 PE ⊥ EF、PE ∩ DE = E 得 EF ⊥ 平面 PDE' }, { pts: 1, text: '由 PD ⊂ 平面 PDE 得 EF ⊥ PD' }] },
        { kind: 'fill', prompt: '（2）求面 PCD 与面 PBF 所成的二面角的正弦值。', points: 8,
          accept: ['8√65/65', '8/√65', '8/(√65)'],
          solution: '先补长度：DE = AD - AE = 5√3 - 2√3 = 3√3；CD = 3 且 ∠CDE = 90°，得 CE = √((3√3)² + 3²) = √36 = 6。\n又 PE = 2√3，PE² + CE² = 12 + 36 = 48 = PC² = (4√3)²，所以 PE ⊥ CE；结合 PE ⊥ EF 得 PE ⊥ 平面 DEF，于是 EF、ED、EP 两两垂直。\n以 E 为原点，EF、ED、EP 为 x、y、z 轴建系：F(2, 0, 0)，D(0, 3√3, 0)，P(0, 0, 2√3)，A(0, -2√3, 0)。\nF 是 AB 中点 ⇒ B = 2F - A = (4, 2√3, 0)；DC ⊥ DA 且 |DC| = 3 ⇒ C = D + (3, 0, 0) = (3, 3√3, 0)（检验 PC² = 9 + 27 + 12 = 48 ✓）。\n面 PCD：PC = (3, 3√3, -2√3)，PD = (0, 3√3, -2√3)，法向量 n₁ = PC × PD = (0, 6√3, 9√3) ∥ (0, 2, 3)。\n面 PBF：PB = (4, 2√3, -2√3)，PF = (2, 0, -2√3)，法向量 n₂ = PB × PF = (-12, 4√3, -4√3) ∥ (√3, -1, 1)。\ncos⟨n₁, n₂⟩ = (0 + 2×(-1) + 3×1)/(√13·√5) = 1/√65 = √65/65。\n设二面角为 α，则 sin α = √(1 - 1/65) = √(64/65) = 8/√65 = 8√65/65。', rubric: [{ pts: 1, text: '补出 DE = 3√3、CE = 6，得 PE ⊥ CE，故 EF、ED、EP 两两垂直' }, { pts: 2, text: '以 E 为原点、EF、ED、EP 为坐标轴建系，写出 F、D、P、A 的坐标' }, { pts: 2, text: '由中点与垂直关系求出 B(4, 2√3, 0)、C(3, 3√3, 0)' }, { pts: 3, text: '求两平面法向量，由 cos⟨n₁, n₂⟩ = 1/√65 得 sin α = 8/√65' }] }],
      solution: '（1）证明见小问（1）的步骤链；（2）面 PCD 与面 PBF 所成二面角的正弦值为 8√65/65。' }),

    q({ no: 18, qtype: 'big', topic: '概率与期望', difficulty: 9, template: 'binomial-stage-expectation', points: 17,
      stem: '某投篮比赛分为两个阶段，每个参赛队由两名队员组成。第一阶段由参赛队中一名队员投篮 3 次，若 3 次都未投中，则该队被淘汰，比赛成绩为 0 分；若至少投中一次，则该队进入第二阶段，由该队的另一名队员投篮 3 次，每次投中得 5 分，未投中得 0 分，该队的比赛成绩为第二阶段的得分总和。\n某参赛队由甲、乙两名队员组成，设甲每次投中的概率为 p，乙每次投中的概率为 q，各次投中与否相互独立。',
      subs: [
        { kind: 'fill', prompt: '（1）若 p = 0.4，q = 0.5，甲参加第一阶段比赛，求甲、乙所在队的比赛成绩不少于 5 分的概率。', points: 5,
          accept: ['0.686', '343/500', '68.6%'],
          solution: '成绩不少于 5 分 ⇔ 进入第二阶段且第二阶段至少投中一次。\n第一阶段甲投篮 3 次全不中的概率为 0.6³ = 0.216，故进入第二阶段的概率为 1 - 0.216 = 0.784。\n第二阶段乙投篮 3 次全不中的概率为 0.5³ = 0.125，故第二阶段至少投中一次的概率为 1 - 0.125 = 0.875。\n两阶段相互独立，所求概率 = 0.784 × 0.875 = 0.686。', rubric: [{ pts: 1, text: '说明成绩不少于 5 分等价于进入第二阶段且至少投中一次' }, { pts: 2, text: '算得进入第二阶段的概率 1 - 0.6³ = 0.784' }, { pts: 2, text: '由独立性得 0.784 × (1 - 0.5³) = 0.686' }] },
        { kind: 'choice', prompt: '（2）（ⅰ）假设 0 < p < q < 1，为使甲、乙所在队的比赛成绩为 15 分的概率最大，应该由谁参加第一阶段比赛？', points: 5,
          options: [{ key: 'A', text: '甲' }, { key: 'B', text: '乙' }],
          answer: 'A',
          solution: '成绩为 15 分 ⇔ 第二阶段 3 次全中。\n甲先投时 P甲 = [1 - (1 - p)³]·q³；乙先投时 P乙 = [1 - (1 - q)³]·p³。\nP甲 - P乙 = pq·[q²(3 - 3p + p²) - p²(3 - 3q + q²)] = pq·3(q - p)(p + q - pq)。\n因为 0 < p < q < 1，所以 q - p > 0、pq > 0，且 p + q - pq = 1 - (1 - p)(1 - q) > 0，故 P甲 > P乙，应由甲参加第一阶段。', rubric: [{ pts: 1, text: '指出成绩为 15 分等价于第二阶段 3 次全中' }, { pts: 2, text: '写出 P甲 = [1-(1-p)³]q³ 与 P乙 = [1-(1-q)³]p³' }, { pts: 2, text: '由 P甲 - P乙 = 3pq(q-p)(p+q-pq) > 0 判断应由甲参赛' }] },
        { kind: 'choice', prompt: '（2）（ⅱ）假设 0 < p < q < 1，为使甲、乙所在队的比赛成绩的数学期望最大，应该由谁参加第一阶段比赛？', points: 7,
          options: [{ key: 'A', text: '甲' }, { key: 'B', text: '乙' }],
          answer: 'A',
          solution: '第二阶段投篮 3 次、每次得 5 分，故在已进入第二阶段的前提下成绩期望为 15·q（甲先投时）或 15·p（乙先投时）。\n甲先投时 E(X) = 15·[1 - (1 - p)³]·q；乙先投时 E(Y) = 15·[1 - (1 - q)³]·p。\nE(X) - E(Y) = 15pq·[(3 - 3p + p²) - (3 - 3q + q²)] = 15pq·(q - p)(3 - p - q)。\n因为 0 < p < q < 1，所以 q - p > 0、pq > 0，且 3 - p - q > 3 - 2 = 1 > 0，故 E(X) > E(Y)，应由甲参加第一阶段。', rubric: [{ pts: 2, text: '写出已进入第二阶段时的成绩期望 15q（甲先投）与 15p（乙先投）' }, { pts: 2, text: '写出 E(X) = 15q[1-(1-p)³]，E(Y) 由 p、q 互换得到' }, { pts: 3, text: '由 E(X) - E(Y) = 15pq(q-p)(3-p-q) > 0 判断应由甲参赛' }] }],
      solution: '（1）0.686；（2）（ⅰ）甲；（ⅱ）甲。' }),

    q({ no: 19, qtype: 'big', topic: '圆锥曲线与数列', difficulty: 10, template: 'hyperbola-sequence-ratio', points: 17,
      stem: '已知双曲线 C：x² - y² = m（m > 0），点 P₁(5, 4) 在 C 上，k 为常数，0 < k < 1。按照如下方式依次构造点 Pₙ（n = 2, 3, …）：过 Pₙ₋₁ 作斜率为 k 的直线与 C 的左支交于点 Qₙ₋₁，令 Pₙ 为 Qₙ₋₁ 关于 y 轴的对称点，记 Pₙ 的坐标为 (xₙ, yₙ)。',
      subs: [
        { kind: 'fillset', prompt: '（1）若 k = 1/2，求 x₂、y₂。（两空用逗号分隔，顺序不限）', points: 4,
          answer: [['3'], ['0']],
          solution: 'P₁(5, 4) 在 C 上 ⇒ 25 - 16 = 9 = m，即 C：x² - y² = 9。\nk = 1/2 时过 P₁ 的直线为 y - 4 = (1/2)(x - 5)，即 x = 2y - 3。\n代入 x² - y² = 9：(2y - 3)² - y² = 9 ⇒ 4y² - 12y + 9 - y² = 9 ⇒ 3y² - 12y = 0 ⇒ y = 0 或 y = 4。\ny = 4 对应 P₁(5, 4)；y = 0 对应 x = -3，即与左支的交点 Q₁(-3, 0)。\nP₂ 是 Q₁ 关于 y 轴的对称点，故 P₂(3, 0)，即 x₂ = 3、y₂ = 0。', rubric: [{ pts: 1, text: '由 P₁(5, 4) 在 C 上得 m = 9' }, { pts: 2, text: '写出过 P₁、斜率 k = 1/2 的直线，代入 x² - y² = 9 求解' }, { pts: 1, text: '取左支交点 Q₁(-3, 0) 关于 y 轴的对称点，得 x₂ = 3、y₂ = 0' }] },
        { kind: 'order', prompt: '（2）证明：数列 {xₙ - yₙ} 是公比为 (1 + k)/(1 - k) 的等比数列。（把证明步骤按正确顺序排列）', points: 6,
          items: [
            { key: 's1', text: 'Pₙ 与 Pₙ₋₁ 都在 C 上，所以 xₙ² - yₙ² = xₙ₋₁² - yₙ₋₁² = m，因式分解得 (xₙ - xₙ₋₁)(xₙ + xₙ₋₁) = (yₙ - yₙ₋₁)(yₙ + yₙ₋₁)' },
            { key: 's2', text: '因为 Qₙ₋₁ 是 Pₙ 关于 y 轴的对称点，即 Qₙ₋₁(-xₙ, yₙ)，它与 Pₙ₋₁(xₙ₋₁, yₙ₋₁) 连线的斜率为 k：(yₙ - yₙ₋₁)/(-xₙ - xₙ₋₁) = k，即 yₙ - yₙ₋₁ = -k(xₙ + xₙ₋₁)' },
            { key: 's3', text: '把 yₙ - yₙ₋₁ = -k(xₙ + xₙ₋₁) 代入因式分解式，约去非零的 (xₙ + xₙ₋₁)，得 xₙ - xₙ₋₁ = -k(yₙ + yₙ₋₁)' },
            { key: 's4', text: '把 s2 的式子减去 s3 的式子：-(xₙ - yₙ) + (xₙ₋₁ - yₙ₋₁) = -k[(xₙ - yₙ) + (xₙ₋₁ - yₙ₋₁)]' },
            { key: 's5', text: '整理得 (1 - k)(xₙ - yₙ) = (1 + k)(xₙ₋₁ - yₙ₋₁)，即 (xₙ - yₙ)/(xₙ₋₁ - yₙ₋₁) = (1 + k)/(1 - k)，所以 {xₙ - yₙ} 是公比为 (1 + k)/(1 - k) 的等比数列' }],
          answer: ['s1', 's2', 's3', 's4', 's5'],
          solution: '核心是两条关系式：“Pₙ、Pₙ₋₁ 都在双曲线上”给出 (xₙ - xₙ₋₁)(xₙ + xₙ₋₁) = (yₙ - yₙ₋₁)(yₙ + yₙ₋₁)，“Pₙ₋₁ 与 Qₙ₋₁ 连线斜率为 k”给出 yₙ - yₙ₋₁ = -k(xₙ + xₙ₋₁)。把后者代入前者得 xₙ - xₙ₋₁ = -k(yₙ + yₙ₋₁)，两式相减即消去含 (xₙ + xₙ₋₁)、(yₙ + yₙ₋₁) 的项，直接得到 (1 - k)(xₙ - yₙ) = (1 + k)(xₙ₋₁ - yₙ₋₁)。\n用（1）验算：x₁ - y₁ = 1，x₂ - y₂ = 3，而 (1 + 1/2)/(1 - 1/2) = 3，两值之比恰为公比 ✓。', rubric: [{ pts: 1, text: '由 Pₙ、Pₙ₋₁ 都在 C 上因式分解得两点坐标差的关系式' }, { pts: 2, text: '由斜率为 k 得 yₙ - yₙ₋₁ = -k(xₙ + xₙ₋₁)' }, { pts: 1, text: '代入消元得 xₙ - xₙ₋₁ = -k(yₙ + yₙ₋₁)' }, { pts: 2, text: '两式相减整理得 (xₙ-yₙ)/(xₙ₋₁-yₙ₋₁) = (1+k)/(1-k)' }] },
        { kind: 'order', prompt: '（3）设 Sₙ 为 △PₙPₙ₊₁Pₙ₊₂ 的面积，证明：对任意的正整数 n，Sₙ = Sₙ₊₁。（把证明步骤按正确顺序排列）', points: 7,
          items: [
            { key: 's1', text: '由（2）记 t = (1 + k)/(1 - k)（t > 1），则 xₙ - yₙ = t^(n-1)，因为 x₁ - y₁ = 5 - 4 = 1' },
            { key: 's2', text: '又 (xₙ - yₙ)(xₙ + yₙ) = m，所以 xₙ + yₙ = m/t^(n-1)' },
            { key: 's3', text: '解出 xₙ = (t^(n-1) + m·t^(1-n))/2，yₙ = (m·t^(1-n) - t^(n-1))/2' },
            { key: 's4', text: '代入计算两条直线的斜率，得 k(Pₙ₊₁Pₙ₊₂) = k(PₙPₙ₊₃) = -(t^(2n+1) + m)/(t^(2n+1) - m)，所以 Pₙ₊₁Pₙ₊₂ ∥ PₙPₙ₊₃' },
            { key: 's5', text: '△PₙPₙ₊₁Pₙ₊₂ 与 △Pₙ₊₁Pₙ₊₂Pₙ₊₃ 有公共底边 Pₙ₊₁Pₙ₊₂，第三个顶点 Pₙ、Pₙ₊₃ 到该底边所在直线的距离相等（所在直线平行），故 Sₙ = Sₙ₊₁' }],
          answer: ['s1', 's2', 's3', 's4', 's5'],

      solution: '圆心 C(0, -2)。直线写为 √3x - y + 2 = 0，则 C 到它的距离\nd = |√3·0 - (-2) + 2| / √(3 + 1) = 4/2 = 2。\n圆上到该直线距离为 1 的点，就是圆与两条平行线 √3x - y + 2 ± 2 = 0 的交点；这两条平行线到圆心的距离分别为 1 和 3。\n· r < 1：0 个；r = 1：只与距离 1 的平行线相切，得 1 个；\n· 1 < r < 3：与距离 1 的平行线交 2 点、与距离 3 的平行线不相交，恰 2 个；\n· r = 3：距离 1 的平行线给 2 点，距离 3 的平行线相切给 1 点，共 3 个；r > 3：4 个。\n所以 1 < r < 3，选 B。' }),

      solution: '设公共值为 t，则 log₂x = t - 2 等，即 x = 2^(t-2)，y = 3^(t-3)，z = 5^(t-5)。\n先看可实现的：t = 0 时 x = 1/4、y = 1/27、z = 1/3125，得 x > y > z（A 可能）；\nt = 5 时 x = 8、y = 9、z = 1，得 y > x > z（C 可能）；t = 8 时 x = 64、y = 243、z = 125，得 y > z > x（D 可能）。\n再证 x > z > y 不可能（两边取对数）：\n· x > z ⇔ 2^(t-2) > 5^(t-5) ⇔ (t-2)ln2 > (t-5)ln5。因 ln2 - ln5 < 0，得 t < (2ln2 - 5ln5)/(ln2 - ln5) ≈ 7.27；\n· z > y ⇔ 5^(t-5) > 3^(t-3) ⇔ (t-5)ln5 > (t-3)ln3，得 t > (5ln5 - 3ln3)/(ln5 - ln3) ≈ 9.30。\nt < 7.27 与 t > 9.30 不能同时成立，故 x > z > y 不可能，选 B。' }),

      solution: 'B = 2C ⇒ A = π - 3C。\n正弦定理：b = 2·sin2C/sin3C，c = 2·sinC/sin3C，\n故 b + c = 2(sin2C + sinC)/sin3C。\n记 s = sinC：sin2C = 2s·cosC，sin3C = s(4cos²C - 1)，\n所以 b + c = 2s(2cosC + 1)/(s(4cos²C - 1)) = 2(2cosC + 1)/((2cosC - 1)(2cosC + 1)) = 2/(2cosC - 1)（cosC ≠ 1/2）。\n锐角三角形要求 A, B, C 均小于 π/2：\n· C < π/2；\n· B = 2C < π/2 ⇒ C < π/4；\n· A = π - 3C < π/2 ⇒ C > π/6。\n所以 C ∈ (π/6, π/4)，cosC ∈ (√2/2, √3/2)，2cosC - 1 ∈ (√2 - 1, √3 - 1)。\n端点：C → π/6⁺（A → π/2⁻）时 b + c → 2/(√3 - 1) = √3 + 1；\nC → π/4⁻（B → π/2⁻）时 b + c → 2/(√2 - 1) = 2√2 + 2。\n两端都取不到，故 b + c ∈ (√3 + 1, 2√2 + 2)，选 D。' }),

    q({ no: 10, qtype: 'multi', topic: '空间几何体', difficulty: 9, template: 'tri-rectangular-vertex-angles', points: 6,
      stem: '在三棱锥 O-ABC 中，侧棱 OA，OB，OC 两两垂直，且 OA = OB = OC = 3，P 为底面 ABC 内一动点（含边界），点 P 到三个侧面的距离分别为 d₁，d₂，d₃，直线 OP 和三条侧棱所成的角分别为 ∠1，∠2，∠3，直线 OP 和三个侧面所成的角分别为 α，β，γ，则（　）',
      options: [
        { key: 'A', text: '该三棱锥的外接球半径为 3√3/2' },
        { key: 'B', text: 'sin²∠1 + sin²∠2 + sin²∠3 = 1' },
        { key: 'C', text: 'sin²α + sin²β + sin²γ = 1' },
        { key: 'D', text: '当 d₁² + d₂² + d₃² = 5 时，P 点的轨迹长度为 √2π' }],
      answer: ['A', 'C', 'D'],
      solution: '以 O 为原点，OA、OB、OC 所在直线为 x、y、z 轴建系，则 A(3, 0, 0)、B(0, 3, 0)、C(0, 0, 3)。\n设 P(x, y, z)，P 在底面 ABC 上 ⇔ x + y + z = 3 且 x, y, z ≥ 0，此时 d₁ = x、d₂ = y、d₃ = z。\nA：三棱锥可补成长为 3 的正方体，外接球即正方体外接球，2R = 3√3，R = 3√3/2 ✓。\nB：OP 与三条侧棱所成角 ∠1（与 OA 轴）、∠2、∠3 满足 sin²∠1 = 1 - x²/9 等，\n   三者之和 = 3 - (x² + y² + z²)/9。取 P 为底面重心 G(1, 1, 1)：和 = 3 - 3/9 = 8/3 ≠ 1，故 B 不恒成立 ✗。\nC：OP 与三个侧面（坐标平面）所成角的正弦即三个方向余弦的平方，\n   sin²α + sin²β + sin²γ = (x² + y² + z²)/(x² + y² + z²) = 1 恒成立 ✓。\nD：d₁² + d₂² + d₃² = x² + y² + z² = 5，即 P 在球面 x² + y² + z² = 5 上。\n   O 到平面 ABC（x + y + z = 3）的距离 h = 3/√3 = √3，故球面与底面的交线是以 G 为圆心、r = √(5 - 3) = √2 的圆。\n   三角形 ABC 的内切圆半径 ρ = S/s = (9√3/2)/(9√2/2) = √6/2 ≈ 1.2247 < √2，故该圆只有三段圆弧落在三角形内；\n   边界上三段圆弧的圆心角各为 π/3（数值扫描：三弧总长 = 4.4429 = √2π，即半周长 2πr·(1/2)），故轨迹长度 = √2π ✓。\n答案 ACD。' }),

    q({ no: 11, qtype: 'multi', topic: '导数与不等式', difficulty: 9, template: 'log-inequality-compare', points: 6,
      stem: '若 a > 1，b > 1，且 a(ln b + 2) = (b + 1)(ln a + 1)，则（　）',
      options: [
        { key: 'A', text: 'a > b' },
        { key: 'B', text: 'a < b' },
        { key: 'C', text: 'a² > b' },
        { key: 'D', text: 'a² < b' }],
      answer: ['B', 'C'],
      solution: '把条件整理成比值形式：a(ln b + 2) = (b + 1)(ln a + 1) ⇔ a/(ln a + 1) = (b + 1)/(ln b + 2)。\n记 m(t) = t/(ln t + 1)，n(t) = (t + 1)/(ln t + 2)（t > 1），则 m(a) = n(b)。\n比较大小：m(t) - n(t) = [t(ln t + 2) - (t + 1)(ln t + 1)]/((ln t + 1)(ln t + 2)) = (t - ln t - 1)/((ln t + 1)(ln t + 2)) > 0\n（因 t > 1 时 ln t < t - 1），故 n(b) = m(a) > n(a)。\n而 n(t) = (t + 1)/(ln t + 2) 在 (1, +∞) 上严格递增…… 但这里更直接：\n由 m(t) - n(t) > 0 得 m(a) = n(b) < m(b)，而 m′(t) = ln t/(ln t + 1)² > 0，故 m 严格递增，于是 a < b ✓，B 真、A 假。\n再证 a² > b：反设 a² ≤ b。由 m 递增与 a ≤ √b 得 m(a) ≤ m(√b)，即 n(b) ≤ m(√b)。\n而 m(√b) = √b/((1/2)ln b + 1) = 2√b/(ln b + 2)，n(b) = (b + 1)/(ln b + 2)，故 b + 1 ≤ 2√b，即 (√b - 1)² ≤ 0，\n只能 b = 1，与 b > 1 矛盾。所以 a² > b ✓（C 真、D 假）。\n答案 BC。（数值复核：a = 1.5 → b ≈ 1.702、a = 2 → b ≈ 2.393；a = 1.001 时 b ≈ 1.0014 > a² = 1.0020 ✓；a = 2 时 b = 2.393 < a² = 4 ✓。）' }),

    q({ no: 12, qtype: 'fill', topic: '平面向量', difficulty: 7, template: 'vector-opposite-direction', points: 5,
      stem: '已知向量 a，b 不共线，且向量 λa + b 与 a + (2λ - 1)b 的方向相反，则实数 λ 的值为 ____。',
      answer: ['-1/2'], accept: ['-1/2', '-0.5', 'λ=-1/2', 'λ = -1/2', '-1/2（=-0.5）'],
      solution: '方向相反 ⇒ 存在 k < 0 使 λa + b = k(a + (2λ - 1)b) = ka + k(2λ - 1)b。\na、b 不共线，故对应系数相等：λ = k 且 1 = k(2λ - 1)。\n代入 k = λ：1 = λ(2λ - 1)，即 2λ² - λ - 1 = 0，因式分解 (2λ + 1)(λ - 1) = 0，得 λ = -1/2 或 λ = 1。\nλ = 1 时 k = 1 > 0，方向相同，舍去；λ = -1/2 时 k = -1/2 < 0，方向相反 ✓。\n所以 λ = -1/2。' }),

    q({ no: 13, qtype: 'fill', topic: '轨迹方程', difficulty: 8, template: 'locus-ellipse-ratio', points: 5,
      stem: '在平面直角坐标系 xOy 中，点 N 在 x 轴上运动，点 M 在 y 轴上运动，点 P 在线段 MN 的延长线上，且 |MP| = 3，|MN| = 1，则点 P 的轨迹方程为 ____。',
      answer: ['x²/9 + y²/4 = 1'], accept: ['x²/9 + y²/4 = 1', 'x²/9+y²/4=1', 'x^2/9+y^2/4=1', '4x² + 9y² = 36', '4x^2+9y^2=36'],
      solution: '设 M(0, m)、N(n, 0)，则 |MN| = √(n² + m²) = 1。\n由 |MN| = 1、|MP| = 3 且 P 在 MN 的延长线上知 N 在线段 MP 内部，向量 MP = 3·向量 MN。\n于是 P = M + 3(N - M) = (3n, -2m)。\n设 P(x, y)，则 x = 3n、y = -2m，即 n = x/3、m = -y/2，代入 n² + m² = 1 得 x²/9 + y²/4 = 1。\n所以点 P 的轨迹方程为 x²/9 + y²/4 = 1（椭圆）。' }),

          answer: [['线性相关', '是线性相关', '有线性相关关系'], ['0.95', '0.95（≈0.9514）', '0.951'], ['较强', '强', '相关性较强']],

          rubric: [{ pts: 2, text: '由 Σxᵢ、Σyᵢ 算得 x̄ = 29、ȳ = 22' }, { pts: 2, text: '算得 r = 137/144 ≈ 0.95（精确到 0.01）' }, { pts: 1, text: '由 r 接近 1 判断线性相关且相关程度较强' }] },
        { kind: 'fillset', prompt: '（2）建立树高 y 关于胸径 x 的经验回归方程（系数精确到 0.01），并预测胸径为 45 cm 的树高（精确到 0.01 m）。依次填：斜率 b̂、截距 â、经验回归方程（写成 ŷ=0.24x+15.10 的样式）、预测值。', points: 8,

      solution: 'f 为奇函数：f(-1/2) = -f(1/2)；周期为 2：f(1/2) = f(1/2 + 2) = f(5/2)。\n5/2 ∈ [2, 3]，代入得 f(5/2) = (5/2)² - 5·(5/2) + 6 = 25/4 - 25/2 + 6 = -1/4。\n所以 f(-1/2) = -(-1/4) = 1/4，选 A。' }),

    q({ no: 7, qtype: 'single', topic: '基本不等式', difficulty: 7, template: 'basic-inequality-product-min', points: 5,
      stem: '已知正实数 x, y 满足 xy + x + 2y = 6，则 x + 2y 的最小值是（　）',
      options: [{ key: 'A', text: '2√2 + 2' }, { key: 'B', text: '4' }, { key: 'C', text: '5' }, { key: 'D', text: '2√3' }],
      answer: ['B'],
      solution: '由 xy + x + 2y = 6 得 (x + 2)(y + 1) = 8。\n于是 16 = (x + 2)(2y + 2) ≤ ((x + 2 + 2y + 2)/2)²，即 (x + 2y + 4)/2 ≥ 4，得 x + 2y ≥ 4。\n等号当且仅当 x + 2 = 2y + 2（即 x = 2y）时成立，联立 (x+2)(y+1) = 8 解得 x = 2, y = 1。\n所以 x + 2y 的最小值为 4，选 B。' }),

    q({ no: 8, qtype: 'single', topic: '圆锥曲线的离心率', difficulty: 8, template: 'hyperbola-eccentricity-vector-ratio', points: 5,
      stem: '已知双曲线 E: x²/a² - y²/b² = 1（a > 0, b > 0）的右焦点为 F，右顶点为 A，过点 F 的直线与双曲线 E 的一条渐近线交于点 P，与其左支交于点 Q，且点 P 与点 Q 不在同一象限，直线 AP 与直线 OQ（O 为坐标原点）的交点在双曲线 E 上，若 PQ→ = -3PF→，则双曲线 E 的离心率为（　）',
      options: [{ key: 'A', text: '7/3' }, { key: 'B', text: '5/3' }, { key: 'C', text: '2' }, { key: 'D', text: '3' }],
      answer: ['B'],
      solution: '记 F(c, 0)（c² = a² + b²），A(a, 0)，设直线与左支的交点 Q = (x, y)。\n由 PQ→ = -3PF→ 得 Q - P = -3(F - P)，即 Q = 4P - 3F，所以 P = ((x + 3c)/4, y/4)，且 |QF| = 4|PF|。\n直线 OQ 与双曲线 E 的另一个交点是 Q 关于原点的对称点 Q′ = (-x, -y)；题设该交点在 E 上，故它就是 Q′，且 Q′ 在直线 AP 上，即 A、P、Q′ 三点共线。\nP - A = ((x + 3c)/4 - a, y/4)，Q′ - A = (-x - a, -y)，由共线得\n((x + 3c)/4 - a)·(-y) - (y/4)·(-x - a) = 0。\n约去 y（y ≠ 0）整理得 (-3c + 5a)/4 = 0，即 3c = 5a，所以 e = c/a = 5/3，选 B。' }),

    q({ no: 10, qtype: 'multi', topic: '解析几何与抛物线', difficulty: 8, template: 'parabola-focus-chord-distance', points: 6,
      stem: '设 O 为坐标原点，直线 y = √3(x - 1) 过抛物线 C: y² = 2px（p > 0）的焦点，且与 C 交于 M, N 两点，l 为 C 的准线，则（　）',
      options: [

      solution: '焦点为 F(p/2, 0)，代入直线得 0 = √3(p/2 - 1) ⇒ p = 2，A 正确。\n此时 C: y² = 4x，直线倾斜角 θ = π/3，焦点弦长 |MN| = 2p/sin²θ = 4/(3/4) = 16/3 ≠ 8/3，B 错误。\n设 M, N 到准线 l 的距离分别为 d₁, d₂，MN 中点为 A，A 到 l 的距离为 d。由抛物线定义 d₁ = |MF|、d₂ = |NF|，\n故 d = (d₁ + d₂)/2 = (|MF| + |NF|)/2 = |MN|/2，即圆心 A 到 l 的距离等于半径，所以以 MN 为直径的圆与 l 相切，C 正确。\nS△OMN = p²/(2sinθ) = 4/(2 × √3/2) = 4√3/3，D 正确。\n答案 ACD。' }),

    q({ no: 11, qtype: 'multi', topic: '抽象函数', difficulty: 9, template: 'abstract-function-evenline-period', points: 6,
      stem: '已知定义域为 R 的函数 f(x) 对任意实数 x, y 都有 f(x + y) + f(x - y) = 2f(x)f(y)，且 f(2) = -1，则以下结论一定正确的有（　）',
      options: [
        { key: 'A', text: 'f(0) = 1' },
        { key: 'B', text: 'f(x) 是奇函数' },
        { key: 'C', text: 'f(x) 关于 (1, 0) 中心对称' },
        { key: 'D', text: 'f(1) + f(2) + … + f(2025) = 0' }],
      answer: ['A', 'C', 'D'],
      solution: 'A：令 x = 2, y = 0，得 f(2) + f(2) = 2f(2)f(0)，即 -2 = -2f(0)，所以 f(0) = 1，A 正确。\nB：令 x = 0，得 f(y) + f(-y) = 2f(0)f(y) = 2f(y)，即 f(-y) = f(y)，f(x) 是偶函数，B 错误。\nC：令 x = y = 1，得 f(2) + f(0) = 2f(1)²，即 0 = 2f(1)²，所以 f(1) = 0；再令 x = 1 得 f(1 + y) + f(1 - y) = 2f(1)f(y) = 0，\n所以 f(1 + y) = -f(1 - y)，即 f(x) 关于点 (1, 0) 中心对称，C 正确。\nD：由 C 取 y = 1 得 f(x + 1) = -f(x - 1)，即 f(x + 2) = -f(x)，故 f(x + 4) = -f(x + 2) = f(x)，周期为 4。\n令 x = y = 2：f(4) + f(0) = 2f(2)² = 2 ⇒ f(4) = 1；令 x = 2, y = 1：f(3) + f(1) = 2f(2)f(1) = 0 ⇒ f(3) = 0。\n于是 f(1) + f(2) + f(3) + f(4) = 0 + (-1) + 0 + 1 = 0，每个完整周期之和为 0；\n2025 = 4 × 506 + 1，故 f(1) + f(2) + … + f(2025) = 506 × 0 + f(2025) = f(1) = 0，D 正确。\n答案 ACD。' }),

    q({ no: 12, qtype: 'fill', topic: '导数与切线', difficulty: 7, template: 'exp-linear-tangent-equation', points: 5,

    q({ no: 13, qtype: 'fill', topic: '等比数列', difficulty: 7, template: 'gp-sum-mixed-ratio', points: 5,

    q({ no: 14, qtype: 'fill', topic: '函数的奇偶性与周期性', difficulty: 8, template: 'log-odd-monotone-range', points: 5,
      stem: '已知函数 f(x) = x + ln((2 + x)/(2 - x))，且满足 f(a) + f(2a - 1) > 0，则实数 a 的取值范围为____。',

      solution: '由 (2 + x)/(2 - x) > 0 得定义域 (-2, 2)。\nf(-x) = -x + ln((2 - x)/(2 + x)) = -x - ln((2 + x)/(2 - x)) = -f(x)，所以 f(x) 是 (-2, 2) 上的奇函数。\n又 f(x) = x + ln(2 + x) - ln(2 - x)，x、ln(2 + x)、-ln(2 - x) 都在 (-2, 2) 上单调递增，故 f(x) 在 (-2, 2) 上单调递增。\nf(a) + f(2a - 1) > 0 ⇔ f(a) > -f(2a - 1) = f(1 - 2a)，故需 -2 < 1 - 2a < a < 2。\n由 a > 1 - 2a 得 a > 1/3；由 1 - 2a > -2 得 a < 3/2；由 a < 2 得 a < 2。\n取交集得 1/3 < a < 3/2。' }),

        { key: 'D', text: 'f(10) > 500' }],
      answer: ['D'],
      solution: '记 dₙ = f(n) - f(n - 1)（n ≥ 2，n ∈ N*），则 d₂ = f(2) - f(1) = 1。\n由 f(x) ≥ 3f(x - 1) - 2f(x - 2) 得 f(x) - f(x - 1) ≥ 2[f(x - 1) - f(x - 2)]，\n即 dₙ ≥ 2dₙ₋₁（n ≥ 3）。故 dₙ ≥ d₂ · 2^(n-2) = 2^(n-2)。\n于是 f(10) = f(1) + d₂ + d₃ + … + d₁₀ ≥ 1 + (2⁰ + 2¹ + … + 2⁸) = 1 + 511 = 512 > 500，D 一定正确。\n另一方面，由 f(x) ≤ 4f(x - 1) - 3f(x - 2) 得 dₙ ≤ 3dₙ₋₁，故 dₙ ≤ 3^(n-2)，\nf(5) ≤ 1 + 1 + 3 + 9 + 27 = 41 < 50，B 不一定正确；\n而 f(5) ≥ 1 + 1 + 2 + 4 + 8 = 16 > 10，A 一定不正确；\nf(10) ≤ 1 + (3⁹ - 1)/2 = 9842，故 C 并非一定成立。\n选 D。' }),

    q({ no: 9, qtype: 'multi', topic: '立体几何', difficulty: 8, template: 'cube-midpoint-parallel-volume', points: 6,
      stem: '已知正方体 ABCD-A₁B₁C₁D₁ 的棱长为 1，M 是线段 DD₁ 的中点，则（　）',
      options: [
        { key: 'A', text: 'A₁B₁ ∥ 平面 BC₁M' },
        { key: 'B', text: 'B₁D₁ 与 BC₁ 所成夹角为 60°' },
        { key: 'C', text: '平面 A₁B₁D ⊥ 平面 BC₁M' },
        { key: 'D', text: '三棱锥 C-BC₁M 的体积为 1/12' }],
      answer: ['B', 'C'],
      solution: 'A 错：取 AD 中点 N，连接 MN、BN，则平面 MNBC₁ 就是平面 BC₁M（M 为 DD₁ 中点，MN ∥ AD ∥ BC 且过 B）；\n又 AB ∥ A₁B₁，且 AB ∩ 平面 BC₁MN = B，故 A₁B₁ 与平面 BC₁M 不平行。\nB 对：连接 B₁D₁、AD₁，在正方体中 AD₁ ∥ BC₁，故 AD₁ 与 B₁D₁ 所成角即所求；\n△AD₁B₁ 是正三角形（三边都是面对角线，长为 √2），故 ∠AD₁B₁ = 60°，B 正确。\nC 对：由 A₁B₁ ⊥ 平面 BB₁C₁C 得 A₁B₁ ⊥ BC₁；由 A₁D ⊥ AD₁ 与 AD₁ ∥ BC₁ 得 BC₁ ⊥ A₁D；\n又 A₁D ∩ A₁B₁ = A₁，A₁D、A₁B₁ ⊂ 平面 A₁B₁D，故 BC₁ ⊥ 平面 A₁B₁D，\n而 BC₁ ⊂ 平面 BC₁M，所以平面 A₁B₁D ⊥ 平面 BC₁M，C 正确。\nD 错：换底计算，V_{C-BC₁M} = V_{M-BCC₁} = (1/3) × S△BCC₁ × d(M, 平面BCC₁) = (1/3) × (1/2 × 1 × 1) × 1 = 1/6 ≠ 1/12，D 错误。\n（其中 M 到平面 BCC₁ 即侧面 BCC₁B₁ 的距离等于棱长 1。）\n选 BC。' }),

    q({ no: 10, qtype: 'multi', topic: '解三角形', difficulty: 8, template: 'triangle-angle-bisector', points: 6,
      stem: '已知 △ABC 的三个内角分别为 A, B, C，B = C + π/2，AB = 2，AC = 3，D 在线段 BC 上，且满足 AD 平分 ∠BAC。则（　）',
      options: [
        { key: 'A', text: 'sin B = 3/(2sin C)' },
        { key: 'B', text: 'tan C = 2/3' },
        { key: 'C', text: 'BC = 25/13' },
        { key: 'D', text: 'AD = 6√26/13' }],
      answer: ['A', 'B', 'D'],
      solution: 'A 对：在 △ABC 中由正弦定理 sin B/sin C = AC/AB = 3/2，即 sin B = (3/2)sin C，A 正确。\nB 对：B = C + π/2 ⇒ sin B = sin(C + π/2) = cos C，代入 A 的结论得 cos C = (3/2)sin C，故 tan C = 2/3，B 正确。\nC 错：由 tan C = 2/3 且 C ∈ (0, π/2) 得 sin C = 2√13/13，cos C = 3√13/13。\nA = π - B - C = π/2 - 2C，故 cos A = cos(π/2 - 2C) = sin 2C = 2 × (2√13/13) × (3√13/13) = 12/13。\n由余弦定理 BC² = AB² + AC² - 2·AB·AC·cos A = 4 + 9 - 2 × 2 × 3 × 12/13 = 13 - 144/13 = 25/13，\n故 BC = 5/√13 = 5√13/13 ≠ 25/13，C 不正确。\nD 对：cos A = 1 - 2sin²(A/2) = 12/13 ⇒ sin²(A/2) = (1 - 12/13)/2 = 1/26，\n故 sin(A/2) = √26/26（A/2 ∈ (0, π/2)，取正）；又 sin A = √(1 - (12/13)²) = 5/13。\n由 AD 平分 ∠BAC 及面积关系：S△ABC = S△ABD + S△ACD，即\n(1/2)·AB·AC·sin A = (1/2)·AB·AD·sin(A/2) + (1/2)·AC·AD·sin(A/2)。\n代入 (1/2) × 2 × 3 × 5/13 = (1/2)·AD·(√26/26)·(2 + 3)，得 15/13 = 5√26·AD/52，解得 AD = 6√26/13，D 正确。\n选 ABD。' }),

    q({ no: 11, qtype: 'multi', topic: '概率与期望', difficulty: 9, template: 'team-passing-markov-chain', points: 6,
      stem: '现有甲、乙、丙、丁四人组队传球，其中甲、乙为 A 队，丙、丁为 B 队。已知甲、乙传给队友的概率为 1/3，丙、丁传给队友的概率为 2/3，且任一传球者都会等可能地传球给非队友成员。现从甲开始传球，设传球次数为 n（n ∈ N₊ 且 n ≥ 2），则（　）',
      options: [
        { key: 'A', text: '传球 n 次后，球在甲手中的概率和球在乙手中的概率始终相等' },
        { key: 'B', text: 'n = 3 时，球在乙手中的概率为 5/27' },
        { key: 'C', text: '传球 n 次后，球在 A 队成员手中的概率恒为一个常数' },
        { key: 'D', text: '设球在乙手中的概率为 pₙ，则 pₙ = (1/6)[1 + (-1/3)^(n-1)]（n > 2）' }],
      answer: ['B', 'C', 'D'],
      solution: '甲传给乙、丙、丁的概率分别为 1/3、1/3、1/3；丙传给甲、乙、丁的概率分别为 1/6、1/6、2/3；丁传给甲、乙、丙的概率分别为 1/6、1/6、2/3。\nB 对（枚举传球路线）：n = 3 时球在乙手中的路线有 7 条，\n①甲-乙-丙-乙 ②甲-乙-甲-乙 ③甲-乙-丁-乙 ④甲-丙-甲-乙 ⑤甲-丙-丁-乙 ⑥甲-丁-甲-乙 ⑦甲-丁-丙-乙，\n概率依次为 1/54、1/27、1/54、1/54、1/27、1/54、1/27，七项相加得 10/54 = 5/27，B 正确。\nC 对：设传球 n 次后球在 A 队成员手中的概率为 Tₙ，在 B 队成员手中的概率为 Qₙ（Tₙ + Qₙ = 1）。\n由全概率公式 Tₙ₊₁ = (1/3)Tₙ + (1/3)Qₙ，Qₙ₊₁ = (2/3)Tₙ + (2/3)Qₙ，\n两式相除得 Qₙ₊₁/Tₙ₊₁ = 2，故 Tₙ₊₁ = (1/3)Tₙ + (1/3)(2Tₙ) = Tₙ，即 Tₙ 恒为常数（Tₙ = T₁ = 1/3），C 正确。\nD 对：球在乙手中只可能由上一步球在甲（1/3 概率传给乙）、丙或丁（各 1/6 概率传给乙）时得到，\n故 pₙ₊₁ = (1/3)(1/3 - pₙ) + (1/6)·(2/3) + (1/6)·(2/3) = 1/9 - (1/3)pₙ + 2/9 = 1/3 - (1/3)pₙ。\n整理得 pₙ₊₁ - 1/6 = (-1/3)(pₙ - 1/6)，故 {pₙ - 1/6} 是公比为 -1/3 的等比数列。\n又 p₁ = 1/3，p₁ - 1/6 = 1/6，于是 pₙ - 1/6 = (1/6)(-1/3)^(n-1)，即 pₙ = (1/6)[1 + (-1/3)^(n-1)]，D 正确。\nA 错：由 D 得 p₃ = (1/6)[1 + (-1/3)²] = (1/6)(10/9) = 5/27；\n又球在 A 队成员手中的概率恒为 1/3，故球在甲手中的概率 = 1/3 - 5/27 = 4/27 ≠ 5/27，两者不相等，A 错误。\n选 BCD。' }),

    q({ no: 12, qtype: 'fill', topic: '指数与对数函数', difficulty: 7, template: 'exp-log-reciprocal-base', points: 5,

    q({ no: 13, qtype: 'fill', topic: '概率与计数', difficulty: 8, template: 'block-permutation-repeat-merge', points: 5,
      stem: '用 1, 2, 3, 12 四个数组成一个五位数（每个数仅用到 1 次），则能组成 ____ 个不同的五位数。',
      answer: ['21'], accept: ['21'],
      solution: '把 1、2、3、12 四个数各用一次按顺序拼起来，共 4! = 24 种排法，每个结果都是五位数（12 占两位）。\n但把 12 当作整体与「1、2 相邻且 1 在 2 左边」的情形会拼出同一串数字：\n(1,2,3,12) 与 (12,3,1,2) 都拼成 12312；(1,2,12,3) 与 (12,1,2,3) 都拼成 12123；(3,1,2,12) 与 (3,12,1,2) 都拼成 31212。\n共有 3 组重复，故不同的五位数有 24 - 3 = 21 个。\n分类复核：1、2 相邻且 1 在左，等价于两个 12 与一个 3 排序，共 3 个；\n1、2 相邻且 2 在左，先排 1、2、3 有 2 种顺序，产生 3 个空插入 12，共 2 × 3 = 6 个；\n1、2 不相邻且 3 居中，先排 132 或 231 两种，再由 3 个数产生 4 个空插入 12，共 2 × 4 = 8 个；\n1、2 不相邻且 12 居中，先排 1、2 两种，此时 3 只能排首位或末位，共 2 × 2 = 4 个。\n合计 3 + 6 + 8 + 4 = 21 个，与 4! - 3 一致。' }),

    q({ no: 14, qtype: 'fill', topic: '圆锥曲线的离心率', difficulty: 8, template: 'hyperbola-perpendicular-focal', points: 5,
      stem: '已知双曲线 x² - y²/b² = 1 的左、右焦点分别为 F₁, F₂，过 F₂ 作直线交双曲线 C 的右半支于 P, Q 两点，满足 PF₁ ⊥ PQ，且 △QF₁F₂ 的面积是 △PF₁F₂ 面积的两倍，则双曲线 C 的离心率为 ____。',
      answer: ['√17/3'], accept: ['√17/3', '√17/3（≈1.3744）', '1.3744', '√17/3≈1.374'],
      solution: 'a = 1。△QF₁F₂ 与 △PF₁F₂ 有公共底边所在直线 F₁F₂，面积之比等于 P、Q 到直线 F₁F₂ 的距离之比；\n因 P、F₂、Q 三点共线且 P、Q 在同一侧（都在右半支），故 |F₂Q| = 2|PF₂|。\n设 |PF₂| = m（m > 0），则 |F₂Q| = 2m，|PQ| = |PF₂| + |F₂Q| = 3m。\n由双曲线定义 |PF₁| = 2a + m = 2 + m，|F₁Q| = 2a + |F₂Q| = 2 + 2m。\n因为 PF₁ ⊥ PQ，在 Rt△PF₁Q 中 |F₁Q|² = |PF₁|² + |PQ|²，即\n(2 + 2m)² = (2 + m)² + 9m² ⇒ 4 + 8m + 4m² = 4 + 4m + 10m² ⇒ 6m² - 4m = 0 ⇒ m = 2/3（m = 0 舍去）。\n故 |PF₁| = 8/3，|PF₂| = 2/3。\n又 PF₁ ⊥ PQ 且 F₂ ∈ PQ，故 ∠F₁PF₂ = 90°，于是 |F₁F₂|² = |PF₁|² + |PF₂|² = 64/9 + 4/9 = 68/9。\n即 4c² = 68/9，c² = 17/9；又 a² = 1，故 e = c/a = √(17/9) = √17/3。' }),

    q({ no: 15, qtype: 'big', topic: '统计与概率', difficulty: 7, template: 'histogram-median-stratified-hypergeom', points: 13,
      stem: '某学校开展了数学竞赛考试，从所有答卷中随机抽取 100 份作为样本，将样本的成绩（满分 100 分，成绩均为不低于 40 分的整数）分成六组：[40,50)，[50,60)，…，[90,100]，得到频率分布直方图，各组「频率/组距」依次为 0.005，0.010，0.020，a，0.025，0.010。',
      subs: [
        { kind: 'fillset', prompt: '（1）求 a 的值和样本成绩的中位数。依次填：a 的值、中位数。', points: 6,
          answer: [['0.030', '0.03', '0.0300'], ['75', '75分', '75 分']],
          solution: '（1）直方图中每组小矩形的面积之和为 1，故\n(0.005 + 0.010 + 0.020 + a + 0.025 + 0.010) × 10 = 1，即 0.070 + a = 0.1，解得 a = 0.030。\n成绩落在 [40,70) 内的频率为 (0.005 + 0.010 + 0.020) × 10 = 0.35 < 0.5，\n成绩落在 [40,80) 内的频率为 0.35 + 0.030 × 10 = 0.65 > 0.5，\n故中位数落在 [70,80) 内。设中位数为 m，则 0.35 + (m - 70) × 0.030 = 0.5，\n解得 m - 70 = 5，m = 75，即中位数为 75。', rubric: [{ pts: 3, text: '由各矩形面积之和为 1 得 0.070 + a = 0.1，解得 a = 0.030' }, { pts: 3, text: '由频率 0.35 + (m - 70)×0.030 = 0.5 解得中位数 m = 75' }] },
        { kind: 'fillset', prompt: '（2）学校用分层抽样的方法，从 [80,90)，[90,100] 两组内抽取了 7 份试卷作为优秀试卷，并从对应的学生中随机选取 3 人进行采访，设接受采访的学生中成绩在 [90,100] 内的有 X 人。依次填：X 的分布列 P(X=0)、P(X=1)、P(X=2)、数学期望 E(X)。', points: 7,
          answer: [['2/7'], ['4/7'], ['1/7'], ['6/7']],
          solution: '（2）由分层抽样可知：[80,90) 内的人数为 7 × 0.025/(0.025 + 0.010) = 5 人，[90,100] 内的人数为 2 人。\n故 X 的可能取值为 0，1，2，且服从超几何分布：\nP(X = 0) = C(5,3)/C(7,3) = 10/35 = 2/7，\nP(X = 1) = C(2,1)C(5,2)/C(7,3) = (2 × 10)/35 = 4/7，\nP(X = 2) = C(2,2)C(5,1)/C(7,3) = 5/35 = 1/7。\n所以 E(X) = 0 × 2/7 + 1 × 4/7 + 2 × 1/7 = 6/7。\n（校验：概率和为 2/7 + 4/7 + 1/7 = 1 ✓；超几何期望 n·M/N = 3 × 2/7 = 6/7 ✓。）', rubric: [{ pts: 2, text: '由分层抽样算得 [80,90) 抽 5 人、[90,100] 抽 2 人' }, { pts: 2, text: '确定 X 服从超几何分布，N = 7、M = 2、n = 3' }, { pts: 2, text: '算出 P(X=0) = 2/7、P(X=1) = 4/7、P(X=2) = 1/7' }, { pts: 1, text: '由期望公式得 E(X) = 0×2/7 + 1×4/7 + 2×1/7 = 6/7' }] }],
      solution: '（1）(0.005 + 0.010 + 0.020 + a + 0.025 + 0.010) × 10 = 1 得 a = 0.030；中位数在 [70,80) 内，0.35 + (m - 70) × 0.030 = 0.5 得中位数 m = 75。\n（2）[80,90) 抽 5 人、[90,100] 抽 2 人，X 服从超几何分布：P(X=0) = 2/7，P(X=1) = 4/7，P(X=2) = 1/7，E(X) = 6/7。' }),

    q({ no: 16, qtype: 'big', topic: '立体几何', difficulty: 8, template: 'pyramid-perp-plane-sine-angle', points: 15,
      stem: '在四棱锥 P-ABCD 中，平面 PAB ⊥ 平面 ABCD，AB ∥ CD，BC ⊥ AB，AB = 1 + √3，CD = √3，BC = PB = 2，且四棱锥 P-ABCD 的体积为 (2√3 + 1)/3。',
      subs: [
        { kind: 'order', prompt: '（1）证明：AB ⊥ PD。（把证明步骤按正确顺序排列）', points: 7,
          items: [
            { key: 's1', text: '作 PO ⊥ AB 于 O，连接 DO；由平面 PAB ⊥ 平面 ABCD 且交线为 AB，PO ⊂ 平面 PAB，得 PO ⊥ 平面 ABCD' },
            { key: 's2', text: '由 ABCD 为直角梯形得 S_ABCD = (1/2)(AB + CD)·BC = (1/2)(1 + √3 + √3) × 2 = 2√3 + 1，由 V = (1/3)·PO·S_ABCD = (2√3 + 1)/3 解得 PO = 1' },
            { key: 's3', text: '由 PB = 2 得 BO = √(PB² - PO²) = √3 = CD；又 BO ∥ CD，故四边形 BODC 为平行四边形，结合 BC ⊥ AB 得 DO ⊥ AB' },
            { key: 's4', text: '由 PO ⊥ AB、DO ⊥ AB 且 PO ∩ DO = O，PO、DO ⊂ 平面 POD，得 AB ⊥ 平面 POD；又 PD ⊂ 平面 POD，所以 AB ⊥ PD' }],
          answer: ['s1', 's2', 's3', 's4'],
          solution: '作 PO ⊥ AB 于 O，连接 DO。因为平面 PAB ⊥ 平面 ABCD，平面 PAB ∩ 平面 ABCD = AB，PO ⊂ 平面 PAB，所以 PO ⊥ 平面 ABCD。\n由题意四边形 ABCD 为直角梯形，S_ABCD = (1/2)(AB + CD)·BC = (1/2)(1 + √3 + √3) × 2 = 2√3 + 1。\n由 V_{P-ABCD} = (1/3)·PO·S_ABCD = (2√3 + 1)/3 解得 PO = 1。\n又 PB = 2，故 BO = √(PB² - PO²) = √3 = CD；因为 BO ∥ CD，所以四边形 BODC 为平行四边形。\n由于 BC ⊥ AB，得 DO ⊥ AB。\n于是 PO ⊥ AB、DO ⊥ AB，且 PO ∩ DO = O，PO、DO ⊂ 平面 POD，所以 AB ⊥ 平面 POD。\n因为 PD ⊂ 平面 POD，所以 AB ⊥ PD。', rubric: [{ pts: 2, text: '作 PO ⊥ AB 于 O，由面面垂直得 PO ⊥ 平面 ABCD' }, { pts: 2, text: '由 S_ABCD = 2√3 + 1 与体积 V 解得 PO = 1' }, { pts: 2, text: '得 BO = √3 = CD，故 BODC 为平行四边形，DO ⊥ AB' }, { pts: 1, text: '由 PO ⊥ AB、DO ⊥ AB 得 AB ⊥ 平面 POD，故 AB ⊥ PD' }] },
        { kind: 'fill', prompt: '（2）求平面 PAB 与平面 PCD 所成角的正弦值。', points: 8,
          accept: ['2√5/5', '2√5/5（≈0.8944）', '0.8944', '2*√5/5', '2√5/5=0.8944'],
          solution: '设平面 PAB 与平面 PCD 所成角为 θ。\n以 O 为原点，OB 所在直线为 y 轴，OD 所在直线为 x 轴，OP 所在直线为 z 轴建立空间直角坐标系。\n由（1）知 P(0, 0, 1)、D(2, 0, 0)、C(2, √3, 0)（由 BODC 为平行四边形得 |OD| = |BC| = 2、|DC| = |BO| = √3）。\n易知 n₁ = (1, 0, 0) 是平面 PAB 的一个法向量。\n设 n₂ = (x, y, z) 是平面 PDC 的法向量，由\nn₂·DC = √3·y = 0，n₂·PD = 2x - z = 0，取 x = 1 得 n₂ = (1, 0, 2)。\n则 cos θ = |n₁·n₂|/(|n₁||n₂|) = 1/(1 × √5) = √5/5。\n所以 sin θ = √(1 - (√5/5)²) = √(1 - 1/5) = √(4/5) = 2√5/5。\n即平面 PAB 与平面 PCD 所成角的正弦值为 2√5/5。', rubric: [{ pts: 3, text: '以 O 为原点建系，写出 P、D、C 的坐标' }, { pts: 3, text: '求出平面 PDC 的法向量 n₂ = (1, 0, 2)（n₁ = (1,0,0)）' }, { pts: 2, text: '由 cos θ = √5/5 得 sin θ = 2√5/5' }] }],
      solution: '（1）作 PO ⊥ AB 于 O，则 PO ⊥ 平面 ABCD；由 S_ABCD = 2√3 + 1 与 V = (2√3 + 1)/3 得 PO = 1，进而 BO = √3 = CD 得 BODC 为平行四边形，DO ⊥ AB；由 PO ⊥ AB、DO ⊥ AB 得 AB ⊥ 平面 POD，故 AB ⊥ PD。\n（2）建系得平面 PAB 的法向量 (1, 0, 0)、平面 PDC 的法向量 (1, 0, 2)，两面所成角的余弦值为 √5/5，故正弦值为 2√5/5。' }),

    q({ no: 17, qtype: 'big', topic: '数列的通项与求和', difficulty: 9, template: 'sequence-difference-telescoping-angle', points: 15,
      stem: '已知 Sₙ 是数列 {aₙ} 的前 n 项和，且满足 Sₙ = 1 - 1/(n + 1)。\n（2）在平面直角坐标系 xOy 中，已知点 P(1, 0)，定义点 Aₙ(1 + 1/aₙ, 1)，Bₙ(n, 1)（其中 n ∈ N₊），记 αₙ = ∠AₙOP，βₙ = ∠BₙOP。',
      subs: [
        { kind: 'fill', prompt: '（1）求数列 {aₙ} 的通项公式。', points: 5,
          accept: ['1/(n²+n)', '1/(n^2+n)', '1/(n(n+1))', 'aₙ=1/(n²+n)', '1/(n²+n)（n∈N₊）'],
          solution: '当 n = 1 时，a₁ = S₁ = 1 - 1/2 = 1/2。\n当 n ≥ 2 时，aₙ = Sₙ - Sₙ₋₁ = (1 - 1/(n + 1)) - (1 - 1/n) = 1/n - 1/(n + 1) = 1/(n(n + 1)) = 1/(n² + n)。\n经检验 n = 1 时 1/(1² + 1) = 1/2 也满足，故 aₙ = 1/(n² + n)（n ∈ N₊）。', rubric: [{ pts: 3, text: '由 aₙ = Sₙ - Sₙ₋₁ 得 n ≥ 2 时 aₙ = 1/n - 1/(n+1)' }, { pts: 2, text: '验证 n = 1 时 a₁ = 1/2 也满足，写出 aₙ = 1/(n²+n)' }] },
        { kind: 'fill', prompt: '（2）（i）求 tan(β₂ + β₃) 的值。', points: 5,
          accept: ['1'],
          solution: '由 Bₙ(n, 1) 知 tan βₙ = 1/n，故 tan β₂ = 1/2，tan β₃ = 1/3。\ntan(β₂ + β₃) = (tan β₂ + tan β₃)/(1 - tan β₂·tan β₃) = (1/2 + 1/3)/(1 - 1/2 × 1/3) = (5/6)/(5/6) = 1。', rubric: [{ pts: 3, text: '由 Bₙ(n,1) 得 tan β₂ = 1/2、tan β₃ = 1/3' }, { pts: 2, text: '由两角和正切公式得 (5/6)/(5/6) = 1' }] },
        { kind: 'order', prompt: '（2）（ii）证明：α₁ + α₂ + … + αₙ + βₙ₊₁ = π/4。（把证明步骤按正确顺序排列）', points: 5,
          items: [
            { key: 's1', text: '由 aₙ = 1/(n² + n) 得 Aₙ(1 + n² + n, 1)，故 tan αₙ = 1/(n² + n + 1)' },
            { key: 's2', text: '由 tan βₙ = 1/n 计算 tan(βₙ - βₙ₊₁) = (1/n - 1/(n + 1))/(1 + 1/(n(n + 1))) = 1/(n² + n + 1)' },
            { key: 's3', text: 'βₙ - βₙ₊₁ ∈ (0, π/4) 且 αₙ ∈ (0, π/4)，故由 tan(βₙ - βₙ₊₁) = tan αₙ 得 αₙ = βₙ - βₙ₊₁' },
            { key: 's4', text: '代回求和：(β₁ - β₂) + (β₂ - β₃) + … + (βₙ - βₙ₊₁) + βₙ₊₁ = β₁ = π/4，原式得证' }],
          answer: ['s1', 's2', 's3', 's4'],
          solution: '由题意 Aₙ(1 + 1/aₙ, 1) = Aₙ(n² + n + 1, 1)，故 tan αₙ = 1/(n² + n + 1)。\n又 tan βₙ = 1/n，于是\ntan(βₙ - βₙ₊₁) = (tan βₙ - tan βₙ₊₁)/(1 + tan βₙ·tan βₙ₊₁) = (1/n - 1/(n + 1))/(1 + 1/(n(n + 1))) = (1/(n(n + 1)))/((n² + n + 1)/(n(n + 1))) = 1/(n² + n + 1)。\n所以 tan(βₙ - βₙ₊₁) = tan αₙ。\n因为 βₙ - βₙ₊₁ ∈ (0, π/4)，αₙ ∈ (0, π/4)，在该区间内正切函数单调，故 βₙ - βₙ₊₁ = αₙ。\n于是 α₁ + α₂ + … + αₙ + βₙ₊₁ = (β₁ - β₂) + (β₂ - β₃) + … + (βₙ - βₙ₊₁) + βₙ₊₁ = β₁。\n而 tan β₁ = 1，且 β₁ ∈ (0, π/4)，所以 β₁ = π/4，原式得证。', rubric: [{ pts: 1, text: '由 Aₙ(n² + n + 1, 1) 得 tan αₙ = 1/(n² + n + 1)' }, { pts: 2, text: '得 tan(βₙ - βₙ₊₁) = 1/(n² + n + 1) = tan αₙ' }, { pts: 1, text: '由两角均在 (0, π/4) 内得 αₙ = βₙ - βₙ₊₁' }, { pts: 1, text: '累加相消得 β₁ = π/4，原式得证' }] }],
      solution: '（1）a₁ = S₁ = 1/2，n ≥ 2 时 aₙ = Sₙ - Sₙ₋₁ = 1/n - 1/(n + 1) = 1/(n² + n)，n = 1 也适用，故 aₙ = 1/(n² + n)。\n（2）（i）tan β₂ = 1/2、tan β₃ = 1/3，故 tan(β₂ + β₃) = (5/6)/(5/6) = 1。\n（2）（ii）Aₙ(n² + n + 1, 1) ⇒ tan αₙ = 1/(n² + n + 1)；而 tan(βₙ - βₙ₊₁) = 1/(n² + n + 1) = tan αₙ，且两角均在 (0, π/4) 内，故 αₙ = βₙ - βₙ₊₁；\n累加得 α₁ + … + αₙ + βₙ₊₁ = β₁ = π/4。' }),

    q({ no: 18, qtype: 'big', topic: '抛物线的性质', difficulty: 9, template: 'parabola-chord-cos-three-collinear', points: 17,
      stem: '已知抛物线 C: y² = 2px（p > 0），过点 Q(2, 0) 的直线 l 交 C 于 A，B 两点，O 为坐标原点。当 l 与 x 轴垂直时，|AB| = 4√2。\n（2）若 cos∠AOB = -√13/13，过 x 轴上一点 P 作直线 OA，OB，AB 的垂线，垂足分别为 E，F，G，且满足 E，F，G 三点共线。',
      subs: [
        { kind: 'fill', prompt: '（1）求抛物线 C 的解析式。', points: 6,
          accept: ['y²=4x', 'y^2=4x', 'y²-4x=0', 'y^2-4x=0'],
          solution: '当 l 与 x 轴垂直时，l 的方程为 x = 2，代入 y² = 2px 得 y² = 4p，故 y = ±2√p，\n于是 |y_A| = |y_B| = 2√p，|AB| = 4√p = 4√2，解得 p = 2。\n所以抛物线 C 的解析式为 y² = 4x。', rubric: [{ pts: 3, text: '由 l ⊥ x 轴时 l: x = 2，代入得 y² = 4p，|AB| = 4√p' }, { pts: 3, text: '由 4√p = 4√2 解得 p = 2，写出 y² = 4x' }] },
        { kind: 'fillset', prompt: '（2）（i）求直线 l 的方程。（两条直线各填一个，顺序不限；写成 x=y+2 或 y=x-2 这样的形式）', points: 5,
          answer: [['x=y+2', 'y=x-2', 'x-y-2=0', 'y-x+2=0'], ['x=-y+2', 'y=-x+2', 'x+y-2=0', 'y+x-2=0']],
          solution: '（2）（i）由题意直线 l 的斜率不为 0，设 l: x = my + 2，A(x₁, y₁)，B(x₂, y₂)。\n联立 y² = 4x 与 x = my + 2 消去 x 得 y² - 4my - 8 = 0，\n由韦达定理 y₁ + y₂ = 4m，y₁y₂ = -8。\n于是 x₁ + x₂ = m(y₁ + y₂) + 4 = 4m² + 4，x₁x₂ = (my₁ + 2)(my₂ + 2) = m²y₁y₂ + 2m(y₁ + y₂) + 4 = 4。\ncos∠AOB = (x₁x₂ + y₁y₂)/(|OA||OB|) = -4/√((x₁² + y₁²)(x₂² + y₂²))。\n由 y₁² = 4x₁ 等得 (x₁² + y₁²)(x₂² + y₂²) = x₁(x₁ + 4)·x₂(x₂ + 4) = x₁x₂[x₁x₂ + 4(x₁ + x₂) + 16] = 4[4 + 4(4m² + 4) + 16] = 16(4m² + 9)。\n所以 cos∠AOB = -4/(4√(4m² + 9)) = -1/√(4m² + 9)。\n由 -1/√(4m² + 9) = -√13/13 = -1/√13 得 4m² + 9 = 13，即 m² = 1，m = ±1。\n故直线 l 的方程为 x = y + 2 或 x = -y + 2（即 x - y - 2 = 0 或 x + y - 2 = 0）。', rubric: [{ pts: 2, text: '设 l: x = my + 2 并联立，得 y₁ + y₂ = 4m、y₁y₂ = -8' }, { pts: 2, text: '由 cos∠AOB = -1/√(4m² + 9) = -√13/13 得 m² = 1' }, { pts: 1, text: '写出 l: x = y + 2 或 x = -y + 2' }] },
        { kind: 'fill', prompt: '（2）（ii）求 P 点的坐标。', points: 6,
          accept: ['(10,0)', '(10, 0)', 'P(10,0)', 'P(10, 0)', '(10，0)'],
          solution: '（2）（ii）由对称性，不妨取 l: x = y + 2（此时 m = 1，y₁ + y₂ = 4，y₁y₂ = -8）。\n设 P(a, 0)。由 y₁² = 4x₁ 得 OA 的斜率 k_OA = y₁/x₁ = 4/y₁，\n故 OA: y = (4/y₁)x；由 PE ⊥ OA 得 k_PE = -y₁/4，直线 PE: y = -(y₁/4)(x - a)。\n与 OA 联立解得 E(a·y₁²/(y₁² + 16), 4a·y₁/(y₁² + 16))，同理 F(a·y₂²/(y₂² + 16), 4a·y₂/(y₂² + 16))。\n于是 x_E - x_F = 16a(y₁ - y₂)(y₁ + y₂)/((y₁² + 16)(y₂² + 16))，\ny_E - y_F = 4a(y₁ - y₂)(16 - y₁y₂)/((y₁² + 16)(y₂² + 16))，\n故 k_EF = (y_E - y_F)/(x_E - x_F) = (16 - y₁y₂)/(4(y₁ + y₂)) = (16 + 8)/(4 × 4) = 3/2。\n又 AB 的斜率为 1（x = y + 2 即 y = x - 2），由 PG ⊥ AB 得 k_PG = -1，直线 PG: y = -(x - a)。\n联立 y = x - 2 与 y = -(x - a) 解得 G((a + 2)/2, (a - 2)/2)。\nE、F、G 三点共线即 G 在直线 EF 上；由 y₁² = 4y₁ + 8（y₁ 是 y² - 4y - 8 = 0 的根）可把过 E 且斜率为 3/2 的直线化简为\nEF: y = (3/2)x - a/2。\n代入 G 得 (a - 2)/2 = (3/2)·(a + 2)/2 - a/2 = (a + 6)/4，即 2a - 4 = a + 6，解得 a = 10。\n所以 P 点的坐标为 (10, 0)。', rubric: [{ pts: 2, text: '设 P(a,0)，由 PE ⊥ OA、PF ⊥ OB 求出 E、F' }, { pts: 2, text: '由 PG ⊥ AB 得 G((a+2)/2, (a-2)/2)，并得 k_EF = 3/2' }, { pts: 2, text: '由 E、F、G 三点共线得 EF: y = (3/2)x - a/2，解得 a = 10' }] }],
      solution: '（1）l ⊥ x 轴时 |AB| = 4√p = 4√2 ⇒ p = 2，故 C: y² = 4x。\n（2）（i）设 l: x = my + 2，联立 y² = 4x 得 y² - 4my - 8 = 0，y₁ + y₂ = 4m，y₁y₂ = -8；\n由 cos∠AOB = -1/√(4m² + 9) = -√13/13 得 m² = 1，即 m = ±1，故 l: x = y + 2 或 x = -y + 2。\n（2）（ii）由对称性取 l: x = y + 2，设 P(a, 0)，用 PE ⊥ OA、PF ⊥ OB 求出 E、F，得 k_EF = (16 - y₁y₂)/(4(y₁ + y₂)) = 3/2；\n再由 PG ⊥ AB 求出 G((a + 2)/2, (a - 2)/2)，由 E、F、G 三点共线解得 a = 10，故 P(10, 0)。' }),

    q({ no: 19, qtype: 'big', topic: '导数综合', difficulty: 10, template: 'log-tangent-extremum-parameter', points: 17,
      stem: '已知函数 f(x) = xln(x + a) - 2x + 2ln(x + 1)，g(x) = 2ln(x + a + 1) - 3x。（参考数据：e = 2.71828…，e² = 7.38906…，e³ = 20.08554…）',
      subs: [
        { kind: 'fill', prompt: '（1）若 a = 0，求 g(x) 在 (1, g(1)) 处的切线 l 的方程。', points: 5,
          accept: ['y=-2x+2ln2-1', 'y = -2x + 2ln2 - 1', '-2x+2ln2-1', 'y=-2x+ln4-1', '2x+y-2ln2+1=0'],
          solution: 'a = 0 时 g(x) = 2ln(x + 1) - 3x，g′(x) = 2/(x + 1) - 3。\n所以 g′(1) = 2/2 - 3 = -2，g(1) = 2ln2 - 3，切点为 (1, 2ln2 - 3)。\n切线 l: y - (2ln2 - 3) = -2(x - 1)，化简得 y = -2x + 2ln2 - 1。', rubric: [{ pts: 2, text: '求导得 g′(x) = 2/(x + 1) - 3' }, { pts: 2, text: '算出 g(1) = 2ln2 - 3、g′(1) = -2' }, { pts: 1, text: '写出切线方程 y = -2x + 2ln2 - 1' }] },
        { kind: 'choice', prompt: '（2）判断 x = 0 是否是函数 f(x) 的极值点？', points: 5,
          options: [
            { key: 'A', text: '是极值点' },
            { key: 'B', text: '不是极值点' },
            { key: 'C', text: '无法判断' }],
          answer: 'B',
          solution: 'f′(x) = ln(x + a) + x/(x + a) - 2 + 2/(x + 1)。\n若 x = 0 是极值点，则必有 f′(0) = 0，即 ln a + 0 - 2 + 2 = ln a = 0，得 a = 1。\n当 a ≠ 1 时 f′(0) = ln a ≠ 0，x = 0 不是极值点。\n当 a = 1 时，f′(x) = ln(x + 1) + x/(x + 1) - 2 + 2/(x + 1) = ln(x + 1) + (x + 2)/(x + 1) - 2\n= ln(x + 1) + 1 + 1/(x + 1) - 2 = ln(x + 1) - 1 + 1/(x + 1)。\n令 F(x) = ln(x + 1) - 1 + 1/(x + 1)，则 F′(x) = 1/(x + 1) - 1/(x + 1)² = x/(x + 1)²。\n所以 F(x) 在 (-1, 0) 上单调递减，在 (0, +∞) 上单调递增，\n故 F(x) ≥ F(0) = 0，即 f′(x) ≥ 0，f(x) 在 (-1, +∞) 上单调递增，x = 0 不是极值点。\n综上，x = 0 不是函数 f(x) 的极值点，选 B。', rubric: [{ pts: 2, text: '求导得 f′(x)，由 f′(0) = ln a 得 a = 1 才可能是极值点' }, { pts: 2, text: 'a ≠ 1 时 f′(0) ≠ 0，x = 0 不是极值点' }, { pts: 1, text: 'a = 1 时证得 f′(x) ≥ 0 恒成立，f 单调递增' }] },
        { kind: 'fill', prompt: '（3）若不等式 f(x) > g(x) + k(x - 2) 对任意的 x ∈ (2, +∞)，a ∈ [0, 2] 恒成立，求正整数 k 的最大值。', points: 7,
          accept: ['4', 'k=4', 'k=4', 'k 的最大值为 4'],
          solution: '由题意：xln(x + a) - 2ln(x + a + 1) > -x - 2ln(x + 1) + k(x - 2)。\n以 a 为主元，令 h(a) = xln(x + a) - 2ln(x + a + 1)（a ∈ [0, 2]），\n则 h′(a) = x/(x + a) - 2/(x + a + 1) = (x² - x + (x - 2)a)/((x + a)(x + a + 1))。\n当 x > 2 时 x² - x > 2，且 x - 2 > 0，a ≥ 0，故分子 > 0，h(a) 在 [0, 2] 上单调递增，\n所以 h(a) 的最小值为 h(0) = xlnx - 2ln(x + 1)。\n故只需 xlnx - 2ln(x + 1) > -x - 2ln(x + 1) + k(x - 2) 对 x ∈ (2, +∞) 恒成立，\n即 xlnx + x > k(x - 2)，亦即 k < (xlnx + x)/(x - 2) 对 x ∈ (2, +∞) 恒成立。\n法一：设 φ(x) = xlnx + x - k(x - 2)（x > 2），φ′(x) = lnx + 2 - k。\n当 k ≤ 2 + ln2 时，φ′(x) > 0 恒成立，φ(x) 在 (2, +∞) 上单调递增，φ(x) > φ(2) = 2ln2 + 2 > 0，成立。\n当 k > 2 + ln2 时，φ(x) 在 (2, e^(k-2)) 上递减、在 (e^(k-2), +∞) 上递增，\n故只需 φ(e^(k-2)) > 0，即 2k - e^(k-2) > 0。\n令 H(k) = 2k - e^(k-2)，则 H′(k) = 2 - e^(k-2) < 0（k > 2 + ln2），H(k) 在 (2 + ln2, +∞) 上单调递减。\n由 e² < 8、e³ > 10 得 H(4) = 8 - e² > 0，H(5) = 10 - e³ < 0，\n所以正整数 k 最大可取到 4。\n法二：分离参数，由 k < (xlnx + x)/(x - 2) 设 ψ(x) = (xlnx + x)/(x - 2)，\nψ′(x) = (x - 2lnx - 4)/(x - 2)²；令 H(x) = x - 2lnx - 4，H′(x) = 1 - 2/x > 0（x > 2），\nH(x) 在 (2, +∞) 上单调递增，H(8) = 8 - 2ln8 - 4 = 4 - 6ln2 < 0，H(10) = 6 - 2ln10 = 2(3 - ln10) > 0，\n故存在 x₀ ∈ (8, 10) 使 ψ 在 (2, x₀) 上递减、在 (x₀, +∞) 上递增，且 x₀ = 2lnx₀ + 4。\n所以 k < ψ(x₀) = (x₀lnx₀ + x₀)/(x₀ - 2) = (x₀lnx₀ + x₀)/(2lnx₀ + 2) = x₀/2 ∈ (4, 5)，\n故正整数 k 最大为 4。\n法三：取 x = e²，由 k < (xlnx + x)/(x - 2) 得 k < (e²lne² + e²)/(e² - 2) = 3 + 6/(e² - 2)。\n由 5 < e² < 8 得 6/(e² - 2) ∈ (1, 2)，故 3 + 6/(e² - 2) ∈ (4, 5)，所以 k ≤ 4。\n再验证 k = 4 成立：即证 lnx - 3 + 8/x > 0 对 x ∈ (2, +∞) 恒成立。\n设 φ(x) = lnx - 3 + 8/x，φ′(x) = 1/x - 8/x² = (x - 8)/x²，\nφ(x) 在 (2, 8) 上递减、在 (8, +∞) 上递增，故 φ(x) ≥ φ(8) = ln8 - 3 + 1 = 3ln2 - 2 > 0，\nk = 4 成立（3ln2 ≈ 2.079 > 2）。\n综上，正整数 k 的最大值为 4。', rubric: [{ pts: 3, text: '以 a 为主元得 h(a) 递增，只需 xlnx + x > k(x - 2) 恒成立' }, { pts: 2, text: '分离参数得 k < (xlnx + x)/(x - 2)，解得 k ≤ 4（正整数）' }, { pts: 2, text: '验证 k = 4 时 lnx - 3 + 8/x > 0 在 x > 2 时恒成立' }] }],

      solution: '关于 x = π/6 对称 ⇒ f(π/3 - x) = f(x)。\n取 x = 0：f(π/3) = f(0) = b，即 a·sin(2π/3) + b·cos(2π/3) = b ⇒ a·(√3/2) + b·(-1/2) = b ⇒ a = √3 b。\n于是 f(x) = √3 b sin2x + b cos2x = 2b·sin(2x + π/6)。\nA：周期 T = 2π/2 = π ✓\nB：f(x + 5π/12) = 2b·sin(2x + 5π/6 + π/6) = 2b·sin(2x + π) = -2b·sin2x，是奇函数 ✓\nC：在 (-π/3, π/6) 上 2x + π/6 ∈ (-π/2, π/2)，sin 严格递增，故 f 的单调性完全由系数 b 的符号决定（b > 0 递增、b < 0 递减）；题设 ab ≠ 0 只保证 b ≠ 0，并未确定 b 的符号，故「f 单调递增」不能恒成立 ✗\nD：sin(2x + π/6) = 0 ⇒ 2x + π/6 = kπ ⇒ x = kπ/2 - π/12；在 (-π/12, 5π/3) 内取 k = 1,2,3，得 x = 5π/12、11π/12、17π/12，共 3 个 ✓\n所以选 ABD。' }),

    q({ no: 11, qtype: 'multi', topic: '解析几何与椭圆', difficulty: 8, template: 'ellipse-four-point-circle', points: 6,
      stem: '已知椭圆 x²/4 + y² = 1 的左右焦点分别为 F₁、F₂，上下顶点分别为 B₁、B₂，左顶点为 A₁。P、Q 是椭圆上除顶点外的关于原点对称的两点，则下列四点可能共圆的是（　）',
      options: [
        { key: 'A', text: 'P, Q, F₁, F₂' },
        { key: 'B', text: 'P, Q, B₁, B₂' },
        { key: 'C', text: 'P, Q, F₁, B₁' },
        { key: 'D', text: 'P, Q, A₁, B₁' }],
      answer: ['A', 'C', 'D'],
      solution: '椭圆：a = 2，b = 1，c = √3。F₁(-√3,0)、F₂(√3,0)、B₁(0,1)、B₂(0,-1)、A₁(-2,0)。\n设 P(p,q) 在椭圆上（p² + 4q² = 4，且 P 不是顶点，故 p、q ≠ 0），Q(-p,-q)。\n关键工具：过 P、Q 的圆的圆心 M 必满足 M·P = 0（因为 |M-P| = |M-Q| ⇔ M·P = 0），此时圆半径平方 R² = |M|² + |P|²；\n于是另一个点 X 也在这个圆上 ⇔ |X|² - 2M·X = p² + q²。逐项代入即可。\nA：F₁F₂ 的中垂线是 y 轴 ⇒ M = (0,m)；再由 M·P = 0 得 mq = 0 ⇒ m = 0，即圆心就是原点。\n此时还需 |OP| = |OF₁| ⇒ p² + q² = 3，与 p² + 4q² = 4 联立得 q² = 1/3、p² = 8/3（不是顶点）⇒ 可以共圆 ✓\nB：B₁B₂ 的中垂线是 x 轴 ⇒ M = (m,0)；由 M·P = 0 得 mp = 0 ⇒ m = 0，同样要求 p² + q² = 1，\n与椭圆联立得 q² = 1 ⇒ P 是上下顶点，被排除 ⇒ 不可能 ✗\nC：写 M = λ(-q, p)。由 "F₁ 在圆上" 得 3 - 2√3λq = p² + q²，由 "B₁ 在圆上" 得 1 - 2λp = p² + q²，\n两式相减得 λ(√3q - p) = 1。令 t = p/q，由椭圆得 q² = 4/(t² + 4)，代入化简：\n(√3 - 3t)/(√3 - t) = 4(t² + 1)/(t² + 4) ⇒ t(t² - 3√3t - 8) = 0。\nt ≠ 0，而 t² - 3√3t - 8 = 0 的判别式 27 + 32 = 59 > 0，t = (3√3 ± √59)/2 有实数解 ⇒ 可以共圆 ✓\nD：写 M = λ(-q, p)。由 "A₁ 在圆上" 得 4 + 4Mx = p² + q²，由 "B₁ 在圆上" 得 1 - 2My = p² + q²，\n两式相减得 4Mx + 2My + 3 = 0，代 M = λ(-q,p) 得 λ(2p - 4q) = -3 ⇒ λ = -3/(2q(t-2))。\n代回 4 + 4Mx = p² + q²（其中 4Mx = -4λq = 6/(t-2)）：4 + 6/(t-2) = 4(t²+1)/(t²+4) ⇒ 6t(t + 2) = 0。\nt ≠ 0 ⇒ t = -2，即 p = -2q（如 q = √2/2 时 P(-√2, √2/2)、Q(√2, -√2/2)，均在椭圆上且非顶点）⇒ 可以共圆 ✓\n验算：此时 A₁(-2,0)、B₁(0,1)、P(-√2, √2/2)、Q(√2, -√2/2) 都在圆 x² + y² + (3/4)x + (3/2)y - 5/2 = 0 上，\n逐点代入均成立（P 点：2 + 1/2 - 3√2/4 + 3√2/4 - 5/2 = 0 ✓）。\n所以能共圆的是 A、C、D，不能的是 B ⇒ 选 ACD。（原采集稿曾误判 A、D 不可能而改成 AC，已按上述重算订正回官方答案 ACD。）' }),

    q({ no: 16, qtype: 'big', topic: '导数综合', difficulty: 9, template: 'cubic-arithmetic-roots', points: 15,

          accept: ['y=x-2', 'y = x - 2', 'x-y-2=0', 'y=x−2'],

    q({ no: 17, qtype: 'big', topic: '解三角形', difficulty: 8, template: 'triangle-side-angle-sine-max', points: 15,
      stem: '记 △ABC 的内角 A, B, C 的对边分别为 a, b, c。',
      solution: '证「A > B ⇔ a > b」，并求 cosA + cosB + sinC 的最大值 3√3/2。',
      subs: [
        { kind: 'fill', points: 5, prompt: '(1) 求证：「A > B」是「a > b」的充要条件。本小问改写为：在 △ABC 中，A > B 时 sinA 与 sinB 的大小关系是（填 > 或 <）。',
          accept: ['>', '大于'],
          solution: '由正弦定理 a/sinA = b/sinB = 2R ⇒ a > b ⇔ sinA > sinB（R > 0）。\n又 A, B ∈ (0, π)，在 (0, π) 上 sinA > sinB ⇔ A > B（可对 A + B < π 用和差公式验证）。\n故 A > B ⇔ a > b，即「A > B」是「a > b」的充要条件；A > B 时 sinA > sinB。', rubric: [{ pts: 3, text: '由正弦定理得 a > b ⇔ sinA > sinB' }, { pts: 2, text: '在 (0, π) 上由单调性得 sinA > sinB ⇒ A > B' }] },
        { kind: 'fill', points: 10, prompt: '(2) 求 cosA + cosB + sinC 的最大值。',
          accept: ['3√3/2', '3√3÷2', '(3√3)/2', '3倍根号3/2', '2.5981'],
          solution: 'C = π - A - B，故 sinC = sin(A + B)，目标 S = cosA + cosB + sin(A + B)。\n由余弦和差化积 cosA + cosB = 2cos((A+B)/2)cos((A-B)/2)，\n及 sin(A+B) = 2sin((A+B)/2)cos((A+B)/2)，得\nS = 2cos((A+B)/2)·[cos((A-B)/2) + sin((A+B)/2)]，最大值在 A = B 处取得（此时第一个因子最大、且两项同向）。\n令 A = B = x，则 C = π - 2x，S = 2cos x + sin2x（0 < x < π/2）。\n求导：S′ = -2sin x + 2cos2x = 2(1 - 2sin²x) - 2sin x = -2(2sin x - 1)(sin x + 1)。\n在 (0, π/2) 内唯一驻点 sin x = 1/2 ⇒ x = π/6；\n且 x < π/6 时 S′ > 0、x > π/6 时 S′ < 0，故 x = π/6 取得最大值。\nS(π/6) = 2cos(π/6) + sin(π/3) = 2·(√3/2) + √3/2 = 3√3/2。\n再严格复核 A ≠ B 的情形：Lagrange 条件 -sinA + cos(A+B) = 0 与 -sinB + cos(A+B) = 0 相减得 sinA = sinB，在 A + B < π 内只有 A = B，故最大值只能在 A = B 处取；边界 A → 0 时 S → 1 + √2 ≈ 2.414，A + B → π 时 S → 0，都比它小。\n所以最大值 = 3√3/2 ≈ 2.598，在 A = B = π/6（即 C = 2π/3）处取得（3×10³×3×10³ 网格扫描得最大值 2.598076211，与 3√3/2 一致）。\n【审校订正】原答案 2√3 → 正确值 3√3/2：因为 cosA + cosB ≤ 2、sinC ≤ 1，故 S ≤ 3 < 2√3 ≈ 3.464，2√3 不可能；原稿在驻点处已经算出 S(π/6) = 3√3/2，结论却被写成 2√3（来源答案的公式被剥空，只留下 2cos、sin x = 1 等片段，按上式复原应为 3√3/2）。', rubric: [{ pts: 3, text: '令 A = B = x，得 S = 2cos x + sin 2x' }, { pts: 3, text: '因式分解 S′ = -2(2sin x - 1)(sin x + 1)' }, { pts: 2, text: '由 sin x = 1/2 得驻点 x = π/6 并判定为最大值点' }, { pts: 2, text: '算出 S(π/6) = 3√3/2' }] }
      ] }),

          solution: '设切点为 P(m₁,n₁)、M(m₂,n₂)（都在 E 上，4m² - n² = 4），切线方程 4mx - ny = 4，斜率 k = 4m/n。\n由 T 在切线上得 4m t - n(t+1) = 4；与 4m² - n² = 4 联立可用该切线的斜率 k 表示切点：\nc = (t+1) - kt（c 为切线在 y 轴上的截距），n = -4/c，m = -k/c …… ①（由 k = 4m/n 与 c = -4/n 得）。\n切线 4mx - ny = 4 与直线 x = -1 的交点纵坐标 = -4(m+1)/n = c - k = (t+1)(1 - k)。\n故 Q(-1, (t+1)(1 - k₁))（k₁ 为 TP 的斜率）、N(-1, (t+1)(1 - k₂))（k₂ 为 TM 的斜率），而 P、M 由 ① 给出。\n由 (*) 用韦达定理：k₁ + k₂ = 2t/(t-1)，k₁k₂ = ((t+1)² + 4)/(t² - 1)（t ≠ ±1）。\n把 P、N 与 M、Q 分别代入两点式直线方程并联立化简，得交点 R((5 - t)/(3(t-1)), 2(t+1)/(3(t-1)))。\n代入验证：y_R - x_R - 1 = [2(t+1) - (5 - t) - 3(t-1)]/(3(t-1)) = (2t + 2 - 5 + t - 3t + 3)/(3(t-1)) = 0，\n故交点恒在定直线 y = x + 1（一般式 x - y + 1 = 0）上。\n数值复核（12 个 t 值）：t = -0.9 → (-1.035087719, -0.035087719)；t = -0.5 → (-1.222222222, -0.222222222)；t = 0 → (-1.666666667, -0.666666667)；\nt = 0.5 → (-3, -2)；t = 0.9 → (-13.666666667, -12.666666667)；t = 1.5 → (2.333333333, 3.333333333)：每个点都满足 y - x - 1 = 0（误差 < 1e-9）。\n【审校订正】原答案「定直线 x + y + 2 = 0、交点恒为 (-1,-1)」→ 正确值「定直线 y = x + 1（即 x - y + 1 = 0）」，理由：原稿附的 t = 3 验证是伪造的 —— P(2,2)、M(5/3,2/3) 都不在双曲线 x² - y²/4 = 1 上（4 - 1 = 3 ≠ 1、25/9 - 1/9 = 8/3 ≠ 1）；用正确切点重算，交点轨迹恒为 y = x + 1。', rubric: [{ pts: 2, text: '写出过 T 的切线方程 4mx - ny = 4' }, { pts: 2, text: '由韦达定理得 k₁ + k₂、k₁k₂，求出交点 R 的坐标' }, { pts: 2, text: '验证 y_R - x_R - 1 = 0，定直线为 x - y + 1 = 0' }] }

    q({ no: 7, qtype: 'single', topic: '函数与方程', difficulty: 8, template: 'abs-log-zeros-product-range', points: 5,

    q({ no: 8, qtype: 'single', topic: '概率与计数', difficulty: 8, template: 'dice-turn-game-probability', points: 5,

    q({ no: 11, qtype: 'multi', topic: '导数与函数性质', difficulty: 9, template: 'cubic-k-linear-definition', points: 6,
      stem: '如果函数 f(x) 满足两个条件：①有且仅有两个不相等的极值点 x₁, x₂，②点 A(x₁, f(x₁)), B(x₂, f(x₂)) 与原点三点共线（三点互不重合），且该直线斜率为 k，那么我们称 f(x) 为具有"k 线性"。已知函数 f(x) = ax³ + bx² + cx + d（a ≠ 0），且 b² - 3ac > 0，下列说法正确的是（　）',
      options: [
        { key: 'A', text: '若 f(x) = x³ - 3x，则 f(x) 具有"-2 线性"' },
        { key: 'B', text: '存在实数 h，使得 y = f(x) + h 具有"k 线性"' },
        { key: 'C', text: '若 f(x) 具有"k 线性"，则 bc = 9ad' },
        { key: 'D', text: '若 f(x) 具有"k 线性"，则 k = (6ac - 2b²)/(9a)' }],
      answer: ['A', 'C', 'D'],
      solution: 'A：f(x) = x³ - 3x，f′(x) = 3x² - 3 = 0 得 x = ±1，此时 f(x₁)/x₁ = f(x₂)/x₂ = (1 - 3)/(-1) = -2，A 正确。\nB：取反例 f(x) = 2x³ - 3x²，对任意实数 h，其图象上满足条件的 A、B 与原点不可能三点共线（或其中两点重合），B 错误。\nC、D：f′(x) = 3ax² + 2bx + c 的两零点为 x₁, x₂，则 x₁ + x₂ = -2b/(3a)，x₁x₂ = c/(3a)，由 b² - 3ac > 0 知 c ≠ 0。\n设 f(x₁)/x₁ = f(x₂)/x₂ = k，即 ax₁² + bx₁ + c + d/x₁ = k 且 ax₂² + bx₂ + c + d/x₂ = k。\n两式相减得 a(x₁ + x₂) + b - d/(x₁x₂) = 0，即 a·(-2b/(3a)) + b - 3ad/c = 0，整理得 bc = 9ad，C 正确。\n再把两式改写为 ax₁³ + bx₁² + cx₁ + d = kx₁ 与 ax₂³ + bx₂² + cx₂ + d = kx₂，相减得\na(x₁² + x₁x₂ + x₂²) + b(x₁ + x₂) + c - k = 0，代入 x₁ + x₂ = -2b/(3a)、x₁x₂ = c/(3a) 解得 k = (6ac - 2b²)/(9a)，D 正确。\n答案 ACD。' }),

    q({ no: 13, qtype: 'fill', topic: '导数与不等式', difficulty: 8, template: 'exp-kx-inequality-min-k', points: 5,
      stem: '(★)设实数 k > 0，对于任意的 x > 1，不等式 k·e^(kx) ≥ ln x 恒成立，则实数 k 的最小值为 ____。',
      answer: ['1/e'], accept: ['1/e', 'e⁻¹', 'e的-1次方', '1/e(即e⁻¹)'],
      solution: '由 k·e^(kx) ≥ ln x，两边同乘 x（x > 1）得 kx·e^(kx) ≥ x·ln x = e^(ln x)·ln x。\n令 f(t) = t·e^t，上式即 f(kx) ≥ f(ln x)。由 f′(t) = (t + 1)e^t 知 f 在 (-1, +∞) 上单调递增，\n又 kx > 0、ln x > 0，所以 kx ≥ ln x，即 k ≥ ln x / x 对一切 x > 1 恒成立。\n令 h(x) = ln x / x（x > 1），h′(x) = (1 - ln x)/x²：当 x ∈ (1, e) 时 h′(x) > 0，h(x) 单调递增；当 x ∈ (e, +∞) 时 h′(x) < 0，h(x) 单调递减。\n故 h(x) 在 x = e 处取得最大值 h(e) = 1/e，所以 k ≥ 1/e，即实数 k 的最小值为 1/e。' }),

    q({ no: 14, qtype: 'fill', topic: '圆锥曲线与圆', difficulty: 8, template: 'circle-ellipse-sum-distance-range', points: 5,
      stem: '已知圆 C: x² + (y + 3)² = 25 与 x 轴交于 A, B 两点，点 P 在圆 x² + (y + 3)² = 36 上，则 |PA| + |PB| 的取值范围为 ____。',
      answer: ['[48/5, 2√97]'], accept: ['[48/5,2√97]', '[48/5, 2√97]', '[9.6,2√97]', '[48/5,2√97]'],
      solution: '令 y = 0 得 x² = 16，故 A(-4, 0)、B(4, 0)；P 在圆 x² + (y + 3)² = 36 上（圆心 (0, -3)，半径 6）。\n记 |PA| + |PB| = 2a，则 P 在以 A、B 为焦点、长半轴为 a 的椭圆 x²/a² + y²/(a² - 16) = 1（a > 4）上。\n最大值：P 取圆的最低点 (0, -9) 时 |PA| = |PB| = √(16 + 81) = √97，和为 2√97。\n最小值：椭圆与圆相切时 a 最小。两方程联立消去 x² 得 16y² - 6(a² - 16)y - (a² - 16)(a² - 27) = 0，\n由判别式 Δ = 4(a² - 16)(25a² - 576) ≥ 0 得 a ≥ 24/5，此时 |PA| + |PB| = 2a ≥ 48/5。\n所以 |PA| + |PB| 的取值范围为 [48/5, 2√97]。' }),

    q({ no: 15, qtype: 'big', topic: '解三角形', difficulty: 7, template: 'triangle-sine-rule-median-min', points: 13,
      stem: '(★)（本题满分 13 分）在 △ABC 中，角 A, B, C 的对边分别为 a, b, c，已知 √3·a·cos C - a·sin C = √3·b。',
      subs: [
        { kind: 'fill', prompt: '（1）求角 A 的大小。', points: 5,
          accept: ['2π/3', '2pi/3', '120°', '120度', 'A=2π/3', 'A=120°'],
          solution: '由正弦定理，条件化为 √3·sin A·cos C - sin A·sin C = √3·sin B。\n由 A + B + C = π 得 sin B = sin(A + C) = sin A·cos C + cos A·sin C，代入得\n- sin A·sin C = √3·cos A·sin C。由 sin C > 0 得 -sin A = √3·cos A，即 tan A = -√3。\n又 A ∈ (0, π)，所以 A = 2π/3。', rubric: [{ pts: 2, text: '由正弦定理将条件化为含 sinA、sinC 的等式' }, { pts: 2, text: '用 sinB = sin(A+C) 代入，得 -sinA = √3·cosA' }, { pts: 1, text: '由 tanA = -√3 且 A ∈ (0, π) 得 A = 2π/3' }] },
        { kind: 'fill', prompt: '（2）若 a = 2，求 BC 边上的中线 AD 长度的最小值。', points: 8,
          accept: ['√3/3', 'sqrt3/3', '(√3)/3', '√3/3'],
          solution: '由余弦定理 a² = b² + c² - 2bc·cos A = b² + c² + bc = 4。\nAD 为 BC 边上的中线，AD = (AB + AC)/2，故 |AD|² = (1/4)(b² + c² + 2bc·cos A) = (1/4)(b² + c² - bc)。\n由 b² + c² = 4 - bc ≥ 2bc 得 bc ≤ 4/3（当且仅当 b = c = 2/√3 时取等号）。\n代入得 |AD|² = (1/4)(4 - 2bc) = 1 - bc/2 ≥ 1 - 2/3 = 1/3，所以 |AD| ≥ √3/3。\n即 AD 长度的最小值为 √3/3。', rubric: [{ pts: 3, text: '由余弦定理得 a² = b² + c² + bc = 4' }, { pts: 3, text: '由中线向量得 |AD|² = (1/4)(b² + c² - bc)' }, { pts: 2, text: '由基本不等式 bc ≤ 4/3 得 |AD|² ≥ 1/3，故 AD ≥ √3/3' }] }],
      solution: '（1）A = 2π/3；（2）AD 长度的最小值为 √3/3。' }),

    q({ no: 17, qtype: 'big', topic: '解析几何与双曲线', difficulty: 9, template: 'hyperbola-tangent-chord-equivalence', points: 15,
      stem: '（本题满分 15 分）已知双曲线 C: x²/a² - y²/b² = 1（a > 0, b > 0）的实轴长为 2，且焦点到渐近线的距离为 √3。',
      subs: [
        { kind: 'fill', prompt: '（1）求双曲线 C 的方程。', points: 5,
          accept: ['x²-y²/3=1', 'x² - y²/3 = 1', 'x²/1-y²/3=1', 'x^2-y^2/3=1'],
          solution: '由实轴长 2a = 2 得 a = 1。双曲线的渐近线为 y = ±(b/a)x，即 bx ± ay = 0，\n焦点 F(c, 0)（c = √(a² + b²)）到渐近线的距离为 bc/√(a² + b²) = bc/c = b = √3。\n所以双曲线 C 的方程为 x² - y²/3 = 1。', rubric: [{ pts: 2, text: '由实轴长 2a = 2 得 a = 1' }, { pts: 2, text: '由焦点到渐近线距离为 b 得 b = √3' }, { pts: 1, text: '写出双曲线方程 x² - y²/3 = 1' }] },
        { kind: 'order', prompt: '（2）若直线 l 过双曲线 C 的焦点，且与双曲线左、右两支分别交于 M, N 两点，证明：直线 l 与圆 O: x² + y² = a² 相切的充要条件是 |MN| = 3。（把证明步骤按正确顺序排列）', points: 10,
          items: [
            { key: 's1', text: '由双曲线的对称性，可设直线 l: y = k(x + 2)（0 < k < √3），与双曲线联立得 (3 - k²)x² - 4k²x - 4k² - 3 = 0，则 x_M + x_N = 4k²/(3 - k²)，x_M·x_N = -(4k² + 3)/(3 - k²)' },
            { key: 's2', text: '由弦长公式得 |MN| = √(1 + k²)·√((x_M + x_N)² - 4x_M·x_N) = 6(1 + k²)/(3 - k²)' },
            { key: 's3', text: '充分性：直线 l 与圆 x² + y² = 1 相切时，圆心 O(0, 0) 到 l 的距离 |2k|/√(1 + k²) = 1，解得 k = √3/3，代入得 |MN| = 3' },
            { key: 's4', text: '必要性：由 |MN| = 3 即 6(1 + k²)/(3 - k²) = 3 解得 k = √3/3，此时 l: x - √3y + 2 = 0，圆心 O 到 l 的距离为 2/√(1 + 3) = 1，所以 l 与圆 O 相切' }],

      solution: '（1）x² - y²/3 = 1；（2）证明见上。' }),

    q({ no: 7, qtype: 'single', topic: '三角恒等变换', difficulty: 8, template: 'zjqz-cos-sum-ratio-beta-max', points: 5,

      solution: '两边乘 sin α：2cos(α + β)sin α = sin β。\n由积化和差 2sinαcos(α + β) = sin(2α + β) - sin β，得 sin(2α + β) - sin β = sin β，即 sin(2α + β) = 2sin β。\n因为 sin(2α + β) ≤ 1，所以 2sin β ≤ 1，sin β ≤ 1/2；又 β 为锐角，故 β ≤ π/6。\n当 β = π/6 时 2sin β = 1，取 2α + β = π/2 即 α = π/6（仍是锐角），等号可取，所以 β 的最大值为 π/6。选 B。' }),

      solution: 'A：甲获胜即"甲投中且乙未中"，由独立性其概率为 a(1 - b) ✓。\nB：a = 2/3、b = 1/2 时一轮甲获胜概率 p = (2/3)×(1/2) = 1/3，X ~ B(6, 1/3)，E(X) = 6 × 1/3 = 2 ✓。\nC：一轮平局概率 = ab + (1-a)(1-b)。令 a = 1/2 + x、b = 1/2 + y（a, b > 1/2 时 x, y > 0），则 ab + (1-a)(1-b) = (1/4 + (x+y)/2 + xy) + (1/4 - (x+y)/2 + xy) = 1/2 + 2xy > 1/2，C 错。\nD：a = b 时一轮甲获胜概率 p = a(1 - a) ≤ 1/4（a = 1/2 取等）。甲至少获胜 2 次的概率 f(p) = C(3,2)p²(1-p) + p³ = 3p² - 2p³，f′(p) = 6p(1-p) ≥ 0，故 f 在 0 < p ≤ 1/4 上递增，最大值 f(1/4) = 3/16 - 2/64 = 5/32 ✓。\n答案 ABD。' }),

    q({ no: 14, qtype: 'fill', topic: '解析几何与抛物线', difficulty: 8, template: 'zjqz-parabola-perp-bisector-area', points: 5,
      stem: '设抛物线 y² = 8x 的焦点为 F，过 F 的直线 l 交抛物线于 A，B 两点，且线段 AB 的垂直平分线交 AB 于点 M，交 x 轴于点 N，若 △FMN 的面积为 16，则直线 l 的方程为 ____。',
      accept: ['x+y-2=0或x-y-2=0', 'x-y-2=0或x+y-2=0', 'x+y-2=0,x-y-2=0', 'x-y-2=0,x+y-2=0',
        'y=-x+2或y=x-2', 'y=x-2或y=-x+2', 'y=-x+2,y=x-2', 'y=x-2,y=-x+2',
        'x+y=2或x-y=2', 'x-y=2或x+y=2', 'x+y=2,x-y=2', 'x-y=2,x+y=2'],
      solution: 'y² = 8x 中 2p = 8，p = 4，焦点 F(2, 0)。设 l: x = ty + 2（斜率不为 0 时成立；x = 2 与抛物线只交于一点，不合题意）。\n代入抛物线得 y² - 8ty - 16 = 0，Δ = 64(t² + 1) > 0，y₁ + y₂ = 8t，y₁y₂ = -16。\n所以中点 M(4t² + 2, 4t)。AB 的垂直平分线 MN 的斜率为 -t，方程为 tx + y - 4t³ - 6t = 0，令 y = 0 得 N(4t² + 6, 0)。\nS△FMN = (1/2)·|FN|·|y_M| = (1/2)·(4t² + 4)·|4t| = 8|t|(t² + 1)。\n由 8|t|(t² + 1) = 16 得 |t|(t² + 1) = 2，而 |t|(t² + 1) 关于 |t| > 0 单调递增，故 |t| = 1，t = ±1。\n所以 l: x = y + 2 或 x = -y + 2，即 x - y - 2 = 0 或 x + y - 2 = 0。' }),

    q({ no: 15, qtype: 'big', topic: '统计与概率', difficulty: 7, template: 'zjqz-histogram-a-median-mean', points: 13,
