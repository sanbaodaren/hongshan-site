<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源共享 · 宏山科学院-铁一分部</title>
  <meta name="description" content="博采众长，学无止境。宏山科学院-铁一分部资源共享板块。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="resources">

  <div id="headerSlot"></div>

  <main id="pageMain">

    <!-- 页首横幅 -->
    <section class="page-hero">
      <div data-contour></div>
      <div class="container">
        <p class="page-tag">SECTION 04 / RESOURCES</p>
        <h1 class="page-title">资源共享</h1>
        <p class="page-sub">博采众长，学无止境</p>
      </div>
      <div class="tianshi tianshi-sm" aria-hidden="true">
        <div class="tianshi-cap"></div>
        <div class="tianshi-pillar"></div>
        <div class="tianshi-base"></div>
      </div>
    </section>

    <section class="page-body">
      <div class="container">

        <!-- ============ 第 1 步：选择学科 ============ -->
        <div id="subjectView">
          <div class="section-head">
            <h2 class="section-title"><span class="idx">//</span>选择学科 <span class="idx" style="color:#4a6a7a">SUBJECTS</span></h2>
            <p class="section-sub">SELECT SUBJECT</p>
          </div>
          <p style="font-size:13px;color:var(--muted-l);letter-spacing:.05em;margin-bottom:24px;">选择学科查看对应资源；角标数字为该学科资源数量</p>
          <div class="subject-grid" id="subjectGrid"></div>
        </div>

        <!-- ============ 第 2 步：文件列表 ============ -->
        <div id="listView" hidden>
          <div class="list-head">
            <button class="btn btn-ghost btn-sm" id="backToSubjects">← 返回学科选择</button>
            <h2 id="listTitle">数学</h2>
            <span class="list-count" id="listCount">0 个资源</span>
          </div>
          <div class="file-list">
            <div class="file-head">
              <span>文件名</span>
              <span style="text-align:right;">类型 · 大小</span>
            </div>
            <div id="fileListBody"></div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="footerSlot"></div>

  <script src="js/main.js"></script>
</body>
</html>
