          answer: [['71.7', '71.7分钟'], ['平均数大于中位数', '平均数比中位数大', '平均数>中位数']],
          solution: '在区间 [50, 70) 内的频率为 0.05 + 0.4 = 0.45 < 0.5，在 [50, 80) 内的频率为 0.45 + 0.3 = 0.75 > 0.5，故中位数落在 [70, 80) 内。\n设中位数为 x，则 0.45 + (x - 70) × 0.03 = 0.5，得 x = 70 + 0.05/0.3 × 10 ≈ 71.7。\n因为 71.7 < 73，所以平均数大于中位数（数据右偏）。', rubric: [{ pts: 3, text: '由 [50,70) 频率 0.45 < 0.5 ≤ 0.75，得中位数在 [70,80)' }, { pts: 2, text: '解 0.45 + (x - 70) × 0.03 = 0.5，得中位数约为 71.7' }, { pts: 2, text: '比较得平均数 73 大于中位数 71.7' }] }],
      solution: '（1）a = 0.005，平均数约为 73 分钟；（2）中位数约为 71.7，平均数大于中位数。' }),

    q({ no: 16, qtype: 'big', topic: '立体几何', difficulty: 8, template: 'zjqz-tetrahedron-ao-perp-plane', points: 15,
      stem: '在三棱锥 A-BCD 中，CB = CD，AB = √2，平面 ABD ⊥ 平面 BCD，点 O 在 BD 上，且 BO = 1，OD = 3，AO = 1，点 P 在 AD 上，且满足 CP ⊥ BD。',
      subs: [
        { kind: 'order', prompt: '（1）求证：AO ⊥ 平面 BCD。（把证明步骤按正确顺序排列）', points: 4,
          items: [
            { key: 's1', text: '在三角形 ABO 中，AB = √2，BO = 1，AO = 1，所以 BO² + AO² = AB²，得 AO ⊥ BO，即 AO ⊥ BD' },
            { key: 's2', text: '因为平面 ABD ⊥ 平面 BCD，且平面 ABD ∩ 平面 BCD = BD' },
            { key: 's3', text: 'AO ⊂ 平面 ABD，由面面垂直的性质定理得 AO ⊥ 平面 BCD' }],
          answer: ['s1', 's2', 's3'],
          solution: '先用勾股定理逆定理得到线线垂直 AO ⊥ BD，再利用"面面垂直 ⇒ 线面垂直"的性质定理：在其中一个平面内垂直于交线的直线垂直于另一个平面。', rubric: [{ pts: 2, text: '由 AB = √2、BO = AO = 1 及勾股定理逆定理得 AO ⊥ BD' }, { pts: 1, text: '写出平面 ABD ⊥ 平面 BCD，交线为 BD' }, { pts: 1, text: '由面面垂直的性质定理得 AO ⊥ 平面 BCD' }] },
        { kind: 'fill', prompt: '（2）求 |AP| / |PD| 的值。', points: 5, accept: ['1/2', '0.5', 'AP/PD=1/2'],
          solution: '取 BD 的中点 E，连接 CE。由 BO = 1、OD = 3 得 BD = 4，故 BE = ED = 2，OE = BE - BO = 1。\n由 CB = CD 得 CE ⊥ BD；又已知 CP ⊥ BD，且 CP ∩ CE = C，所以 BD ⊥ 平面 CPE，从而 BD ⊥ EP。\n在平面 ABD 内，由（1）AO ⊥ BD，EP ⊥ BD，故 AO ∥ PE。\n因为 P 在 AD 上、E 在 OD 上且 AO ∥ PE，所以 △DPE ∽ △DAO，于是 |AP|/|PD| = |OE|/|ED| = 1/2。', rubric: [{ pts: 2, text: '取 BD 中点 E，由 CB = CD 及 CP ⊥ BD 得 BD ⊥ 平面 CPE' }, { pts: 2, text: '由 AO ⊥ BD、EP ⊥ BD 得 AO ∥ PE，从而 △DPE ∽ △DAO' }, { pts: 1, text: '得 |AP|/|PD| = |OE|/|ED| = 1/2' }] },
        { kind: 'fill', prompt: '（3）若二面角 A-BC-D 的大小为 π/3，求四面体 PABC 的体积。', points: 6, accept: ['2√2/9', '2√2/9立方单位', '(2√2)/9'],
          solution: '由（1）AO ⊥ 平面 BCD，AO = 1，且 P 在 AD 上、AP : PD = 1 : 2，故 PABC 与 A-BCD 同高（高为 AO），体积比为底面积之比。\n二面角 A-BC-D 的平面角为 ∠AFO（F 为 O 到 BC 的垂足），∠AFO = π/3，OF = √3/3，由勾股定理得 BF = √6/3；又由 |BF|/|BE| = |OF|/|CE| 得 |CE| = √2。\n所以 S△BCD = (1/2)·BD·CE = (1/2)·4·√2 = 2√2，V(A-BCD) = (1/3)·2√2·1 = 2√2/3。\n再由 AP : PD = 1 : 2 得 V(PABC) = (1/3)V(A-BCD) = 2√2/9。', rubric: [{ pts: 2, text: '由（1）AO ⊥ 平面 BCD，得 PABC 与 A-BCD 同高、体积比等于底面积比' }, { pts: 2, text: '由二面角 π/3、OF = √3/3 算得 CE = √2，S△BCD = 2√2' }, { pts: 1, text: '算得 V(A-BCD) = 2√2/3' }, { pts: 1, text: '由 AP : PD = 1 : 2 得 V(PABC) = 2√2/9' }] }],
      solution: '（1）先证 AO ⊥ BD，再由面面垂直的性质得 AO ⊥ 平面 BCD；（2）|AP|/|PD| = 1/2；（3）V(PABC) = 2√2/9。' }),

    q({ no: 17, qtype: 'big', topic: '数列的通项与求和', difficulty: 9, template: 'zjqz-recurrence-nan-sum-bound', points: 15,
      stem: '对任意的正整数 n，数列 {aₙ} 满足 naₙ = (n + 2)aₙ₊₁ + 2，且 a₃ = 6。',
      subs: [
        { kind: 'fillset', prompt: '（1）求 a₁，a₂。（两个结果用逗号分隔）', points: 4,
          answer: [['41', 'a₁=41', 'a1=41'], ['13', 'a₂=13', 'a2=13']],
          solution: '令 n = 2：2a₂ = 4a₃ + 2 = 4 × 6 + 2 = 26，得 a₂ = 13。\n令 n = 1：a₁ = 3a₂ + 2 = 3 × 13 + 2 = 41。', rubric: [{ pts: 2, text: '令 n = 2，由 2a₂ = 4a₃ + 2 = 26 得 a₂ = 13' }, { pts: 2, text: '令 n = 1，由 a₁ = 3a₂ + 2 = 41 得 a₁ = 41' }] },
        { kind: 'order', prompt: '（2）证明：{n(n + 1)aₙ + n²} 是等差数列。（把证明步骤按正确顺序排列）', points: 6,
          items: [
            { key: 's1', text: '把 naₙ = (n + 2)aₙ₊₁ + 2 两边同乘 n + 1，得 n(n + 1)aₙ = (n + 1)(n + 2)aₙ₊₁ + 2(n + 1)' },
            { key: 's2', text: '记 bₙ = n(n + 1)aₙ，则上式即 bₙ = bₙ₊₁ + 2(n + 1)，也就是 bₙ₊₁ - bₙ = -2(n + 1)' },
            { key: 's3', text: '于是 [bₙ₊₁ + (n + 1)²] - [bₙ + n²] = -2(n + 1) + (2n + 1) = -1，为常数' },
            { key: 's4', text: '所以 {n(n + 1)aₙ + n²} = {84 - n} 是首项为 83、公差为 -1 的等差数列' }],
          answer: ['s1', 's2', 's3', 's4'],
          solution: '核心是把递推式乘 n + 1 凑出 bₙ = n(n + 1)aₙ 的相邻差：bₙ₊₁ - bₙ = -2(n + 1)，再用累加得 bₙ = b₁ - 2(2 + 3 + … + n) = 82 - (n - 1)(n + 2) = -n² - n + 84，于是 n(n + 1)aₙ + n² = 84 - n，公差为 -1。', rubric: [{ pts: 2, text: '两边同乘 n + 1，得 bₙ=bₙ₊₁+2(n+1)，其中 bₙ=n(n+1)aₙ' }, { pts: 1, text: '得 bₙ₊₁ - bₙ = -2(n + 1)' }, { pts: 2, text: '算得 [bₙ₊₁ + (n+1)²] - [bₙ + n²] = -1 为常数' }, { pts: 1, text: '得 {n(n+1)aₙ + n²} = {84 - n} 是公差为 -1 的等差数列' }] },
        { kind: 'fill', prompt: '（3）设数列 {aₙ} 的前 n 项和为 Sₙ，求使 Sₙ ≤ 2n 的最小正整数 n 的值。', points: 5, accept: ['27', 'n=27'],
          solution: '由（2）得 n(n + 1)aₙ = 84 - n² - n = 84 - n(n + 1)，所以 aₙ = 84/[n(n + 1)] - 1 = 84(1/n - 1/(n + 1)) - 1。\n裂项求和：Sₙ = 84(1 - 1/(n + 1)) - n。\n由 Sₙ ≤ 2n 得 84(1 - 1/(n + 1)) ≤ 3n，即 84n/(n + 1) ≤ 3n，约去 n > 0 得 84 ≤ 3(n + 1)，n ≥ 27。\n所以满足条件的最小正整数 n = 27（n = 27 时 S₂₇ = 84 × 27/28 - 27 = 81 - 27 = 54 = 2 × 27，取等）。', rubric: [{ pts: 2, text: '由（2）得 aₙ = 84/[n(n+1)] - 1' }, { pts: 2, text: '裂项求和得 Sₙ = 84(1 - 1/(n+1)) - n' }, { pts: 1, text: '由 Sₙ ≤ 2n 解得 n ≥ 27，即最小正整数 n = 27' }] }],
      solution: '（1）a₁ = 41，a₂ = 13；（2）证明见上（公差为 -1）；（3）n = 27。' }),

    q({ no: 18, qtype: 'big', topic: '导数与不等式', difficulty: 10, template: 'zjqz-sinx-plus-mx-max-zero', points: 17,
      stem: '已知函数 f(x) = sin x + mx（x ≥ 0）。',
      subs: [
        { kind: 'fill', prompt: '（1）若函数 f(x) 的最大值为 0，求 m 的取值范围。', points: 5,
          accept: ['m≤-1', 'm<=-1', 'm∈(-∞,-1]', '(-∞,-1]', 'm不大于-1'],
          solution: '注意到 f(0) = 0。若最大值为 0，则 f(x) ≤ 0 对一切 x ≥ 0 成立，由 f′(x) = cos x + m 得 f′(0) = 1 + m ≤ 0，即 m ≤ -1。\n另一方面，当 m ≤ -1 时 f′(x) = cos x + m ≤ 1 + m ≤ 0，f 在 [0, +∞) 上单调递减，故 f(x) ≤ f(0) = 0 恒成立（此时最大值确为 0）。\n所以 m ∈ (-∞, -1]。', rubric: [{ pts: 2, text: '由 f(0) = 0 且最大值为 0，得 f′(0) = 1 + m ≤ 0' }, { pts: 2, text: '当 m ≤ -1 时 f′(x) = cos x + m ≤ 0，f 单调递减' }, { pts: 1, text: '故 f(x) ≤ f(0) = 0，得 m ∈ (-∞, -1]' }] },
        { kind: 'order', prompt: '（2）证明：当 x ≥ 0 时，有 sin x - sin 3x ≥ -2x。（把证明步骤按正确顺序排列）', points: 5,
          items: [
            { key: 's1', text: '由（1）知 m = -1 时 f(x) = sin x - x 在 [0, +∞) 上单调递减，所以 f(x) ≤ f(0) = 0，即 sin x ≤ x' },
            { key: 's2', text: '对任意 x ≥ 0，由 3x ≥ x 得 f(3x) ≤ f(x)，即 sin 3x - 3x ≤ sin x - x' },
            { key: 's3', text: '移项整理得 sin x - sin 3x ≥ -2x，命题成立' }],
          answer: ['s1', 's2', 's3'],
          solution: '关键是复用（1）的结论：m = -1 时 f(x) = sin x - x 单调递减，于是由 3x ≥ x 直接得 f(3x) ≤ f(x)，即 sin 3x - 3x ≤ sin x - x，整理即得结论。', rubric: [{ pts: 2, text: '由（1）m = -1 时 f(x) 单调递减，得 sin x ≤ x' }, { pts: 2, text: '由 3x ≥ x 得 f(3x) ≤ f(x)' }, { pts: 1, text: '移项得 sin x - sin 3x ≥ -2x' }] },
        { kind: 'fill', prompt: '（3）若对任意 x ≥ 0，都有 |sin x - sin 3x| ≤ ax 成立，求实数 a 的取值范围。', points: 7,
          accept: ['a≥2', 'a>=2', 'a∈[2,+∞)', '[2,+∞)', 'a不小于2'],
          solution: '必要性：由 |sin x - sin 3x| ≤ ax 对一切 x ≥ 0 成立，令 x → 0⁺，得 a ≥ lim |sin x - sin 3x|/x = |1 - 3| = 2。\n（原卷做法：令 h(x) = 2cos 2x·sin x - ax，由 h(0) = 0 且 h(x) ≤ 0 得 h′(0) = 2 - a ≤ 0，即 a ≥ 2。）\n充分性：当 a ≥ 2 时，|sin x - sin 3x| = |2cos 2x·sin x| = 2|cos 2x|·|sin x| ≤ 2|sin x| ≤ 2|x| ≤ ax，其中用了 |cos 2x| ≤ 1 与 |sin x| ≤ |x|（x ≥ 0）。\n所以 a ∈ [2, +∞)。', rubric: [{ pts: 2, text: '必要性：令 x → 0⁺ 得 a ≥ |1 - 3| = 2' }, { pts: 3, text: '充分性：|sin x - sin 3x| ≤ 2|sin x| ≤ 2|x| ≤ ax' }, { pts: 2, text: '综上得 a ∈ [2, +∞)' }] }],
      solution: '（1）m ∈ (-∞, -1]；（2）证明见上；（3）a ∈ [2, +∞)。' }),

    q({ no: 19, qtype: 'big', topic: '空间几何与椭圆', difficulty: 10, template: 'zjqz-cylinder-fence-ellipse', points: 17,
      stem: '某研学基地的篱笆墙是由三条满足 Q₀P₀ ⊥ P₀P₃，Q₃P₃ ⊥ P₀P₃ 的直线段 Q₀P₀，P₀P₃，Q₃P₃ 和一条余弦曲线段 Γ 构成的平面图形，其基准点 P₀ 到标记点 P₁，P₂，P₃ 的距离分别为：P₀P₁ = 2π，P₀P₂ = 4π，P₀P₃ = 8π。曲线段 Γ 上任意一点 Q 的高度 QP 满足函数：z(t) = 3cos(t/4) + 20（0 ≤ t ≤ 8π），其中 t 为 P₀ 到 P 的距离。\n现将篱笆墙卷曲在下底面中心为 O、半径为 4、高为 23 的圆柱侧面上，并使篱笆墙底部线段 P₀P₃ 刚好圈在圆柱底面圆周上。记经过 Q₀，Q₁，Q₂ 三点的平面为 α。',

      solution: '令 u = x + 1 > 1，则 x + y = (u + y) - 1，条件化为 2/u + 8/y = 1。\n柯西不等式：(2/u + 8/y)(u + y) ≥ (√2 + √8)² = (3√2)² = 18。\n由 2/u + 8/y = 1 得 u + y ≥ 18，故 x + y ≥ 17。\n取等条件：2/u + 8/y = 1 且 u + y = 18，解得 u = 6、y = 12（即 x = 5、y = 12），等号能取到。\n所以最小值是 17，选 A。\n（官方答案表：5. A）' }),

    q({ no: 6, qtype: 'single', topic: '直线与圆', difficulty: 7, template: 'circle-tangent-lines-angle', points: 5,
      stem: '过点 (0, -3) 与圆 x² + y² - 4x = 0 相切的两条直线的夹角为 α，则 tan α = （　）',

      solution: '圆化为 (x - 2)² + y² = 4，圆心 C(2, 0)，半径 r = 2。\nP(0, -3)，|PC| = √((0-2)² + (-3-0)²) = √13 > 2，点在圆外。\n设切线与 PC 的夹角为 β，则 sinβ = r/|PC| = 2/√13，tanβ = 2/√(13 - 4) = 2/3。\n两条切线的夹角 α = 2β，所以 tanα = 2tanβ/(1 - tan²β) = (4/3)/(1 - 4/9) = (4/3)/(5/9) = 12/5，选 B。\n（官方答案表：6. B）' }),

    q({ no: 7, qtype: 'single', topic: '三角函数的图象', difficulty: 7, template: 'sine-two-graphs-intersections', points: 5,
      stem: '已知函数 y = sin x 与 y = sin ωx（ω > 0）的图象在 [0, 2π] 上恰有 5 个公共点，且其中一个公共点的坐标为 (π, 0)，则 ω = （　）',

      answer: ['B'],
      solution: '由 (π, 0) 是公共点得 sin(ωπ) = 0，ωπ = kπ（k ∈ N*），即 ω 只能取正整数（排除 A 的 1/2、C 的 13/6）。\nsin x = sin ωx ⇔ 2cos((1+ω)x/2)·sin((1-ω)x/2) = 0。\nω = 2 时：cos(3x/2) = 0 给 x = π/3、π、5π/3；sin(-x/2) = 0 给 x = 0、2π；共 5 个公共点 ✓\nω = 3 时：cos(2x) = 0 给 x = π/4、3π/4、5π/4、7π/4；sin(-x) = 0 给 x = 0、π、2π；共 7 个公共点 ✗\n所以 ω = 2，选 B。\n（官方答案表：7. B）' }),

    q({ no: 8, qtype: 'single', topic: '抽象函数', difficulty: 8, template: 'even-function-ode-inequality', points: 5,
      stem: '已知函数 f(x) 是定义在 R 上的偶函数，f′(x) 是 f(x) 的导函数，f(x) + f′(x) = 2eˣ，若 k[f(x) - eˣ] ≤ x 在 R 上恒成立，则实数 k 的取值范围是（　）',
      options: [{ key: 'A', text: '(-∞, -1/e]' }, { key: 'B', text: '[-1/e, 0)' }, { key: 'C', text: '(-∞, -1]' }, { key: 'D', text: '[-1, 0)' }],
      answer: ['A'],
      solution: 'f 是偶函数 ⇒ f(x) = f(-x) ①，两边求导得 f′(x) = -f′(-x) ②。\n在 f(x) + f′(x) = 2eˣ ③ 中用 -x 换 x：f(-x) + f′(-x) = 2e⁻ˣ ④。\n由 ①②④ 得 f(x) - f′(x) = 2e⁻ˣ ⑤，联立 ③⑤ 解得 f(x) = eˣ + e⁻ˣ。\n于是 f(x) - eˣ = e⁻ˣ > 0，不等式 k[f(x) - eˣ] ≤ x 两边同除 e⁻ˣ（正数，不变号）化为 k ≤ xeˣ。\n令 g(x) = xeˣ，g′(x) = (x + 1)eˣ：x < -1 时 g′ < 0，x > -1 时 g′ > 0，故 g 在 (-∞, -1) 减、在 (-1, +∞) 增。\ng 的最小值 = g(-1) = -1/e，所以 k ≤ -1/e，选 A。\n（官方答案表：8. A；注意本题右端是 x 而不是 x²，卷面已放大核对）' }),

    q({ no: 9, qtype: 'multi', topic: '多项式展开', difficulty: 8, template: 'binomial-5th-term-coefficient-max', points: 6,

    q({ no: 10, qtype: 'multi', topic: '空间几何体', difficulty: 9, template: 'cone-lateral-volume-dihedral', points: 6,
      stem: 'AC 为圆锥 SO 的底面圆 O 的直径，点 B 是圆 O 上异于 A、C 的动点，母线 SC = 2√2，圆锥 SO 的侧面积为 4√2π，则下列结论正确的是（　）',
      options: [
        { key: 'A', text: 'SO = 2' },
        { key: 'B', text: '三棱锥 S-ABC 的体积最大值为 8/3' },
        { key: 'C', text: '若点 B 为弧 AC 的中点，则二面角 S-BC-O 的平面角大小为 45°' },
        { key: 'D', text: '若 AB = BC，E 为线段 AB 上的动点，则 SE + CE 的最小值为 2(√3 + 1)' }],
      answer: ['A', 'B', 'D'],
      solution: '侧面积 = π·OC·SC = π·OC·2√2 = 4√2π ⇒ OC = 2，底面半径 r = 2。\nA：SO = √(SC² - OC²) = √(8 - 4) = 2 ✓\nB：V = (1/3)·S△ABC·SO。AC 为直径 ⇒ AB ⊥ BC，AB² + BC² = AC² = 16。\nS△ABC = (1/2)AB·BC，V = (1/3)·(1/2)AB·BC·2 = (1/3)AB·BC ≤ (1/3)·(AB² + BC²)/2 = 8/3（AB = BC = 2√2 时取等），✓\nC：取 BC 中点 D，则 OD ∥ AB，而 AB ⊥ BC ⇒ OD ⊥ BC；又 SB = SC ⇒ SD ⊥ BC，故 ∠SDO 就是二面角 S-BC-O 的平面角。\n此时 AB = BC = 2√2，OD = AB/2 = √2，而 SO = 2，tan∠SDO = 2/√2 = √2 ≠ 1，所以 ∠SDO ≈ 54.7° ≠ 45° ✗\nD：AB = BC = 2√2 时 △ABC 为等腰直角三角形；SA = SB = √(SO² + OA²) = √(4 + 4) = 2√2 = AB，故 △SAB 为等边三角形。\n把 △SAB 与 △ABC 沿 AB 展平到同一平面，则 SE + CE 的最小值 = 展开后 S 到 C 的距离。过 S 作 SP ⊥ BC 于 P（P 在 CB 延长线上）：∠SBP = 30°，SP = SB·sin30° = √2，BP = SB·cos30° = √6。\nCP = CB + BP = 2√2 + √6，S C = √(SP² + CP²) = √(2 + (2√2 + √6)²) = √(2 + 14 + 8√3) = √(16 + 8√3) = 2√3 + 2 = 2(√3 + 1) ✓\n答案 ABD。\n（官方答案表：10. ABD）' }),

    q({ no: 11, qtype: 'multi', topic: '解三角形', difficulty: 9, template: 'triangle-product-sine-identity', points: 6,
      stem: '记 △ABC 的内角 A、B、C 的对边分别为 a、b、c，外接圆半径为 R，面积为 S，若 sin 2A + sin 2B + sin 2C = 2，S = 4，则（　）',
      options: [
        { key: 'A', text: 'R = 4' },
        { key: 'B', text: 'abc = 32' },
        { key: 'C', text: '当 A = π/2 时，C 有唯一值' },
        { key: 'D', text: '当 A = B 时，C 有且仅有 2 个值' }],
      answer: ['B', 'C', 'D'],
      solution: '恒等式（A + B + C = π）：sin2A + sin2B + sin2C = 4sinA·sinB·sinC。\n故 4sinA·sinB·sinC = 2 ⇒ sinA·sinB·sinC = 1/2。\nA：S = (1/2)ab·sinC = 2R²·sinA·sinB·sinC = 2R²·(1/2) = R² = 4 ⇒ R = 2（R > 0），故 R = 4 ✗\nB：abc = 8R³·sinA·sinB·sinC = 8·8·(1/2) = 32 ✓\nC：A = π/2 ⇒ sinA = 1，B + C = π/2 ⇒ sinB = cosC，于是 sinB·sinC = sinC·cosC = (1/2)sin2C = 1/2 ⇒ sin2C = 1。\nC ∈ (0, π/2) ⇒ 2C ∈ (0, π) ⇒ 2C = π/2 ⇒ C = π/4 唯一 ✓\nD：A = B ⇒ sinA = sinB，A ∈ (0, π/2)，C = π - 2A，sinC = sin2A。\n条件化为 2sin³A·cosA = 1/2，令 t = sin²A ∈ (0, 1)，平方整理得 f(t) = t⁴ - t³ + 1/16 = 0。\nf′(t) = 4t³ - 3t² = t²(4t - 3)：f 在 (0, 3/4) 单调递减、在 (3/4, 1) 单调递增。\nf(0) = f(1) = 1/16 > 0，f(3/4) = -11/256 < 0，故 f 在 (0, 1) 内恰有 2 个零点。\n于是 A 在 (0, π/2) 内恰有 2 个值，C = π - 2A 恰有 2 个值 ✓\n答案 BCD。\n（官方答案表：11. BCD）' }),

    q({ no: 12, qtype: 'fill', topic: '等差数列', difficulty: 7, template: 'arithmetic-sum-max', points: 5,
      stem: '已知等差数列 {aₙ} 的前 n 项和为 Sₙ，若 a₁ = 29，且 S₁₀ = S₂₀，则 Sₙ 的最大值为 ____。',
      answer: ['225'], accept: ['225'],
      solution: '设公差为 d。S₂₀ - S₁₀ = a₁₁ + a₁₂ + … + a₂₀ = 10(a₁₁ + a₂₀)/2 = 5[(29 + 10d) + (29 + 19d)] = 5(58 + 29d) = 0。\n解得 d = -2。\naₙ = 29 - 2(n - 1) = 31 - 2n，当 n ≤ 15 时 aₙ > 0，n ≥ 16 时 aₙ < 0。\n故 Sₙ 在 n = 15 时最大：S₁₅ = 15(a₁ + a₁₅)/2 = 15(29 + 1)/2 = 225。\n（官方答案：12. 225）' }),

    q({ no: 13, qtype: 'fill', topic: '解析几何与双曲线', difficulty: 8, template: 'hyperbola-parabola-45-degree', points: 5,
      stem: '已知双曲线 x² - y²/b² = 1（b > 0）的左、右焦点为 F₁、F₂，以 O 为顶点，F₂ 为焦点作抛物线交双曲线于 P，且 ∠PF₁F₂ = 45°，则 b² = ____。',
      answer: ['2+2√2'], accept: ['2+2√2', '2√2+2', '2+2sqrt2'],
      solution: '双曲线 a = 1，c = √(1 + b²)，|F₁F₂| = 2c。\n以 O(0,0) 为顶点、F₂(c,0) 为焦点的抛物线：准线为 x = -c，故抛物线上点 P(x_P, y_P) 满足 |PF₂| = x_P + c。\n记 p = |PF₂|。∠PF₁F₂ = 45°，在 △PF₁F₂ 中由余弦定理：\n|PF₂|² = |PF₁|² + |F₁F₂|² - 2|PF₁|·|F₁F₂|·cos45°。\n由换用抛物线定义可得 |PF₁| = √2·p（过 P 作准线的垂线，∠PF₁F₂ = 45° 使该垂足与 F₁F₂ 构成等腰直角关系）。\n代入得 p² = 2p² + 4c² - 4pc，即 p² - 4pc + 4c² = 0，故 (p - 2c)² = 0，p = 2c。\n又由双曲线定义 |PF₁| - |PF₂| = 2a = 2，即 (√2 - 1)p = 2，得 p = 2(√2 + 1)，于是 c = p/2 = √2 + 1。\n所以 b² = c² - 1 = (√2 + 1)² - 1 = 3 + 2√2 - 1 = 2 + 2√2。\n（官方答案：13. 2+2√2）' }),

    q({ no: 14, qtype: 'fill', topic: '概率与期望', difficulty: 7, template: 'balls-boxes-max-expectation', points: 5,
      stem: '将 3 个小球随机放入 4 个盒子，记小球最多的盒子里小球数目为 X，则 E(X) = ____。',

    q({ no: 15, qtype: 'big', topic: '统计与概率', difficulty: 7, template: 'chi-square-independence-table', points: 13,
      stem: '为了普及安全教育，某学校随机抽取男生、女生各 100 名学生进行安全知识测试，根据 200 名同学的测试成绩得知，该校有 85% 的同学成绩超过 90 分，具体情况如下表格：\n\n　　性别 │ 得分不超过 90 分的人数 │ 得分超过 90 分的人数\n　　男生 │　　　10　　　　　　　 │　　　λ\n　　女生 │　　　t　　　　　　　　│　　　μ\n\n（1）求 λ、μ、t；\n（2）根据小概率值 α = 0.01 的独立性检验，能否推断该校男生和女生了解安全知识的程度与性别有关？\n附：χ² = n(ad - bc)²/[(a + b)(c + d)(a + c)(b + d)]，\n　　　α：0.050 → x_α = 3.841；0.010 → x_α = 6.635；0.005 → x_α = 7.879。',
      subs: [
        { kind: 'fill', prompt: '（1）求 λ、μ、t 的值（按 λ、μ、t 的顺序，用逗号分隔）。', points: 6,

          solution: '200 人中成绩超过 90 分的占 85%，共 200 × 85% = 170 人。\n所以 λ + μ = 170，且 10 + t = 200 - 170 = 30 ⇒ t = 20。\n男生 100 人，10 + λ = 100 ⇒ λ = 90；女生 100 人，t + μ = 100 ⇒ μ = 80。\n即 λ = 90，μ = 80，t = 20。',
          rubric: [{ pts: 2, text: '由 85% 得成绩超过 90 分的共 200 × 85% = 170 人' },
            { pts: 2, text: '由 10 + t = 200 - 170 = 30 得 t = 20' },
            { pts: 2, text: '由 10+λ=100 得 λ=90，由 t+μ=100 得 μ=80' }] },
        { kind: 'choice', prompt: '（2）根据小概率值 α = 0.01 的独立性检验，能否推断该校男生和女生了解安全知识的程度与性别有关？', points: 7,
          options: [
            { key: 'A', text: '能推断有关（χ² > 6.635）' },

          solution: '零假设 H₀：了解安全知识的程度与性别无关。\n列联表取值 a = 10（男，不超过 90）、b = 90（男，超过 90）、c = 20（女，不超过 90）、d = 80（女，超过 90），n = 200。\nχ² = 200 × (10×80 - 90×20)² / (100 × 100 × 30 × 170) = 200 × (800 - 1800)² / 51000000 = 200 × 1000000 / 51000000 ≈ 3.92。\n因为 3.92 < 6.635，所以没有充分证据推翻零假设，不能推断该校男生和女生了解安全知识的程度与性别有关。',
          rubric: [{ pts: 2, text: '提出零假设 H₀：了解安全知识的程度与性别无关' },
            { pts: 3, text: '写出 a = 10、b = 90、c = 20、d = 80、n = 200' },
            { pts: 2, text: '算得 χ² ≈ 3.92 < 6.635，不能推断有关，选 B' }] }],
      solution: '（1）λ = 90，μ = 80，t = 20；（2）χ² ≈ 3.92 < 6.635，不能推断有关。\n（官方答案 15：λ = 90，μ = 80，t = 20；χ² ≈ 3.92 < 6.635，不能推断该校男生和女生了解安全知识的程度与性别有关）' }),

    q({ no: 16, qtype: 'big', topic: '立体几何', difficulty: 8, template: 'polyhedron-square-midpoint-angle', points: 15,

        { kind: 'fill', prompt: '（2）求直线 PM 与平面 AEF 所成角的正弦值。', points: 8,
          accept: ['4√78/39', '4根号78/39', '4sqrt78/39'],

<script>
/* js/bank.js */
/* 题库汇总：把 js/bank/*.js 分片（MR.bankParts）合并成 MR.bank。
   字段完整性与去重由 tools/verify.mjs 校验；这里只做合并，不做猜测性补字段。 */
(function (root) {
  var MR = root.MR = root.MR || {};

  var questions = [];
  var seen = {};
  var problems = [];

  (MR.bankParts || []).forEach(function (part, pi) {
    if (!Array.isArray(part)) { problems.push('分片 ' + pi + ' 不是数组'); return; }
    part.forEach(function (q) {
      if (!q || !q.id) { problems.push('分片 ' + pi + ' 有空题或缺 id'); return; }
      if (seen[q.id]) { problems.push('题目 id 重复：' + q.id); return; }
      seen[q.id] = true;
      q.no = Number(q.no);
      q.difficulty = Number(q.difficulty);
      questions.push(q);
    });
  });

  var byLayer = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  var byQtype = { single: [], multi: [], fill: [], big: [] };
  questions.forEach(function (q) {
    var layer = q.no <= 8 ? 1 : q.no <= 11 ? 2 : q.no <= 14 ? 3 : q.no <= 17 ? 4 : 5;
    if (byLayer[layer]) byLayer[layer].push(q);
    if (byQtype[q.qtype]) byQtype[q.qtype].push(q);
  });

  questions.sort(function (a, b) {
    return (a.paper < b.paper ? -1 : a.paper > b.paper ? 1 : 0) || a.no - b.no;
  });

  MR.bank = {
    questions: questions,
    byLayer: byLayer,
    byQtype: byQtype,
    problems: problems,
    papers: Object.keys(questions.reduce(function (m, q) { m[q.paper] = 1; return m; }, {})),
    count: questions.length
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/game.js */
/* 数学集成战略 · 引擎（状态机 / 抽题 / 评分 / 结局 / 存档）
   不依赖 DOM；node 校验脚本可直接 eval。 */
(function (root) {
  var MR = root.MR = root.MR || {};
  var B = MR.BALANCE;

  /* ---------- 种子随机 ---------- */
  function hashStr(s) {
    var h = 2166136261 >>> 0;
    s = String(s);
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  MR.rngFor = function (seed, tag) { return mulberry32(hashStr(seed + '|' + tag)); };

  /* ---------- 题库工具 ---------- */
  function bank() { return (MR.bank && MR.bank.questions) ? MR.bank.questions : []; }
  function topicsFor(qtype) {
    var set = {}, out = [];
    bank().forEach(function (q) {
      if (q.qtype === qtype && q.topic && !set[q.topic]) { set[q.topic] = 1; out.push(q.topic); }
    });
    return out.sort();
  }
  /* 考点候选：优先取"同题号"真题的考点（新高考题号 ↔ 考点稳定），题号池空时退化到该题型全部考点 */
  function topicsForSlot(slot) {
    var set = {}, out = [];
    bank().forEach(function (q) {
      if (q.no === slot.no && q.topic && !set[q.topic]) { set[q.topic] = 1; out.push(q.topic); }
    });
    return out.length ? out.sort() : topicsFor(slot.qtype);
  }
  function slotPoints(no) { return MR.SLOTS[no - 1].points; }

  /* ---------- 构建一局 ---------- */
  MR.startRun = function (opts) {
    var mode = MR.MODES.filter(function (m) { return m.id === opts.mode; })[0] || MR.MODES[0];
    var ax = Math.max(0, Math.min(10, opts.ax | 0));
    var seed = (opts.seed == null || String(opts.seed).trim() === '') ? randomSeed() : String(opts.seed).trim();

    var run = {
      version: MR.VERSION, mode: mode.id, modeCfg: mode, ax: ax, seed: seed,
      cursor: 0,                 // 0..18 → MR.SLOTS 下标
      phase: mode.station ? 'station' : 'map',
      node: null, question: null,
      // 实战模式：进题时不判分，先把答案记在 answers 里（可以回头改），交卷时统一判分。
      answers: {},               // 题号 → 玩家作答（未判分）
      sides: {},                 // 题号 → 选的上/下路
      drawn: {},                 // 题号 → 该题位抽到的题（回头改答案时复用同一题，不重新抽）
      selfGrades: {},            // 题号 → 大题自评勾选（[[勾中的给分点序号…], …] 每个小问一组）
      revisit: false,            // 本次进题是"回头改答案"而不是第一次作答
      usedIds: {}, recentTemplates: [],
      log: [], failed: false, finished: false,
      rigor: mode.rigor ? B.rigorStart : 0,
      mastery: 0,
      startTime: Date.now(), endTime: null,
      stationsSeen: [],
      stats: {
        ax: ax, answered: 0, correct: 0, earned: 0, maxPoints: 150,
        byQtype: { single: { correct: 0, total: 0 }, multi: { correct: 0, total: 0 }, fill: { correct: 0, total: 0 }, big: { correct: 0, total: 0 } },
        byTopic: {}, urgentCount: 0, normalCount: 0, upCount: 0, downCount: 0,
        q18: { correct: 0, total: 0 }, q19: { correct: 0, total: 0 },
        first14Wrong: 0, last5AllCorrect: true, failed: false, mastery: 0, rigor: B.rigorStart
      },
      nodes: {}
    };

    // 预生成 19 个题位的上/下两个节点（可复现）
    MR.SLOTS.forEach(function (slot) {
      var r = MR.rngFor(seed, 'urgent|' + slot.no);
      var urgentSide = r() < 0.5 ? 'U' : 'D';
      var topics = topicsForSlot(slot);
      var tr = MR.rngFor(seed, 'topic|' + slot.no);
      var topic = topics.length ? topics[Math.floor(tr() * topics.length) % topics.length] : '未分类';
      var pair = {};
      ['U', 'D'].forEach(function (side) {
        var urgent = (side === urgentSide);
        pair[side] = {
          id: 'L' + slot.layer + 'S' + slot.step + side,
          no: slot.no, layer: slot.layer, step: slot.step, side: side,
          qtype: slot.qtype, layerName: slot.layerName, points: slot.points,
          urgent: urgent, difficulty: Math.min(10, ax + (urgent ? 1 : 0)), topic: topic,
          next: slot.no < 19 ? { U: 'L' + MR.SLOTS[slot.no].layer + 'S' + MR.SLOTS[slot.no].step + 'U',
                                 D: 'L' + MR.SLOTS[slot.no].layer + 'S' + MR.SLOTS[slot.no].step + 'D' } : null
        };
      });
      run.nodes[slot.no] = pair;
    });
    return run;
  };

  function randomSeed() { return 'R' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase(); }

  MR.currentSlot = function (run) { return MR.SLOTS[run.cursor] || null; };
  MR.currentNodes = function (run) {
    var slot = MR.currentSlot(run);
    return slot ? run.nodes[slot.no] : null;
  };

  /* ---------- 抽题：种子 + 节点 ID 决定 ---------- */
  MR.drawQuestion = function (run, node) {
    // 题型与分值都是题位骨架的一部分（第 15 题 13 分、第 18 题 17 分…），必须硬匹配：
    // 否则 13 分的题位可能抽到 15 分的题，整局总分就会超过 150。
    // 匹配不到时只放宽到"同题型"（题库缺该分值时兜底），难度靠下面的就近打分回退。
    var pool = bank().filter(function (q) { return q.qtype === node.qtype && q.points === node.points; });
    if (!pool.length) pool = bank().filter(function (q) { return q.qtype === node.qtype; });
    if (!pool.length) return null;

    var fresh = pool.filter(function (q) { return !run.usedIds[q.id]; });
    var list = fresh.length ? fresh : pool;                    // 同一局不重复原题，题库耗尽时兜底

    var window20 = run.recentTemplates.slice(-B.recentTemplateWindow);
    var noTpl = list.filter(function (q) { return window20.indexOf(q.template) < 0; });
    if (noTpl.length) list = noTpl;                            // 最近 20 题不重复套路

    var scored = list.map(function (q) {
      var s = 0;
      s += (q.topic === node.topic ? 0 : 1000);                // 考点优先
      s += Math.abs((q.difficulty == null ? 7 : q.difficulty) - node.difficulty) * 20; // 难度就近
      s += Math.abs((q.points == null ? node.points : q.points) - node.points) * 3;    // 分值就近
      return { q: q, s: s };
    });
    var best = Math.min.apply(null, scored.map(function (x) { return x.s; }));
    var tied = scored.filter(function (x) { return x.s === best; }).map(function (x) { return x.q; });
    tied.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });

    var rng = MR.rngFor(run.seed, 'draw|' + node.id);
    var q = tied[Math.floor(rng() * tied.length) % tied.length];

    var pick = Object.assign({}, q);
    pick.nodeId = node.id;
    pick.slotPoints = node.points;
    pick.difficultyFallback = Math.abs((q.difficulty == null ? 7 : q.difficulty) - node.difficulty) >= 2;

    run.usedIds[q.id] = 1;
    run.recentTemplates.push(q.template);
    run.question = pick;
    return pick;
  };

  /* ---------- 选择上路 / 下路 ---------- */
  MR.pickSide = function (run, side) {
    var nodes = MR.currentNodes(run);
    if (!nodes) return null;
    var node = nodes[side];
    run.node = node;
    run.revisit = false;
    if (side === 'U') run.stats.upCount++; else run.stats.downCount++;
    if (node.urgent) run.stats.urgentCount++; else run.stats.normalCount++;
    run.question = MR.drawQuestion(run, node);
    run.sides[node.no] = side;
    run.drawn[node.no] = run.question;
    run.phase = 'question';
    return node;
  };

  /* ---------- 实战模式：回头改答案（复用当初抽到的那道题） ---------- */
  MR.revisitSlot = function (run, no, side) {
    var pair = run.nodes[no];
    if (!pair) return null;
    side = side || run.sides[no] || 'U';
    var node = pair[side];
    run.node = node;
    run.revisit = true;
    run.question = run.drawn[no] || MR.drawQuestion(run, node);
    run.drawn[no] = run.question;
    run.phase = 'question';
    return node;
  };

  /* ---------- 实战模式：提交时只记答案，不判分、不透露对错、不前进 ---------- */
  MR.recordAnswer = function (run, user) {
    var node = run.node;
    if (!node) return null;
    run.answers[node.no] = user;
    run.sides[node.no] = node.side;
    return { no: node.no, recorded: true };
  };

  /* ---------- 实战模式：大题自评（交卷后在"阅卷"里逐题勾给分标准） ---------- */
  MR.recordSelf = function (run, no, picks) {
    no = (no != null) ? no : (run.node && run.node.no);
    run.selfGrades[no] = picks || [];
    run.answers[no] = picks || [];       // 交卷时按已作答处理
    return { no: no, picks: run.selfGrades[no] };
  };

  /* 还没自评的大题题号（交卷后按这个顺序阅卷） */
  MR.pendingSelf = function (run) {
    var out = [];
    MR.SLOTS.forEach(function (slot) {
      if (slot.qtype !== 'big') return;
      var q = run.drawn[slot.no];
      if (!q || q.qtype !== 'big') return;
      if (!(slot.no in run.selfGrades)) out.push(slot.no);
    });
    return out;
  };

  /* ---------- 实战模式：交卷——按题号顺序把这一局所有答案一次判完 ---------- */
  MR.finalize = function (run) {
    MR.SLOTS.forEach(function (slot) {
      var node = run.nodes[slot.no][run.sides[slot.no] || 'U'];
      var q = run.drawn[slot.no];
      if (!q) { q = MR.drawQuestion(run, node); run.drawn[slot.no] = q; }
      var big = q.qtype === 'big';
      // 大题只认"阅卷时自评勾选"；没自评就按 0 分计入（不拿交卷时那句占位标记当作答）
      var user = big
        ? (run.selfGrades[slot.no] || [])
        : ((slot.no in run.answers) ? run.answers[slot.no] : null);
      var skipped = big ? !(slot.no in run.selfGrades) : user === null;
      var g = MR.grade(q, user, node.points);
      applyGraded(run, node, q, user, g, skipped);
    });
    run.revisit = false;
    return MR.finish(run, false);
  };

  /* ---------- 答案归一化（填空） ---------- */
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/\s+/g, '')
      .replace(/[，、]/g, ',')
      .replace(/[（]/g, '(').replace(/[）]/g, ')')
      .replace(/[－−–—]/g, '-')
      .replace(/[×✕]/g, '*')
      .replace(/[÷]/g, '/')
      .replace(/[．。]/g, '.')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/。$/, '')
      .replace(/\.$/, '')
      .toLowerCase();
  }
  MR.normalizeAnswer = normalize;

  function matchFill(sub, userText) {
    var acc = sub.accept || (sub.answer != null ? [].concat(sub.answer) : []);
    var u = normalize(userText);
    if (u === '') return false;
    return acc.some(function (a) { return normalize(a) === u; });
  }

  /* 把「多个答案」的一行输入切成若干 token：括号内的逗号不算分隔符 */
  MR.splitTokens = function (text) {
    var s = String(text == null ? '' : text), out = [], buf = '', depth = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c === '(' || c === '（') depth++;
      if (c === ')' || c === '）') depth = Math.max(0, depth - 1);
      if (depth === 0 && (c === ',' || c === '，' || c === ';' || c === '；' || c === '、' || c === '\n')) {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      } else buf += c;
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  };

  /* 多值填空：答案是一组（顺序无关），answer = [[可接受写法...], [可接受写法...], ...] */
  function matchFillSet(sub, userText) {
    var groups = (sub.answer || []).map(function (g) { return [].concat(g); });
    var toks = MR.splitTokens(userText).map(normalize).filter(function (t) { return t !== ''; });
    if (toks.length !== groups.length || !groups.length) return false;
    var used = groups.map(function () { return false; });
    function tryMatch(i) {
      if (i === toks.length) return true;
      for (var g = 0; g < groups.length; g++) {
        if (used[g]) continue;
        if (groups[g].some(function (a) { return normalize(a) === toks[i]; })) {
          used[g] = true;
          if (tryMatch(i + 1)) return true;
          used[g] = false;
        }
      }
      return false;
    }
    return tryMatch(0);
  }

  /* 小问正确答案的展示文本 */
  MR.subAnswerText = function (sub) {
    if (!sub) return '—';
    if (sub.kind === 'choice') return String(sub.answer);
    if (sub.kind === 'order') return (sub.answer || []).join(' → ');
    if (sub.kind === 'fillset') return (sub.answer || []).map(function (g) { return [].concat(g)[0]; }).join('　,　');
    return (sub.accept || [sub.answer]).join(' / ');
  };

  /* ---------- 大题：给分标准（草稿纸 + 自评） ----------
     大题不做自动判题（真实高考的大题是学生在纸上写过程、老师按步给分）。
     界面把题干给小问，学生在纸上写；然后展开"标准答案 + 解析 + 给分标准"，
     学生对照自己写的，逐条勾出"这一步我确实做到了"，得分即勾中的分值之和。
     sub.rubric 形如 [{ pts: 2, text: '写出 a₁ = 1' }, …]，各条分值之和应等于该小问分值；
     题库还没写给分标准时，退化成一条"这一步做到了"（满分/零分两档）。 */
  MR.rubricOf = function (sub) {
    var r = (sub && sub.rubric || []).filter(function (x) { return x && typeof x.pts === 'number'; });
    if (r.length) return r;
    return [{ pts: (sub && sub.points) || 0, text: '这一步我做到了（' + MR.subAnswerText(sub) + '）' }];
  };

  /* 大题自评判分：picks[i] = 第 i 个小问勾中的给分点下标数组 */
  MR.gradeSelf = function (q, picks, slotPoints) {
    var subs = q.subs || [];
    var totalPts = subs.reduce(function (a, s) { return a + (s.points || 0); }, 0) || (slotPoints || 0);
    var earned = 0, detail = [], allOk = subs.length > 0;
    subs.forEach(function (s, i) {
      var rubric = MR.rubricOf(s);
      var picked = (picks && picks[i]) || [];
      var got = 0;
      picked.forEach(function (k) { if (rubric[k]) got += rubric[k].pts; });
      if (got > (s.points || 0)) got = s.points || 0;      // 兜底：不超过该小问分值
      earned += got;
      var ok = got === (s.points || 0);
      if (!ok) allOk = false;
      detail.push({
        index: i, correct: ok, points: s.points || 0, got: got, picks: picked.slice(),
        your: got + ' 分（自评）', answer: MR.subAnswerText(s), rubric: rubric
      });
    });
    var ratio = totalPts ? earned / totalPts : 0;
    return { ratio: ratio, earned: earned, correct: allOk, subDetail: detail, self: true };
  };

  /* 判定单个小问 */
  MR.gradeSub = function (sub, u) {
    if (sub.kind === 'choice') return String(u || '') === String(sub.answer || '');
    if (sub.kind === 'order') return (u || []).join(',') !== '' && (u || []).join(',') === (sub.answer || []).join(',');
    if (sub.kind === 'fillset') return matchFillSet(sub, u);
    return matchFill(sub, u);
  };

  /* ---------- 评分 ---------- */
  MR.grade = function (q, user, slotPoints) {
    var max = slotPoints != null ? slotPoints : (q.slotPoints || q.points || 0);
    if (q.qtype === 'single') {
      var ok = String(user || '') === String((q.answer || [])[0] || '');
      return { ratio: ok ? 1 : 0, earned: ok ? max : 0, correct: ok };
    }
    if (q.qtype === 'multi') {
      var ans = (q.answer || []).slice().sort().join('');
      var picked = (user || []).slice().sort().join('');
      var rightSet = {}; (q.answer || []).forEach(function (k) { rightSet[k] = 1; });
      var wrongPick = (user || []).some(function (k) { return !rightSet[k]; });
      var ratio;
      if (wrongPick || !(user || []).length) ratio = 0;
      else if (picked === ans) ratio = 1;
      else ratio = 0.5;                       // 部分选对且无错选 → 一半分
      return { ratio: ratio, earned: max * ratio, correct: ratio === 1 };
    }
    if (q.qtype === 'fill') {
      var okf = matchFill(q, user);
      return { ratio: okf ? 1 : 0, earned: okf ? max : 0, correct: okf };
    }
    // 大题：学生在纸上写，交卷/提交后对照给分标准自评（picks 见 MR.gradeSelf）
    return MR.gradeSelf(q, user, max);
  };

  /* 整题正确答案的展示文本（错题报告 / 反馈用） */
  function answerTextOf(q) {
    if (q.qtype === 'big') {
      return (q.subs || []).map(function (s, i) { return '(' + (i + 1) + ') ' + MR.subAnswerText(s); }).join('　');
    }
    if (q.accept && q.accept.length) return q.accept.join(' / ');
    return (q.answer || []).join('');
  }

  /* ---------- 判分结果入库：record + 统计（练习模式即时调；实战模式交卷时按题号批量调） ---------- */
  function applyGraded(run, node, q, user, g, skipped) {
    var max = node.points;
    var s = run.stats;
    var rec = {
      no: node.no, nodeId: node.id, layer: node.layer, step: node.step, side: node.side,
      qtype: node.qtype, topic: node.topic, urgent: node.urgent, difficulty: node.difficulty,
      questionId: q.id, paper: q.paper, paperNo: q.no, stem: q.stem, solution: q.solution,
      yourAnswer: user, answer: q.answer, answerText: answerTextOf(q),
      accept: q.accept, subDetail: g.subDetail, ratio: g.ratio,
      earned: g.earned, max: max, correct: g.correct, skipped: !!skipped
    };
    run.log.push(rec);

    s.answered++; s.earned += g.earned;
    if (g.correct) s.correct++;
    s.byQtype[node.qtype].total++; if (g.correct) s.byQtype[node.qtype].correct++;
    if (!s.byTopic[node.topic]) s.byTopic[node.topic] = { correct: 0, total: 0 };
    s.byTopic[node.topic].total++; if (g.correct) s.byTopic[node.topic].correct++;
    if (node.no === 18) { s.q18.total++; if (g.correct) s.q18.correct++; }
    if (node.no === 19) { s.q19.total++; if (g.correct) s.q19.correct++; }
    if (node.no <= 14 && !g.correct) s.first14Wrong++;
    if (node.no >= 15 && !g.correct) s.last5AllCorrect = false;

    if (run.modeCfg.mastery) {
      run.mastery += g.ratio * (node.urgent ? B.masteryUrgent : B.masteryNormal);
      s.mastery = round2(run.mastery);
    }
    if (run.modeCfg.rigor && g.ratio === 0) {
      run.rigor -= (node.urgent ? B.rigorPenaltyUrgent : B.rigorPenaltyNormal);
      if (run.rigor < 0) run.rigor = 0;
      s.rigor = run.rigor;
      if (run.rigor === 0) { run.failed = true; s.failed = true; }
    }
    s.earned = round2(s.earned);
    return rec;
  }

  /* ---------- 练习模式：即时判分（会立刻显示对错、扣严谨度） ---------- */
  MR.submit = function (run, user) {
    var q = run.question, node = run.node;
    if (!q || !node) return null;
    var g = MR.grade(q, user, node.points);
    applyGraded(run, node, q, user, g, false);
    run.phase = 'feedback';
    return { record: run.log[run.log.length - 1], graded: g, failed: run.failed };
  };

  /* ---------- 进入下一步（层次/知识站/结算） ---------- */
  MR.next = function (run) {
    if (run.failed) { return MR.finish(run, true); }
    var prevLayer = MR.SLOTS[run.cursor].layer;
    run.cursor++;
    if (run.cursor >= MR.SLOTS.length) { return MR.finish(run, false); }
    var nextLayer = MR.SLOTS[run.cursor].layer;
    run.node = null; run.question = null;
    if (nextLayer !== prevLayer && run.modeCfg.station) {
      run.phase = 'station';
      run.stationLayer = nextLayer;
    } else run.phase = 'map';
    return { phase: run.phase, layerChanged: nextLayer !== prevLayer, layer: nextLayer };
  };

  MR.leaveStation = function (run, stationId) {
    run.stationsSeen.push(stationId || (run.stationLayer + ''));
    run.phase = 'map';   // 知识补充站不记录任何统计
    return run.phase;
  };

  MR.finish = function (run, failed) {
    run.finished = true; run.failed = !!failed;
    run.endTime = Date.now();
    run.stats.failed = !!failed;
    run.stats.totalTimeMs = run.endTime - run.startTime;
    run.phase = 'settle';
    return { phase: 'settle' };
  };

  /* ---------- 报告 ---------- */
  function round2(x) { return Math.round(x * 100) / 100; }

  MR.buildReport = function (run) {
    var s = run.stats;
    var answered = s.answered || 1;
    var report = {
      mode: run.mode, modeName: run.modeCfg.name, ax: run.ax, seed: run.seed,
      total: round2(s.earned), max: 150, answered: s.answered,
      accuracy: round2(s.correct / answered),
      mastery: round2(run.mastery), rigor: run.rigor, failed: run.failed,
      byQtype: s.byQtype, byTopic: s.byTopic,
      urgentCount: s.urgentCount, normalCount: s.normalCount,
      upCount: s.upCount, downCount: s.downCount,
      q18: s.q18, q19: s.q19,
      timeText: fmtTime(run.endTime && run.startTime ? s.totalTimeMs : Date.now() - run.startTime),
      wrongs: run.log.filter(function (r) { return r.ratio < 1; }),
      all: run.log
    };
    return report;
  };

  MR.settle = function (run) {
    var report = MR.buildReport(run);
    var ending = run.modeCfg.scoring === 'evaluation' ? MR.pickEnding(run.stats) : null;
    var grade = run.modeCfg.scoring === 'evaluation' ? MR.practiceGrade(run.stats) : null;
    var comment = run.modeCfg.scoring === 'score150' ? MR.examComment(report.total) : null;
    return { report: report, ending: ending, grade: grade, comment: comment };
  };

  function fmtTime(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    return (m > 0 ? m + ' 分 ' : '') + (s % 60) + ' 秒';
  }
  MR.fmtTime = fmtTime;
  MR.round2 = round2;

  /* ---------- 持久化 ---------- */
  var KEY = 'mr.save.v1';
  MR.emptySave = function () {
    return { runs: 0, examBest: 0, examHistory: [], endings: {}, history: [], wrongBook: {}, topicStats: {} };
  };
  MR.loadSave = function () {
    try {
      var raw = root.localStorage && root.localStorage.getItem(KEY);
      if (!raw) return MR.emptySave();
      var o = JSON.parse(raw);
      var d = MR.emptySave();
      for (var k in d) if (!(k in o)) o[k] = d[k];
      return o;
    } catch (e) { return MR.emptySave(); }
  };
  MR.writeSave = function (save) {
    try { root.localStorage && root.localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
  };
  MR.clearSave = function () {
    try { root.localStorage && root.localStorage.removeItem(KEY); } catch (e) {}
  };
  MR.commitRun = function (run, settled) {
    var save = MR.loadSave();
    save.runs++;
    var rep = settled.report;
    var entry = {
      date: new Date().toISOString().slice(0, 16).replace('T', ' '),
      mode: run.modeCfg.name, ax: 'a' + run.ax, seed: run.seed,
      total: run.modeCfg.scoring === 'score150' ? rep.total : null,
      mastery: rep.mastery, accuracy: Math.round(rep.accuracy * 100) + '%',
      ending: settled.ending ? settled.ending.id : '—'
    };
    save.history.unshift(entry);
    if (save.history.length > 200) save.history.length = 200;
    if (run.modeCfg.scoring === 'score150') {
      save.examHistory.unshift({ date: entry.date, total: rep.total, ax: 'a' + run.ax, seed: run.seed });
      if (save.examHistory.length > 100) save.examHistory.length = 100;
      if (rep.total > save.examBest) save.examBest = rep.total;
    }
    if (settled.ending) save.endings[settled.ending.id] = (save.endings[settled.ending.id] || 0) + 1;
    rep.wrongs.forEach(function (w) {
      var e = save.wrongBook[w.questionId] || { paper: w.paper, no: w.paperNo, topic: w.topic, qtype: w.qtype, count: 0 };
      e.count++; e.lastWhy = '第 ' + w.no + ' 题';
      save.wrongBook[w.questionId] = e;
    });
    Object.keys(rep.byTopic).forEach(function (t) {
      var e = save.topicStats[t] || { correct: 0, total: 0 };
      e.correct += rep.byTopic[t].correct; e.total += rep.byTopic[t].total;
      save.topicStats[t] = e;
    });
    MR.writeSave(save);
    return save;
  };

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui.js */
/* 数学集成战略 · 界面层 */
(function () {
  var MR = window.MR;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); }
  /* 把玩家答案渲染成人话：数组逐项列出，空答案显示（空） */
  function fmtYour(y) {
    if (y == null || y === '') return '（空）';
    if (Array.isArray(y)) {
      var t = y.map(function (x) { return Array.isArray(x) ? x.join('→') : String(x == null ? '' : x); }).filter(function (x) { return x !== ''; });
      return t.length ? t.join('　') : '（空）';
    }
    return String(y);
  }

  var app = { run: null, settled: null, sel: { mode: 'exam', ax: 7 }, save: null, mastered: {} };

  function show(name) {
    ['title', 'station', 'map', 'question', 'settle'].forEach(function (n) {
      $('screen-' + n).classList.toggle('active', n === name);
    });
    window.scrollTo(0, 0);
  }

  /* ================= 标题页 ================= */
  function renderTitle() {
    app.save = MR.loadSave();
    $('mode-list').innerHTML = MR.MODES.map(function (m) {
      return '<div class="opt' + (app.sel.mode === m.id ? ' sel' : '') + '" data-mode="' + m.id + '">' +
        '<b>' + esc(m.name) + '</b><span class="tag">' + esc(m.tag) + '</span>' +
        '<p>' + esc(m.desc) + '</p></div>';
    }).join('');
    $('diff-list').innerHTML = MR.DIFFICULTIES.map(function (d) {
      return '<div class="d' + (app.sel.ax === d.ax ? ' sel' : '') + '" data-ax="' + d.ax + '"><b>' + esc(d.label) + '</b><span>' + esc(d.short) + '</span></div>';
    }).join('');
    var cur = MR.DIFFICULTIES[app.sel.ax];
    $('diff-desc').textContent = cur.desc + ' 普通作战出 a' + app.sel.ax + '，紧急作战出 a' + Math.min(10, app.sel.ax + 1) + '。';

    $('mode-list').onclick = function (e) {
      var t = e.target.closest('[data-mode]'); if (!t) return;
      app.sel.mode = t.dataset.mode; renderTitle();
    };
    $('diff-list').onclick = function (e) {
      var t = e.target.closest('[data-ax]'); if (!t) return;
      app.sel.ax = parseInt(t.dataset.ax, 10); renderTitle();
    };

    var bankN = (MR.bank && MR.bank.questions || []).length;
    $('meta-body').innerHTML =
      '<p>题库：' + bankN + ' 道真题' + (bankN ? '' : '<b style="color:var(--bad)">（题库为空，请先完成题目采集）</b>') + '</p>' +
      '<p>总局数：' + app.save.runs + '　实战最高分：' + app.save.examBest + '</p>' +
      '<p>已解锁结局：' + Object.keys(app.save.endings).length + ' / ' + MR.ENDINGS.length + '</p>' +
      '<p>结局：' + MR.ENDINGS.map(function (e) {
        var got = app.save.endings[e.id];
        return (e.hidden && !got) ? '？？？' : (esc(e.name) + (got ? '×' + got : ''));
      }).join('、') + '</p>' +
      (Object.keys(app.save.wrongBook).length ? '<h4>错题本（累计 ' + Object.keys(app.save.wrongBook).length + ' 题）</h4><table><tr><th>卷</th><th>题号</th><th>考点</th><th>错次</th></tr>' +
        Object.keys(app.save.wrongBook).map(function (k) { var w = app.save.wrongBook[k];
          return '<tr><td>' + esc(w.paper) + '</td><td>' + w.no + '</td><td>' + esc(w.topic) + '</td><td>' + w.count + '</td></tr>'; }).join('') + '</table>' : '') +
      (app.save.history.length ? '<h4>历史成绩</h4><table><tr><th>时间</th><th>模式</th><th>难度</th><th>分数/掌握</th><th>正确率</th><th>结局</th></tr>' +
        app.save.history.slice(0, 12).map(function (h) {
          return '<tr><td>' + esc(h.date) + '</td><td>' + esc(h.mode) + '</td><td>' + esc(h.ax) + '</td><td>' + (h.total != null ? h.total : h.mastery) + '</td><td>' + esc(h.accuracy) + '</td><td>' + esc(h.ending) + '</td></tr>'; }).join('') + '</table>' : '');

    $('btn-start').onclick = start;
    $('btn-clear-save').onclick = function () {
      if (confirm('确定清空本地存档（错题本 / 统计 / 已解锁结局 / 历史分数）？')) { MR.clearSave(); renderTitle(); }
    };
    show('title');
  }

  function start() {
    var bankN = (MR.bank && MR.bank.questions || []).length;
    if (!bankN) { alert('题库为空，无法开始。请先完成题目采集。'); return; }
    app.run = MR.startRun({ mode: app.sel.mode, ax: app.sel.ax, seed: $('seed-input').value });
    app.settled = null; app.mastered = {}; app.viewLayer = null; app.lastLayer = null;
    step(app.run);
  }

  function step(run) {
    if (run.phase === 'station') return showStation(run);
    if (run.phase === 'settle') return showSettle(run);
    if (run.phase === 'review') return showReview(run);
    if (run.phase === 'question') return showQuestion(run);
    return showMap(run);
  }

  /* ================= 知识补充站 ================= */
  /* 例题块（知识补充站用） */
  function exBlock(q) {
    return '<div class="ex"><b>' + esc(q.paper) + ' 第 ' + q.no + ' 题（' + esc(MR.QTYPE_NAME[q.qtype]) + ' · ' + esc(q.topic) + '）</b>\n' + esc(q.stem) +
      (q.options ? '\n' + q.options.map(function (o) { return o.key + '. ' + o.text; }).join('\n') : '') + '\n\n解析：' + esc(q.solution || '—') + '</div>';
  }

  /* 知识补充站推荐逻辑：优先本局错题涉及的知识点，其次本层题位对应的考点 */
  function stationRecs(run, layer) {
    var wrong = {}, order = [], used = {};
    (run.log || []).forEach(function (r) {
      used[r.questionId] = 1;
      if (r.ratio >= 1) return;
      if (!wrong[r.topic]) { wrong[r.topic] = 0; order.push(r.topic); }
      wrong[r.topic]++;
    });
    order.sort(function (a, b) { return wrong[b] - wrong[a]; });
    var layerNo = MR.SLOTS.filter(function (s) { return s.layer === layer; }).map(function (s) { return s.no; });
    var src = (MR.bank && MR.bank.questions) || [];
    var layerTopics = [], seen = {};
    src.forEach(function (q) {
      if (layerNo.indexOf(q.no) < 0 || seen[q.topic]) return;
      seen[q.topic] = 1; layerTopics.push(q.topic);
    });
    var examples = [];
    order.concat(layerTopics).forEach(function (t) {
      if (examples.length >= 2 || seen['#' + t]) return;
      var pool = src.filter(function (x) { return x.topic === t; });
      var q = pool.filter(function (x) { return !used[x.id]; })[0] || pool[0];
      if (q) { seen['#' + t] = 1; examples.push(q); }
    });
    return { wrongTopics: order, wrongCounts: wrong, layerNo: layerNo, layerTopics: layerTopics, examples: examples };
  }

  function showStation(run) {
    var layer = run.stationLayer || MR.currentSlot(run).layer;
    var st = MR.STATIONS.filter(function (s) { return s.layer === layer; })[0];
    $('station-title').textContent = st ? st.title : ('知识补充站 · 第 ' + layer + ' 层');
    var rec = stationRecs(run, layer);
    var body = '<div class="note"><h3>★ 本轮到你的推荐</h3>' +
      (rec.wrongTopics.length
        ? '<p>优先复习你这局错过的知识点：' + rec.wrongTopics.slice(0, 4).map(function (t) {
            return esc(t) + '（错 ' + rec.wrongCounts[t] + ' 题）'; }).join('、') + '。</p>'
        : '<p>本局还没有错题。本层对应第 ' + rec.layerNo.join('、') + ' 题，先看这一层常考的考点。</p>') +
      (rec.layerTopics.length ? '<p>本层考点：' + rec.layerTopics.slice(0, 8).map(esc).join('、') + '。</p>' : '') +
      (rec.examples.length ? '<p>推荐先看：</p>' + rec.examples.map(exBlock).join('') : '') +
      '<span class="hint">推荐只按你本局的错题知识点（其次本层考点）给出，不记录、不统计、不影响分数与结局。</span></div>';
    if (st) {
      st.notes.forEach(function (n, i) {
        body += '<div class="note"><h3>' + esc(n.h) + '</h3>' + (n.p ? '<p>' + esc(n.p) + '</p>' : '') +
          (n.list ? '<ul>' + n.list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
          (n.cont ? '<p>' + esc(n.cont) + '</p>' : '') +
          '<label class="master-toggle" data-note="' + i + '">[ ] 标记为已掌握（仅本页提示，不记录、不统计）</label></div>';
      });
      if (st.examples && MR.bank) {
        body += '<div class="note"><h3>典型例题（来自真题题库）</h3>';
        st.examples.forEach(function (ex) {
          var q = (MR.bank.questions || []).filter(function (x) { return x.paper === ex.paper && x.no === ex.no; })[0];
          if (q) body += exBlock(q);
        });
        body += '</div>';
      }
    }
    $('station-body').innerHTML = body;
    $('station-body').onclick = function (e) {
      var t = e.target.closest('[data-note]'); if (!t) return;
      t.classList.toggle('on');
      t.textContent = (t.classList.contains('on') ? '[✓]' : '[ ]') + ' 标记为已掌握（仅本页提示，不记录、不统计）';
    };
    $('btn-station-skip').onclick = leave;
    $('btn-station-go').onclick = leave;
    function leave() { MR.leaveStation(run, st ? 'L' + layer : '' + layer); showMap(run); }
    show('station');
  }

  /* ================= 地图 ================= */
  function statBar(run) {
    var s = run.stats;
    var parts = [];
    if (run.mode === 'exam') {
      // 实战模式：交卷前一律不判分、不显示得分与对错
      parts.push('已答 <b>' + Object.keys(run.answers).length + '</b>/19');
      parts.push('难度 a<b>' + run.ax + '</b>');
    } else if (run.modeCfg.showPoints) {
      parts.push('当前得分 <b>' + s.earned + '</b> / 150');
    } else {
      parts.push('严谨度 <b>' + run.rigor + '</b>');
      parts.push('掌握度 <b>' + MR.round2(run.mastery) + '</b>');
    }
    if (run.mode !== 'exam') parts.push('正确 <b>' + s.correct + '</b>/' + s.answered);
    parts.push('紧急 ×<b>' + s.urgentCount + '</b>');
    return parts.join('　');
  }

  /* ================= 分支地图：节点图（方块 + 连线，可左右滑动） ================= */
  /* 把一层的所有题位画成"起点 → 每步上下两个节点"的路径图：
     方块是可选的作战节点，线表示能走的连接，走过的路高亮，当前位置的两个选择可点击。 */
  var MAP = { nodeW: 178, nodeH: 126, gapX: 88, entryW: 92, padX: 26, padY: 20, rowGap: 132 };

  function layerSlots(layer) {
    return MR.SLOTS.filter(function (s) { return s.layer === layer; });
  }

  function mapGeo(count) {
    var pitch = MAP.nodeW + MAP.gapX;
    function x(col) { return MAP.padX + (col === 0 ? 0 : MAP.entryW + MAP.gapX + (col - 1) * pitch); }
    function y(side) { return MAP.padY + (side === 'U' ? 0 : MAP.nodeH + MAP.rowGap); }
    return {
      x: x,
      y: y,
      entryMid: MAP.padY + MAP.nodeH + MAP.rowGap / 2,
      width: x(count) + MAP.nodeW + MAP.padX,
      height: y('D') + MAP.nodeH + MAP.padY
    };
  }

  function nodeBlock(node, state, rec, here, left, top, exam) {
    var badges = '<span class="badge ' + (node.urgent ? 'urgent' : 'normal') + '">' +
      (node.urgent ? '紧急作战' : '普通作战') + '</span>' +
      '<span class="badge type">' + esc(MR.QTYPE_NAME[node.qtype]) + '</span>' +
      '<span class="badge">a' + node.difficulty + '</span>';
    var mark = '';
    if (rec && exam) {
      // 实战模式交卷前不透露对错，只标"已答"，可以点回去改
      mark = '<span class="result pend">已答</span>';
    } else if (rec) {
      var mcls = rec.correct ? 'ok' : (rec.ratio > 0 ? 'half' : 'bad');
      mark = '<span class="result ' + mcls + '">' + (rec.correct ? '✓' : (rec.ratio > 0 ? '半' : '✗')) +
        ' ' + rec.earned + '/' + rec.max + '</span>';
    } else if (state === 'cur') {
      mark = '<span class="mpick">点我</span>';
    }
    var clickable = state === 'cur' || (exam && state === 'done');
    var cls = 'mnode ' + state + (node.urgent ? ' urgent' : '') + (rec ? ' walked' : '');
    return '<div class="' + cls + '"' + (clickable ? ' data-node-side="' + node.side + '" data-node-no="' + node.no + '" data-node-state="' + state + '"' : '') +
      ' style="left:' + left + 'px;top:' + top + 'px;width:' + MAP.nodeW + 'px;height:' + MAP.nodeH + 'px">' +
      (here ? '<span class="here">你在这里</span>' : '') + mark +
      '<b>' + (node.side === 'U' ? '上路' : '下路') + '</b>' +
      '<div class="mbadges">' + badges + '</div>' +
      '<div class="mtopic">考点：' + esc(node.topic) + '　' + node.points + ' 分</div></div>';
  }

  function showMap(run) {
    var slot = MR.currentSlot(run);
    var curLayer = slot.layer, curNo = slot.no;
    if (app.viewLayer == null || app.lastLayer !== curLayer) app.viewLayer = curLayer;
    app.lastLayer = curLayer;
    var view = app.viewLayer, isCurrent = view === curLayer;
    var slots = layerSlots(view);
    var geo = mapGeo(slots.length);
    var exam = run.mode === 'exam';
    var walk = {};
    (run.log || []).forEach(function (r) { walk[r.no] = r; });
    // 实战模式：run.log 要等交卷才有内容，所以"已答"看 run.answers；练习模式即时有记录
    function recOf(no) { return exam ? (run.answers[no] != null ? { answered: true } : null) : (walk[no] || null); }
    function walkSide(no) { return exam ? (run.sides[no] || null) : (walk[no] ? walk[no].side : null); }
    var doneCount = exam ? Object.keys(run.answers).length : 0;

    $('map-title').innerHTML = '第 <b>' + curNo + '</b> 题 / 19　' + esc(slot.layerName) +
      '　<span style="color:var(--dim);font-size:13px">难度 a' + run.ax + '（紧急 a' + Math.min(10, run.ax + 1) + '）· 种子 ' + esc(run.seed) + '</span>';
    $('map-stats').innerHTML = statBar(run);

    // 五层标签：当前层高亮，走过的层标亮，可以点回去看路线
    $('layer-tabs').innerHTML = MR.LAYERS.map(function (L) {
      var ss = layerSlots(L.layer);
      var done = !!walk[ss[ss.length - 1].no];
      var cls = L.layer === view ? 'cur' : (done ? 'done' : '');
      return '<button class="lt ' + cls + '" data-layer="' + L.layer + '">第' + L.layer + '层 · ' + esc(L.short) +
        ' · ' + ss.length + ' 题' + (done ? ' ✓' : '') + '</button>';
    }).join('');

    // 连线：起点 → 第 1 步两节点 → … → 最后一步
    var lines = [];
    for (var f = 0; f <= slots.length - 1; f++) {
      var fromSides = f === 0 ? ['S'] : ['U', 'D'];
      var fNo = f === 0 ? null : slots[f - 1].no;
      var tNo = slots[f].no;
      for (var a = 0; a < fromSides.length; a++) {
        for (var b = 0; b < 2; b++) {
          var fs = fromSides[a], ts = (b === 0 ? 'U' : 'D');
          var fSide = f === 0 ? 'S' : walkSide(fNo);
          var tSide = walkSide(tNo);
          var cls;
          if (isCurrent && tNo > curNo) cls = 'ghost';
          else if (isCurrent && tNo === curNo) cls = (f === 0 || fs === fSide) ? 'avail' : 'dim';
          else if (isCurrent) cls = (fs === fSide && ts === tSide) ? 'path' : 'dim';
          else cls = (fs === fSide && fSide !== null && ts === tSide && tSide !== null) ? 'path' : (tSide ? 'dim' : 'ghost');
          lines.push({
            x1: geo.x(f) + (f === 0 ? MAP.entryW : MAP.nodeW), y1: geo.y(fs === 'S' ? 'U' : fs) + MAP.nodeH / 2,
            x2: geo.x(f + 1), y2: geo.y(ts) + MAP.nodeH / 2, cls: cls
          });
        }
      }
    }
    $('map-lines').setAttribute('width', geo.width);
    $('map-lines').setAttribute('height', geo.height);
    $('map-lines').innerHTML = lines.map(function (l) {
      return '<line class="' + l.cls + '" x1="' + l.x1 + '" y1="' + l.y1 + '" x2="' + l.x2 + '" y2="' + l.y2 + '"/>';
    }).join('');

    // 节点方块
    var html = '<div class="mnode entry" style="left:' + geo.x(0) + 'px;top:' + geo.entryMid +
      'px;width:' + MAP.entryW + 'px;height:' + MAP.nodeH + 'px">起点</div>';
    var hereNo = null;
    if (isCurrent) {
      // "你在这里"= 本层上一个已答的节点（这一层还没答题就是起点）；全部答完（等交卷）就不标了
      var prev = slots.filter(function (s) { return s.no < curNo; });
      hereNo = prev.length ? prev[prev.length - 1].no : null;
      if (exam && run.answers[curNo] != null) hereNo = null;
    }
    slots.forEach(function (s, i) {
      ['U', 'D'].forEach(function (side) {
        var node = run.nodes[s.no][side];
        var st = recOf(s.no) ? 'done' : (isCurrent && s.no === curNo ? 'cur' : 'future');
        var rec = (recOf(s.no) && walkSide(s.no) === side) ? recOf(s.no) : null;
        html += nodeBlock(node, st, rec, hereNo === s.no && !!rec, geo.x(i + 1), geo.y(side), exam);
      });
    });
    $('map-nodes').innerHTML = html;
    $('map-canvas').style.width = geo.width + 'px';
    $('map-canvas').style.height = geo.height + 'px';

    // 左右滑动：拖动 / 滚轮 / 滚动条；进来时把当前这一列滚到视野里
    var sc = $('map-scroll');
    // 先让本界面显示出来，否则 #map-scroll 还没布局，clientWidth 是 0，滚动位置会算错
    show('map');
    sc.scrollLeft = Math.max(0, geo.x(isCurrent ? slot.step : 1) - Math.round(sc.clientWidth / 3));

    $('map-bar').innerHTML = (exam
      ? '<button id="btn-handin" class="btn primary small">交卷并判分</button>' +
        '<span>已答 <b>' + doneCount + '</b>/19' + (doneCount < 19 ? '（还有 ' + (19 - doneCount) + ' 题没答）' : '（可以点地图上任意已答的方块回去改答案）') +
        '　交卷前不判分、不显示答案。</span>'
      : (isCurrent
        ? '<span>按住拖动 / 滚轮 / 拖动下方滚动条，可以左右滑动看完整路线。</span>'
        : '<button id="btn-map-back" class="btn ghost small">← 回到当前层</button>' +
          '<span>这是第 ' + view + ' 层的路线图（' + (view < curLayer ? '已走过' : '还没走') + '），只供查看，不能在这里选。</span>'));
    if ($('btn-map-back')) $('btn-map-back').onclick = function () { app.viewLayer = curLayer; showMap(run); };
    if ($('btn-handin')) $('btn-handin').onclick = function () {
      if (doneCount < 19 && !confirm('还有 ' + (19 - doneCount) + ' 题没有作答，确定交卷吗？没答的题按 0 分计。')) return;
      // 大题（15~19）交卷后先进入阅卷：看标准答案、按给分标准自评，然后才统一判分
      if (MR.pendingSelf(run).length) { run.phase = 'review'; step(run); return; }
      MR.finalize(run);
      step(run);
    };

    $('layer-tabs').onclick = function (e) {
      var t = e.target.closest('[data-layer]'); if (!t) return;
      app.viewLayer = parseInt(t.dataset.layer, 10); showMap(run);
    };
    $('map-nodes').onclick = function (e) {
      var t = e.target.closest('[data-node-side]'); if (!t) return;
      var no = parseInt(t.dataset.nodeNo, 10);
      if (t.dataset.nodeState === 'done') MR.revisitSlot(run, no, t.dataset.nodeSide);
      else MR.pickSide(run, t.dataset.nodeSide);
      showQuestion(run);
    };
    // 拖动平移
    var drag = null;
    sc.onmousedown = function (e) {
      if (e.target.closest('[data-node-side]')) return;
      drag = { x: e.clientX, left: sc.scrollLeft }; sc.classList.add('drag');
    };
    sc.onmousemove = function (e) { if (drag) { sc.scrollLeft = drag.left - (e.clientX - drag.x); } };
    var stop = function () { drag = null; sc.classList.remove('drag'); };
    sc.onmouseup = stop; sc.onmouseleave = stop;
    sc.onwheel = function (e) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { sc.scrollLeft += e.deltaY; e.preventDefault(); }
    };

    // 已走路径：练习模式带对错；实战模式交卷前只标"已答"（不透露对错）
    var pathList = exam
      ? MR.SLOTS.filter(function (s) { return run.answers[s.no] != null; }).map(function (s) {
          var n = run.nodes[s.no][run.sides[s.no] || 'U'];
          return { no: s.no, side: n.side, urgent: n.urgent, pend: true };
        })
      : run.log;
    var picks = pathList.map(function (r) {
      return '<span class="pl">第' + r.no + '题 ' + (r.side === 'U' ? '上' : '下') + (r.urgent ? '·紧急' : '·普通') + ' ' +
        (r.pend ? '<b style="color:var(--dim)">已答</b>' : (r.correct ? '<b style="color:var(--good)">✓</b>' : '<b style="color:var(--bad)">✗</b>')) + '</span>';
    }).join('');
    $('path-log').innerHTML = '<div>已走路径：' + (picks || '（还没开始）') + '</div>' +
      '<div style="margin-top:6px">上路 ' + run.stats.upCount + ' 次 / 下路 ' + run.stats.downCount + ' 次　紧急 ' + run.stats.urgentCount +
      ' 次 / 普通 ' + run.stats.normalCount + ' 次</div>';
    show('map');
  }

  /* ================= 答题 ================= */
  function showQuestion(run, keepFeedback) {
    var q = run.question, node = run.node;
    $('q-title').innerHTML = '第 <b>' + node.no + '</b> 题 · ' + esc(MR.QTYPE_NAME[node.qtype]) +
      '　<span style="font-size:13px;color:var(--dim)">' + esc(node.layerName) + ' · ' + (node.urgent ? '紧急作战' : '普通作战') + ' a' + node.difficulty + ' · ' + node.points + ' 分</span>';
    $('q-stats').innerHTML = statBar(run);

    var html = '<div class="q-stem">' + esc(q.stem) + '</div>' +
      '<div class="q-topic">考点：' + esc(q.topic) + '　来源：' + esc(q.paper) + ' 第 ' + q.no + ' 题（真题原题）' +
      (q.difficultyFallback ? '　<span style="color:var(--warn)">· 本档位真题稀少，已就近回退到 a' + q.difficulty + '</span>' : '') + '</div>';
    if (q.figure) {
      // figure 有两种写法：图片路径（真题原图，裁自原卷）或纯文字图形说明
      html += /^(data:image\/|https?:|\/|.*\.(png|jpe?g|gif|svg|webp))$/i.test(q.figure)
        ? '<div class="q-figure"><img src="' + esc(q.figure) + '" alt="题目配图"></div>'
        : '<div class="q-figure">配图：' + esc(q.figure) + '</div>';
    }

    if (q.qtype === 'single' || q.qtype === 'multi') {
      html += '<div class="opts" data-kind="' + q.qtype + '">' + (q.options || []).map(function (o, i) {
        return '<label><input type="' + (q.qtype === 'single' ? 'radio' : 'checkbox') + '" name="opt" value="' + esc(o.key) + '"><span class="k">' + esc(o.key) + '</span><span>' + esc(o.text) + '</span></label>';
      }).join('') + '</div>';
    } else if (q.qtype === 'fill') {
      html += '<div class="fill-row"><input id="fill-input" type="text" autocomplete="off" placeholder="填答案（可写 3/2、√3、ln2 等）"></div>' + keypadHTML();
    } else {
      // 大题：和高考一样在纸上写过程，界面不给任何输入框
      html += '<div class="subs">' + (q.subs || []).map(function (s, i) {
        return '<div class="sub"><div class="sub-head">(' + (i + 1) + ')　' + (s.points || '') + ' 分</div>' +
          '<div class="sub-prompt">' + esc(s.prompt) + '</div></div>';
      }).join('') + '</div>';
      html += '<div class="paper-hint">✍️ 这道大题和真实考试一样：<b>过程写在草稿纸上</b>，界面不给输入框、不判对错。' +
        (run.mode === 'exam'
          ? '交卷后进入阅卷：对照标准答案，逐条勾出你确实做到的步骤，按勾中的分值计分。'
          : '写完后点下面的按钮，对照标准答案与给分标准自评（按勾中的步骤分值计分）。') + '</div>';
    }

    $('q-body').innerHTML = html;
    $('q-feedback').className = 'feedback hidden';
    $('q-feedback').innerHTML = '';
    var exam = run.mode === 'exam';
    var isBig = q.qtype === 'big';
    var hasSaved = exam && run.answers[node.no] != null;
    if (hasSaved) prefill(run.question, run.answers[node.no]);
    var btnText = exam ? (hasSaved ? '保存修改' : (run.cursor >= 18 ? '提交并检查' : '提交并继续')) : '提交答案';
    if (!exam && isBig) btnText = '写完了 · 对照标准答案自评';
    if (exam && isBig) btnText = hasSaved ? '保存修改' : '写完了 · 下一题';
    $('q-foot').innerHTML = '<button id="btn-submit" class="btn primary">' + btnText + '</button>' +
      '<span class="hint">' + (exam
        ? (hasSaved ? '这是第 ' + node.no + ' 题，可以改答案；保存后回到地图，交卷时统一判分。'
                    : (isBig ? '大题不给输入框：过程写在草稿纸上。交卷后进入阅卷，对照标准答案勾给分标准自评。'
                             : '实战模式：提交后不显示对错与答案，直接进入下一步；交卷时统一判分，答完可以回来改答案。'))
        : (isBig ? '大题不给输入框：过程写在草稿纸上，下一步对照给分标准自评。'
                 : '提交后显示答案与解析。' + (run.modeCfg.rigor ? '答错会扣严谨度。' : ''))) + '</span>';

    $('q-body').onmousedown = function (e) {
      // 点符号键盘不要把焦点从输入框抢走
      if (e.target.closest && e.target.closest('.sym')) e.preventDefault();
    };
    $('q-body').onclick = function (e) {
      var sym = e.target.closest && e.target.closest('.sym');
      if (sym) { insertSymbol(sym.dataset.sym); return; }
      var lab = e.target.closest('.opts label'); if (!lab) return;
      var box = lab.parentNode, multi = box.dataset.kind === 'multi';
      if (!multi) { box.querySelectorAll('label').forEach(function (l) { l.classList.remove('sel'); }); }
      lab.classList.toggle('sel', lab.querySelector('input').checked);
    };

    $('btn-submit').onclick = function () {
      // 练习模式大题：先展开标准答案 / 给分标准，再自评提交
      if (!exam && isBig) { revealBig(run); return; }
      var ans = isBig ? 'paper' : collect(run);
      if (exam) {
        // 实战模式：只记答案，不判分、不透露对错；回头改答案时留在原地，第一次作答则前进一步
        MR.recordAnswer(run, ans);
        if (run.revisit) { run.revisit = false; showMap(run); return; }
        if (run.cursor < 18) MR.next(run);
        run.phase = 'map';
        step(run);
        return;
      }
      var res = MR.submit(run, ans);
      renderFeedback(run, res);
      $('btn-submit').outerHTML = '<button id="btn-next" class="btn primary">' + (run.failed ? '严谨度归零 · 查看结算' : (run.cursor >= 18 ? '完成本局 · 查看结算' : '继续前进')) + '</button>';
      $('btn-next').onclick = function () {
        MR.next(run);
        step(run);
      };
    };
    show('question');
  }

  /* ---------- 填空题：常用数学符号键盘（点一下插到光标处） ---------- */
  var SYMBOLS = ['√', 'π', '≤', '≥', '≠', '±', '×', '÷', '·', '²', '³', '⁴', '₁', '₂', '₃',
                 '∈', '∉', '∪', '∩', '∞', 'α', 'β', 'θ', '∠', '△', '⊥', '∥', '→', '/', '(', ')'];

  function keypadHTML() {
    return '<div class="keypad">' + SYMBOLS.map(function (s) {
      return '<button type="button" class="sym" data-sym="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('') + '<span class="keypad-tip">常用数学符号：点一下插到光标处</span></div>';
  }

  function insertSymbol(sym) {
    var body = $('q-body');
    var act = document.activeElement;
    var inp = (act && act.tagName === 'INPUT' && body.contains(act)) ? act : body.querySelector('input[type=text]');
    if (!inp) return;
    var s = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
    var e = inp.selectionEnd == null ? s : inp.selectionEnd;
    inp.value = inp.value.slice(0, s) + sym + inp.value.slice(e);
    var pos = s + sym.length;
    inp.focus();
    try { inp.setSelectionRange(pos, pos); } catch (err) { /* 某些浏览器不支持，忽略 */ }
  }

  /* ---------- 大题：标准答案 + 给分标准自评区 ---------- */
  function selfGradeHTML(q, picks) {
    picks = picks || [];
    return '<div class="rubric-box"><h3>📋 标准答案与给分标准</h3>' +
      '<p class="rubric-tip">对照你在草稿纸上写的，<b>逐条勾出你确实做到的步骤</b>——勾中的分值之和就是这道题的得分。' +
      '给分标准是按官方解析的步骤折算的参考给分，仅供自评。</p>' +
      (q.subs || []).map(function (s, i) {
        var rubric = MR.rubricOf(s);
        var got = 0;
        (picks[i] || []).forEach(function (k) { if (rubric[k]) got += rubric[k].pts; });
        return '<div class="sub rubric" data-rubric="' + i + '">' +
          '<div class="sub-head">(' + (i + 1) + ')　' + (s.points || '') + ' 分　' +
          '<span class="ans">标准答案：<b>' + esc(MR.subAnswerText(s)) + '</b></span></div>' +
          '<div class="sub-prompt">' + esc(s.prompt) + '</div>' +
          rubric.map(function (r, k) {
            var on = (picks[i] || []).indexOf(k) >= 0;
            return '<label class="rub"><input type="checkbox" data-rub="' + i + '" data-idx="' + k + '" data-pts="' + r.pts + '"' +
              (on ? ' checked' : '') + '><span class="rp">' + r.pts + ' 分</span><span class="rt">' + esc(r.text) + '</span></label>';
          }).join('') +
          '<div class="sub-self">本小问自评：<b class="got" data-got="' + i + '">' + got + '</b> / ' + (s.points || 0) + ' 分</div>' +
          '</div>';
      }).join('') +
      '<div class="rubric-total">本大题自评合计：<b id="self-total">' + selfTotal(q, picks) + '</b> / ' + q.points + ' 分</div>' +
      '<div class="sol">解析：' + esc(q.solution || '（暂无解析）') + '</div></div>';
  }

  function selfTotal(q, picks) {
    var sum = 0;
    (q.subs || []).forEach(function (s, i) {
      var rubric = MR.rubricOf(s), got = 0;
      ((picks && picks[i]) || []).forEach(function (k) { if (rubric[k]) got += rubric[k].pts; });
      sum += Math.min(got, s.points || 0);
    });
    return sum;
  }

  /* 读界面上勾中的给分点：返回 [[给分点序号…], …]（每个小问一组） */
  function collectPicks(q) {
    var box = $('q-feedback');
    return (q.subs || []).map(function (s, i) {
      var out = [];
      box.querySelectorAll('input[data-rub="' + i + '"]:checked').forEach(function (inp) {
        out.push(parseInt(inp.dataset.idx, 10));
      });
      return out.sort(function (a, b) { return a - b; });
    });
  }

  /* 勾选时实时刷新"本小问/本大题"的自评分 */
  function bindSelfGrade(run) {
    var box = $('q-feedback'), q = run.question;
    box.className = 'feedback rubric-mode';
    box.onchange = function () {
      (q.subs || []).forEach(function (s, i) {
        var got = 0;
        box.querySelectorAll('input[data-rub="' + i + '"]:checked').forEach(function (inp) { got += Number(inp.dataset.pts) || 0; });
        if (got > (s.points || 0)) got = s.points || 0;
        var el = box.querySelector('[data-got="' + i + '"]'); if (el) el.textContent = got;
      });
      var picks = collectPicks(q);
      $('self-total').textContent = selfTotal(q, picks);
    };
  }

  /* 练习模式：大题"写完了" → 展开标准答案与给分标准，然后自评提交 */
  function revealBig(run) {
    var q = run.question;
    $('q-feedback').innerHTML = selfGradeHTML(q, run.selfGrades[run.node.no]);
    bindSelfGrade(run);
    $('q-foot').innerHTML = '<button id="btn-submit" class="btn primary">提交自评</button>' +
      '<span class="hint">按你勾中的步骤计分；全部没勾就是 0 分' +
      (run.modeCfg.rigor ? '（会扣严谨度）' : '') + '。</span>';
    $('btn-submit').onclick = function () {
      var picks = collectPicks(q);
      run.selfGrades[run.node.no] = picks;
      var res = MR.submit(run, picks);
      renderFeedback(run, res);
      $('btn-submit').outerHTML = '<button id="btn-next" class="btn primary">' +
        (run.failed ? '严谨度归零 · 查看结算' : (run.cursor >= 18 ? '完成本局 · 查看结算' : '继续前进')) + '</button>';
      $('btn-next').onclick = function () { MR.next(run); step(run); };
    };
    // 把视线移到给分标准
    $('q-feedback').scrollIntoView({ block: 'start' });
  }

  /* 实战模式交卷后：逐道大题阅卷（看标准答案 → 勾给分标准自评） */
  function showReview(run) {
    var pending = MR.pendingSelf(run);
    if (!pending.length) { MR.finalize(run); step(run); return; }
    var no = pending[0];
    var node = run.nodes[no][run.sides[no] || 'U'];
    var q = run.drawn[no];
    run.node = node; run.question = q; run.revisit = false;
    var exam = true;
    var html = '<div class="topbar"><span>阅卷　第 ' + no + ' 题 · 大题</span>' +
      '<span>剩余未阅：' + pending.length + ' 道　已答 ' + run.stats.answered + '/19</span></div>' +
      '<div class="q-card"><div class="q-stem">' + esc(q.stem) + '</div>' +
      '<div class="q-meta">考点：' + esc(node.topic) + '　来源：' + esc(q.paper) + '　满分 ' + node.points + ' 分</div>' +
      '<div class="subs">' + (q.subs || []).map(function (s, i) {
        return '<div class="sub"><div class="sub-head">(' + (i + 1) + ')　' + (s.points || '') + ' 分</div>' +
          '<div class="sub-prompt">' + esc(s.prompt) + '</div></div>';
      }).join('') + '</div></div>';
    $('q-body').innerHTML = html;
    $('q-feedback').innerHTML = selfGradeHTML(q, run.selfGrades[no]);
    bindSelfGrade(run);
    $('q-foot').innerHTML = '<button id="btn-submit" class="btn primary">这题阅完了</button>' +
      '<span class="hint">交卷后统一判分：客观题已自动判分，大题按你勾中的给分点计分。</span>';
    $('btn-submit').onclick = function () {
      MR.recordSelf(run, no, collectPicks(q));
      step(run);
    };
    $('q-body').onclick = null;
    $('q-body').onmousedown = null;
    show('question');
  }

  /* 实战模式回头改答案：把上次的作答填回界面 */
  function prefill(q, user) {
    if (user == null) return;
    var body = $('q-body');
    if (q.qtype === 'single' || q.qtype === 'multi') {
      var keys = [].concat(user);
      body.querySelectorAll('.opts label').forEach(function (l) {
        var inp = l.querySelector('input');
        if (keys.indexOf(inp.value) >= 0) { inp.checked = true; l.classList.add('sel'); }
      });
    } else if (q.qtype === 'fill') {
      if ($('fill-input')) $('fill-input').value = user;
    } else {
      (q.subs || []).forEach(function (s, i) {
        var u = (user && typeof user === 'object') ? user[i] : null;
        if (s.kind === 'choice') {
          var box = body.querySelector('.opts[data-sub="' + i + '"]');
          if (box) box.querySelectorAll('label').forEach(function (l) {
            var inp = l.querySelector('input');
            if (inp.value === u) { inp.checked = true; l.classList.add('sel'); }
          });
        } else if (s.kind === 'order') {
          var ol = body.querySelector('.order-list[data-order="' + i + '"]');
          if (ol && u && u.length) [].concat(u).forEach(function (itemKey, pos) {
            var sel = ol.querySelector('select[data-item="' + itemKey + '"]');
            if (sel) sel.value = String(pos + 1);
          });
        } else {
          var inp2 = body.querySelector('[data-sub="' + i + '"]');
          if (inp2) inp2.value = (u == null ? '' : u);
        }
      });
    }
  }

  function collect(run) {
    var q = run.question;
    if (q.qtype === 'single') {
      var r = $('q-body').querySelector('input[name=opt]:checked');
      return r ? r.value : '';
    }
    if (q.qtype === 'multi') {
      return Array.prototype.map.call($('q-body').querySelectorAll('input[name=opt]:checked'), function (i) { return i.value; });
    }
    if (q.qtype === 'fill') {
      var f = $('fill-input'); return f ? f.value : '';
    }
    return (q.subs || []).map(function (s, i) {
      if (s.kind === 'choice') {
        var c = $('q-body').querySelector('input[name=sub' + i + ']:checked');
        return c ? c.value : '';
      }
      if (s.kind === 'order') {
        var sel = $('q-body').querySelectorAll('[data-order="' + i + '"] select');
        var pairs = Array.prototype.map.call(sel, function (x) { return { key: x.dataset.item, pos: parseInt(x.value, 10) }; });
        pairs.sort(function (a, b) { return (a.pos || 99) - (b.pos || 99); });
        return pairs.map(function (p) { return p.key; });
      }
      var inp = $('q-body').querySelector('[data-sub="' + i + '"]');
      return inp ? inp.value : '';
    });
  }

  function renderFeedback(run, res) {
    var rec = res.record, g = res.graded, q = run.question;
    var cls = g.ratio === 1 ? '' : (g.ratio > 0 ? 'warn' : 'bad');
    var title = g.ratio === 1 ? '✅ 正确' : (g.ratio > 0 ? '🟡 部分正确' : '❌ 错误');
    var html = '<h3>' + title + '　得 ' + MR.round2(g.earned) + ' / ' + rec.max + ' 分' +
      (run.modeCfg.mastery ? '　掌握度 +' + MR.round2(g.ratio * (rec.urgent ? MR.BALANCE.masteryUrgent : MR.BALANCE.masteryNormal)) : '') + '</h3>';
    if (run.modeCfg.rigor) {
      html += '<div class="kv">严谨度：' + (g.ratio === 0 ? '<b style="color:var(--bad)">-' + (rec.urgent ? 2 : 1) + '</b>（剩 ' + run.rigor + '）' : '<b style="color:var(--good)">不扣</b>（剩 ' + run.rigor + '）') + '</div>';
    }
    if (q.qtype === 'single' || q.qtype === 'multi') {
      html += '<div class="kv">你的答案：<b>' + esc([].concat(rec.yourAnswer).join('') || '（空）') + '</b>　正确答案：<b>' + esc((q.answer || []).join('')) + '</b></div>';
    } else if (q.qtype === 'fill') {
      html += '<div class="kv">你的答案：<b>' + esc(rec.yourAnswer || '（空）') + '</b>　正确答案：<b>' + esc((q.accept || [q.answer]).join(' / ')) + '</b></div>';
    } else {
      // 大题：自评结果（勾中的给分点 → 得分）
      html += '<div class="kv">各小问（自评）：' + (g.subDetail || []).map(function (d, i) {
        var got = d.got != null ? d.got : d.points;
        return '(' + (i + 1) + ') ' + (d.correct ? '<b style="color:var(--good)">✓</b>' : '<b style="color:var(--bad)">✗</b>') +
          ' 自评 <b>' + got + '</b>/' + d.points + ' 分，标准答案 ' + esc(d.answer);
      }).join('　') + '</div>';
    }
    html += '<div class="sol">解析：' + esc(q.solution || '（暂无解析）') + '</div>';
    $('q-feedback').className = 'feedback ' + cls;
    $('q-feedback').innerHTML = html;
  }

  /* ================= 结算 ================= */
  function showSettle(run) {
    if (!app.settled) { app.settled = MR.settle(run); MR.commitRun(run, app.settled); }
    var S = app.settled, rep = S.report;
    var h = '<div class="settle">';

    if (S.ending) {
      h += '<div class="card ending"><h2>' + (S.ending.hidden ? '★ 隐藏结局解锁' : '结局') + '</h2>' +
        '<div class="big">' + S.ending.icon + ' ' + esc(S.ending.name) + '</div>' +
        '<p>' + esc(S.ending.desc) + '</p></div>';
    } else {
      h += '<div class="card"><h2>实战模式结算</h2><div class="big">' + rep.total + ' <span style="font-size:22px;color:var(--dim)">/ 150</span></div>' +
        '<p>' + esc(S.comment) + '</p></div>';
    }

    h += '<div class="card"><h2>本局数据</h2><div class="kpis">' +
      '<span>模式 <b>' + esc(S.report.modeName) + '</b></span>' +
      '<span>难度 <b>a' + rep.ax + '</b></span>' +
      '<span>种子 <b>' + esc(rep.seed) + '</b></span>' +
      '<span>作答 <b>' + rep.answered + '</b>/19</span>' +
      '<span>正确率 <b>' + Math.round(rep.accuracy * 100) + '%</b></span>' +
      (S.grade ? '<span>评价 <b>' + S.grade.g + '</b>（' + esc(S.grade.t) + '）</span>' : '') +
      (run.modeCfg.mastery ? '<span>掌握度 <b>' + rep.mastery + '</b></span>' : '') +
      (run.modeCfg.rigor ? '<span>严谨度剩余 <b>' + rep.rigor + '</b></span>' : '') +
      '<span>总用时 <b>' + esc(rep.timeText) + '</b></span>' +
      '<span>紧急作战 <b>' + rep.urgentCount + '</b> 次</span>' +
      '<span>路径偏好 <b>' + (rep.upCount >= rep.downCount ? '偏上路' : '偏下路') + '</b>（上 ' + rep.upCount + '/下 ' + rep.downCount + '）</span>' +
      '<span>第18题 <b>' + rep.q18.correct + '/' + rep.q18.total + '</b></span>' +
      '<span>第19题 <b>' + rep.q19.correct + '/' + rep.q19.total + '</b></span>' +
      (S.comment ? '' : '<span>等效分数 <b>' + rep.total + '</b>/150</span>') +
      '</div></div>';

    h += '<div class="card"><h2>知识点分析</h2><table><tr><th>题型</th><th>正确/作答</th><th>正确率</th></tr>' +
      ['single', 'multi', 'fill', 'big'].map(function (t) {
        var b = rep.byQtype[t]; if (!b.total) return '';
        return '<tr><td>' + MR.QTYPE_NAME[t] + '</td><td>' + b.correct + '/' + b.total + '</td><td>' + Math.round(b.correct / b.total * 100) + '%</td></tr>';
      }).join('') + '</table><table style="margin-top:12px"><tr><th>考点</th><th>正确/作答</th><th>正确率</th></tr>' +
      Object.keys(rep.byTopic).sort().map(function (t) {
        var b = rep.byTopic[t];
        var col = b.correct / b.total >= 0.8 ? 'var(--good)' : (b.correct / b.total >= 0.5 ? 'var(--warn)' : 'var(--bad)');
        return '<tr><td>' + esc(t) + '</td><td>' + b.correct + '/' + b.total + '</td><td style="color:' + col + '">' + Math.round(b.correct / b.total * 100) + '%</td></tr>';
      }).join('') + '</table></div>';

    h += '<div class="card wrong"><h2>错题报告（' + rep.wrongs.length + ' 题）</h2>';
    if (!rep.wrongs.length) h += '<p>本局没有错题。</p>';
    rep.wrongs.forEach(function (w) {
      h += '<div style="margin:10px 0 16px"><b>第 ' + w.no + ' 题（' + esc(w.paper) + ' 第 ' + w.paperNo + ' 题 · ' + esc(w.topic) + ' · ' + esc(MR.QTYPE_NAME[w.qtype]) + '）</b>' +
        '<div style="font-size:14px;color:var(--dim);white-space:pre-wrap;margin:6px 0">' + esc(w.stem) + '</div>' +
        '<div style="font-size:14px">正确答案：<b>' + esc(w.answerText || [].concat(w.answer || []).join('') || '（见解析）') + '</b>　你答：<b style="color:var(--bad)">' +
          esc(w.qtype === 'big' ? ('自评 ' + w.earned + ' 分（写在纸上）') : fmtYour(w.yourAnswer)) + '</b></div>' +
        '<div class="sol" style="margin-top:6px">' + esc(w.solution || '（暂无解析）') + '</div></div>';
    });
    h += '</div>';

    // 实战模式：交卷前一直不判分，所以这里给一份逐题回顾（对错、你的答案、正确答案、得分）
    if (run.mode === 'exam') {
      h += '<div class="card"><h2>试卷回顾（' + rep.answered + ' 题，交卷后统一判分）</h2>' +
        '<table><tr><th>题号</th><th>题型</th><th>考点</th><th>你的答案</th><th>正确答案</th><th>得分</th></tr>' +
        (run.log || []).slice().sort(function (a, b) { return a.no - b.no; }).map(function (r) {
          var col = r.correct ? 'var(--good)' : (r.ratio > 0 ? 'var(--warn)' : 'var(--bad)');
          return '<tr><td>' + r.no + '</td><td>' + esc(MR.QTYPE_NAME[r.qtype]) + '</td><td>' + esc(r.topic) + '</td>' +
            '<td style="color:' + (r.correct ? 'var(--good)' : 'var(--bad)') + '">' +
              esc(r.qtype === 'big' ? ('自评 ' + r.earned + ' 分（写在纸上）') : fmtYour(r.yourAnswer)) + '</td>' +
            '<td>' + esc(r.answerText || [].concat(r.answer || []).join('') || '（见解析）') + '</td>' +
            '<td style="color:' + col + '">' + r.earned + '/' + r.max + (r.skipped ? '（未作答）' : '') + '</td></tr>';
        }).join('') + '</table>' +
        '<div class="hint" style="margin-top:8px">每题解析见上面的错题报告（只列错题）；需要逐题解析可以点地图回看。</div></div>';
    }

    h += '<div class="foot"><button id="btn-again" class="btn primary">再来一局（同模式同难度）</button>' +
      '<button id="btn-home" class="btn ghost">回到主页</button>' +
      '<span class="hint">核心验证：你会为了刷题或看结局，反复重开这 19 道题吗？</span></div></div>';

    $('settle-body').innerHTML = h;
    $('btn-again').onclick = function () { $('seed-input').value = ''; start(); };
    $('btn-home').onclick = renderTitle;
    show('settle');
  }

  /* ================= 启动 ================= */
  window.addEventListener('DOMContentLoaded', function () {
    if (!MR || !MR.bank) console.warn('题库未加载');
    renderTitle();
  });
})();

</script>
