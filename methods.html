<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习方法 · 宏山科学院-铁一分部</title>
  <meta name="description" content="工欲善事，必先利器。宏山科学院-铁一分部学习方法板块。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="methods">

  <div id="headerSlot"></div>

  <main id="pageMain">

    <!-- 页首横幅 -->
    <section class="page-hero">
      <div data-contour></div>
      <div class="container">
        <p class="page-tag">SECTION 06 / METHODS</p>
        <h1 class="page-title">学习方法</h1>
        <p class="page-sub">工欲善事，必先利器</p>
      </div>
      <div class="tianshi tianshi-sm" aria-hidden="true">
        <div class="tianshi-cap"></div>
        <div class="tianshi-pillar"></div>
        <div class="tianshi-base"></div>
      </div>
    </section>

    <section class="page-body">
      <div class="container">

        <!-- 搜索与筛选（分类可按真实需求调整） -->
        <div class="method-toolbar">
          <div class="search-box">
            <span class="search-ico" aria-hidden="true">⌕</span>
            <input type="text" id="methodSearch" placeholder="搜索方法关键词…" autocomplete="off">
            <span class="search-key">SEARCH</span>
          </div>
          <div class="tabs" role="tablist">
            <button class="tab active" data-cat="all">全部</button>
            <button class="tab" data-cat="memory">记忆类</button>
            <button class="tab" data-cat="plan">规划类</button>
            <button class="tab" data-cat="note">笔记类</button>
          </div>
        </div>

        <!-- 方法卡片流（待录入） -->
        <div class="method-grid">
          <div class="empty-state" style="grid-column:1/-1">
            <p class="empty-ico" aria-hidden="true">◇</p>
            <p class="empty-text">暂无方法内容 · 等待真实数据录入</p>
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="footerSlot"></div>

  <script src="js/main.js"></script>
</body>
</html>
